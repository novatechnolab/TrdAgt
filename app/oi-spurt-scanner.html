          <span class="badge" style="background:rgba(255,255,255,0.1); color:#fff; font-weight:700; font-size:8.5px; padding:2px 6px; border-radius:4px; text-transform:uppercase;">BIAS: Not live</span>
        </div>
        <div style="font-size:9.5px; color:var(--muted); line-height:1.6;">
          <div><strong>State:</strong> <span style="color:#fff; font-weight:500;">Not live</span></div>
          <div><strong>Signal:</strong> <span style="color:#fff; font-weight:500;">Not live</span></div>
          <div><strong>Bias:</strong> <span style="color:#fff; font-weight:500;">Not live</span></div>
        </div>
      </div>
    </div>`;

      const maxPEOI = Math.max(...chain.map(r => r.pe_oi), 1);
      const maxCEOI = Math.max(...chain.map(r => r.ce_oi), 1);

      // Build previous state lookup map for real-time tick-by-tick arrows
      const prevMap = {};
      if (prevChain && prevChain.length) {
        prevChain.forEach(r => {
          prevMap[r.strike] = {
            ce_oi: r.ce_oi || 0,
            pe_oi: r.pe_oi || 0
          };
        });
      }

      const newArrowState = {};

      // Sort the chain by strike descending (max to low)
      const sortedChain = [...chain].sort((a, b) => b.strike - a.strike);
      const rows = sortedChain.map(r => {
        const isATM = r.strike === atm;
        const isMP = r.strike === maxPain;
        const pePct = r.pe_oi / maxPEOI;
        const cePct = r.ce_oi / maxCEOI;
        const rowCls = isMP ? 'mp-row' : isATM ? 'atm-row' : '';
        const sPCR = r.strike_pcr != null ? r.strike_pcr : (r.ce_oi > 0 ? (r.pe_oi / r.ce_oi) : null);
        const pcrStr = sPCR !== null ? fmt(sPCR, 2) : '–';
        const pcrColor = sPCR !== null ? (sPCR >= 1 ? 'var(--green)' : 'var(--red)') : 'var(--muted)';
        const strikeLbl = `
      ${isMP ? '<span class="mp-badge">MAX PAIN</span>' : ''}
      ${isATM ? '<span class="atm-badge">ATM</span>' : ''}
      ${fmt(r.strike, 0)}`;

        // BUG 5 FIX: Use backend EOD-baseline % directly (ce_oi_eod_chg_pct / pe_oi_eod_chg_pct).
        // Previous client-side recalc was (oi_chg / (curr_oi - oi_chg)) * 100 — same math but
        // redundant and diverges on rounding. Backend field is the authoritative value.
        const cePctChg = r.ce_oi_eod_chg_pct || 0;
        const cePctStr = cePctChg !== 0 ? ` <span style="font-size:9px; opacity:0.75">(${cePctChg > 0 ? '+' : ''}${cePctChg.toFixed(1)}%)</span>` : '';

        // Calculate PE % Change
        const pePctChg = r.pe_oi_eod_chg_pct || 0;
        const pePctStr = pePctChg !== 0 ? ` <span style="font-size:9px; opacity:0.75">(${pePctChg > 0 ? '+' : ''}${pePctChg.toFixed(1)}%)</span>` : '';

        // Real-time tick arrows comparison next to absolute CE/PE OI with Delta Count Support
        const lastCe = prevArrows[r.strike]?.ce || null;
        const lastPe = prevArrows[r.strike]?.pe || null;

        let ceDirection = lastCe ? lastCe.dir : '';
        let ceCount = lastCe ? lastCe.count : '';
        const prevStrike = prevMap[r.strike];

        if (prevStrike) {
          const prevCeVal = prevStrike.ce_oi;
          const diff = r.ce_oi - prevCeVal;
          if (diff > 0) {
            ceDirection = '▲';
            ceCount = '+' + fmtOI(diff);
          } else if (diff < 0) {
            ceDirection = '▼';
            ceCount = '-' + fmtOI(Math.abs(diff));
          }
        }

        // Save state for CE
        newArrowState[r.strike] = newArrowState[r.strike] || {};
        newArrowState[r.strike].ce = ceDirection ? { dir: ceDirection, count: ceCount } : null;

        let ceArrowStr = '';
        if (ceDirection === '▲') {
          const countDisplay = ceCount ? ` (${ceCount})` : '';
          ceArrowStr = ` <span class="arrow-up" style="color:var(--green); font-weight:bold; font-size:9.5px; margin-left:3px;" title="OI Increased since last refresh">▲${countDisplay}</span>`;
        } else if (ceDirection === '▼') {
          const countDisplay = ceCount ? ` (${ceCount})` : '';
          ceArrowStr = ` <span class="arrow-down" style="color:var(--red); font-weight:bold; font-size:9.5px; margin-left:3px;" title="OI Decreased since last refresh">▼${countDisplay}</span>`;
        }

        let peDirection = lastPe ? lastPe.dir : '';
        let peCount = lastPe ? lastPe.count : '';

        if (prevStrike) {
          const prevPeVal = prevStrike.pe_oi;
          const diff = r.pe_oi - prevPeVal;
          if (diff > 0) {
            peDirection = '▲';
            peCount = '+' + fmtOI(diff);
          } else if (diff < 0) {
            peDirection = '▼';
            peCount = '-' + fmtOI(Math.abs(diff));
          }
        }

        // Save state for PE
        newArrowState[r.strike].pe = peDirection ? { dir: peDirection, count: peCount } : null;

        let peArrowStr = '';
        if (peDirection === '▲') {
          const countDisplay = peCount ? ` (${peCount})` : '';
          peArrowStr = ` <span class="arrow-up" style="color:var(--green); font-weight:bold; font-size:9.5px; margin-left:3px;" title="OI Increased since last refresh">▲${countDisplay}</span>`;
        } else if (peDirection === '▼') {
          const countDisplay = peCount ? ` (${peCount})` : '';
          peArrowStr = ` <span class="arrow-down" style="color:var(--red); font-weight:bold; font-size:9.5px; margin-left:3px;" title="OI Decreased since last refresh">▼${countDisplay}</span>`;
        }

        const ceEodPct = r.ce_oi_eod_chg_pct || 0;
        const peEodPct = r.pe_oi_eod_chg_pct || 0;
        const ceEodStr = ceEodPct !== 0
          ? ` <span class="${ceEodPct > 0 ? 'pos' : 'neg'}" style="font-size:8.5px; font-weight:600; margin-left:3px;">(${ceEodPct > 0 ? '+' : ''}${ceEodPct.toFixed(1)}%)</span>`
          : '';
        const peEodStr = peEodPct !== 0
          ? ` <span class="${peEodPct > 0 ? 'pos' : 'neg'}" style="font-size:8.5px; font-weight:600; margin-left:3px;">(${peEodPct > 0 ? '+' : ''}${peEodPct.toFixed(1)}%)</span>`
          : '';

        // Per-strike action cell — derives color from action text
        const ceAct = r.ce_action || '';
        const peAct = r.pe_action || '';
        const actText = ceAct || peAct || '';
        const actColor = actText.includes('BUY') ? 'var(--green)' : actText.includes('WAIT') ? 'var(--yellow)' : 'var(--muted)';

        return `<tr class="${rowCls}">
      <td class="ce-cell" style="background:rgba(0,230,118,${(cePct * .35).toFixed(2)})">${fmtOI(r.ce_oi)}${ceEodStr}</td>
      <td><span class="${buCls(r.ce_buildup)}" style="font-size:9px; font-weight:600">${buAbbr(r.ce_buildup)}</span></td>
      <td class="${r.ce_oi_chg >= 0 ? 'pos' : 'neg'}">${r.ce_oi_chg >= 0 ? '+' : ''}${fmtOI(r.ce_oi_chg)}${cePctStr}</td>
      <td>₹${fmt(r.ce_ltp, 1)}</td>
      <td class="strike-td">${strikeLbl}</td>
      <td>₹${fmt(r.pe_ltp, 1)}</td>
      <td class="${r.pe_oi_chg >= 0 ? 'pos' : 'neg'}">${r.pe_oi_chg >= 0 ? '+' : ''}${fmtOI(r.pe_oi_chg)}${pePctStr}</td>
      <td><span class="${buCls(r.pe_buildup)}" style="font-size:9px; font-weight:600">${buAbbr(r.pe_buildup)}</span></td>
      <td class="pe-cell" style="background:rgba(255,61,113,${(pePct * .35).toFixed(2)})">${fmtOI(r.pe_oi)}${peEodStr}</td>
      <td style="color:${pcrColor}; font-weight: 600;">${pcrStr}</td>
      <td class="action-td" style="color:${actColor}; font-weight:600; font-size:9px; white-space:nowrap">${actText || '–'}</td>
    </tr>`;
      }).join('');

      if (prevDetails[sym]) {
        prevDetails[sym].arrowState = newArrowState;
      }

      const dsState = dualSide?.state || 'Not live';
      const dsSignal = dualSide?.signal || 'Not live';
      const dsBias = dualSide?.bias || 'Not live';

      const stateColor =
        dsState === 'RANGE_PINNING' ? 'var(--yellow)' :
          dsState === 'VOL_COILING' ? 'var(--accent)' :
            dsState === 'TRENDING' ? 'var(--green)' :
              dsState === 'Not live' ? 'var(--muted)' : 'var(--muted)';

      const biasBg =
        dsBias === 'NEUTRAL_THETA_FAVORABLE' ? 'var(--green)' :
          dsBias === 'NEUTRAL_BREAKOUT_WATCH' ? 'var(--yellow)' :
            'rgba(255, 255, 255, 0.1)';

      const biasText =
        (dsBias === 'NEUTRAL_THETA_FAVORABLE' || dsBias === 'NEUTRAL_BREAKOUT_WATCH') ? '#000' : '#fff';

      const dualSideHtml = `
      <div class="dual-side-alert" style="margin-top:12px; padding:10px 14px; border-radius:6px; background:rgba(255,255,255,0.02); border:1px dashed rgba(255,255,255,0.1); display:flex; flex-direction:column; gap:6px;">
        <div style="display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid rgba(255,255,255,0.05); padding-bottom:5px;">
          <span style="font-size:10px; font-weight:700; color:${stateColor}">🔄 STATE: ${dsState}</span>
          <span class="badge" style="background:${biasBg}; color:${biasText}; font-weight:700; font-size:8.5px; padding:2px 6px; border-radius:4px; text-transform:uppercase;">BIAS: ${dsBias}</span>
        </div>
        <div style="font-size:9.5px; color:var(--muted); line-height:1.6;">
          <div><strong>State:</strong> <span style="color:#fff; font-weight:500;">${dsState}</span></div>
          <div><strong>Signal:</strong> <span style="color:#fff; font-weight:500;">${dsSignal}</span></div>
          <div><strong>Bias:</strong> <span style="color:#fff; font-weight:500;">${dsBias}</span></div>
        </div>
      </div>`;

      return `
    <div class="sec-head">OI Chain Heatmap</div>
    <div class="heatmap-wrap">
      <div class="heatmap-header">
        <span class="hm-title">📊 OI CHAIN &nbsp;·&nbsp; ${expiry || '–'}</span>
        <div class="hm-meta">
          <span>Max Pain: <b class="kv-pivot">${maxPain ? fmt(maxPain, 0) : '–'}</b></span>
          <span>Spot: <b>${fmt(ltp)}</b></span>
          <span>${alertBadge(changes.straddle)}Straddle: <b>₹${straddle ? fmt(straddle, 1) : '–'}</b></span>
          <span>PCR: <b style="color:${pcr >= 1 ? 'var(--green)' : 'var(--red)'}">${pcr ? fmt(pcr, 2) : '–'}</b></span>
        </div>
      </div>
      <div class="hm-legend">
        <span><span class="leg-dot" style="background:var(--green)"></span>Call OI</span>
        <span><span class="leg-dot" style="background:var(--red)"></span>Put OI</span>
        <span><span class="leg-dot" style="background:var(--yellow)"></span>Max Pain</span>
        <span><span class="leg-dot" style="background:var(--accent)"></span>ATM</span>
      </div>
      <table class="hm-table">
        <thead><tr>
          <th>CE OI</th><th>CE Buildup</th><th>&Delta;OI</th><th>CE LTP</th>
          <th class="strike-th">STRIKE</th>
          <th>PE LTP</th><th>&Delta;OI</th><th>PE Buildup</th><th>PE OI</th>
          <th>PCR</th><th class="action-th">Action</th>
        </tr></thead>
        <tbody>${rows}</tbody>
      </table>
      ${dualSideHtml}
    </div>`;
    }

    // ─── AI Heatmap Analysis ─────────────────────────────
    async function runAiAnalysis(sym) {
      const btn = document.getElementById(`ai-btn-${sym}`);
      const body = document.getElementById(`ai-body-${sym}`);
      if (!btn || !body) return;

      // Initialize state object if not present
      if (!aiAnalysisCache[sym]) {
        aiAnalysisCache[sym] = { html: '', open: false, loaded: '0' };
      }

      // Toggle: if open and has content, just collapse and cache
      const isOpen = body.classList.contains('open');
      if (isOpen && body.dataset.loaded === '1') {
        body.classList.remove('open');
        btn.classList.remove('open');
        aiAnalysisCache[sym].open = false;
        return;
      }

      // If already open but failed/loading, let click re-trigger analysis
      if (isOpen && body.dataset.loaded === '0' && !btn.disabled) {
        // Fall through to run analysis
      } else if (!isOpen && body.dataset.loaded === '1') {
        // Just expand if already loaded but closed
        body.classList.add('open');
        btn.classList.add('open');
        aiAnalysisCache[sym].open = true;
        return;
      }

      // Get current symbol data
      const d = prevDetails[sym];
      if (!d || !d.chain_data || !d.chain_data.length) {
        const errHtml = '<div class="ai-error">⚠ No heatmap data loaded. Select a symbol and wait for data.</div>';
        body.innerHTML = errHtml;
        body.classList.add('open');
        btn.classList.add('open');
        aiAnalysisCache[sym] = { html: errHtml, open: true, loaded: '0' };
        return;
      }

      // Show loading state and cache it
      btn.disabled = true;
      btn.classList.add('loading', 'open');
      const loadHtml = '<div class="ai-spinner">✨ Analyzing heatmap with Gemini AI…</div>';
      body.innerHTML = loadHtml;
      body.classList.add('open');
      body.dataset.loaded = '0';
      aiAnalysisCache[sym] = { html: loadHtml, open: true, loaded: '0' };

      try {
        const payload = {
          chain_data: d.chain_data,
          pcr: d.pcr,
          spot: d.ltp ?? null,
          max_pain: d.max_pain,
          straddle: d.straddle,
          expiry: d.expiry,
          atm: d.atm
        };

        const res = await fetch(`/api/oi/symbol/${encodeURIComponent(sym)}/ai-analyze`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        const json = await res.json();

        if (!json.ok) {
          const errHtml = `<div class="ai-error">⚠ ${json.error || 'Unknown error'}</div>`;
          body.innerHTML = errHtml;
          body.dataset.loaded = '0';
          aiAnalysisCache[sym] = { html: errHtml, open: true, loaded: '0' };
        } else {
          // Convert simple markdown to HTML (headers, bold, bullets)
          const md = (json.analysis || '')
            .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
            .replace(/^## (.+)$/gm, '<h2>$1</h2>')
            .replace(/^### (.+)$/gm, '<h3>$1</h3>')
            .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
            .replace(/^- (.+)$/gm, '<li>$1</li>')
            .replace(/(<li>[\s\S]*?<\/li>)+/g, m => `<ul>${m}</ul>`)
            .replace(/\n{2,}/g, '</p><p>')
            .replace(/^(?!<[hul])/gm, '')
            .replace(/<\/p><p>\s*(<[hul])/g, '$1')
            .trim();

          const parsedHtml = `<div>${md}</div>`;
          body.innerHTML = parsedHtml;
          body.dataset.loaded = '1';
          aiAnalysisCache[sym] = { html: parsedHtml, open: true, loaded: '1' };
        }
      } catch (err) {
        const errHtml = `<div class="ai-error">⚠ Request failed: ${err.message}</div>`;
        body.innerHTML = errHtml;
        body.dataset.loaded = '0';
        aiAnalysisCache[sym] = { html: errHtml, open: true, loaded: '0' };
      } finally {
        btn.disabled = false;
        btn.classList.remove('loading');
      }
    }


    // ─── Events ─────────────────────────────────────────

    const searchInput = document.getElementById('search-input');
    const suggBox = document.getElementById('suggestions');
    searchInput.addEventListener('input', () => showSugg(searchInput.value.trim().toUpperCase()));
    searchInput.addEventListener('keydown', e => {
      if (e.key === 'ArrowDown') { e.preventDefault(); moveSugg(1); }
      else if (e.key === 'ArrowUp') { e.preventDefault(); moveSugg(-1); }
      else if (e.key === 'Enter') { suggBox.classList.remove('open'); const sym = searchInput.value.trim().toUpperCase(); if (sym) selectSymbol(sym); }
      else if (e.key === 'Escape') suggBox.classList.remove('open');
    });
    document.addEventListener('mousedown', e => { if (!e.target.closest('.search-wrap')) suggBox.classList.remove('open'); });
    document.getElementById('search-btn').addEventListener('click', () => { suggBox.classList.remove('open'); const sym = searchInput.value.trim().toUpperCase(); if (sym) selectSymbol(sym); });

    const slider = document.getElementById('min-pct-slider'), slVal = document.getElementById('min-pct-val');
    slider.addEventListener('input', () => { minPct = Number(slider.value); slVal.textContent = minPct + '%'; });
    slider.addEventListener('change', () => {
      prevRankMap = {};  // reset rank map — new threshold = fresh baseline, no misleading badges
      // B3 FIX: Debounce rapid slider drags — avoid burst API calls
      clearTimeout(_leftDebounce);
      _leftDebounce = setTimeout(() => loadSpurt(), 300);
    });
    // ─── Layer 3: Market Open Lifecycle Transition Watcher ─────────────
    let _wasMarketOpen = isMarketOpen();
    setInterval(() => {
      const nowOpen = isMarketOpen();
      if (nowOpen && !_wasMarketOpen) {
        _wasMarketOpen = true;
        // Market opened → restart refresh timers and update views
        loadSpurt();
        startLeftCountdown();
        if (activeTab) switchTab(activeTab);
      } else if (!nowOpen && _wasMarketOpen) {
        _wasMarketOpen = false;
        // Market closed → stop refresh timers
        clearInterval(leftTimer);
        leftTimer = null;
        Object.keys(tabTimers).forEach(sym => {
          clearInterval(tabTimers[sym]);
          delete tabTimers[sym];
        });
      }
    }, 60000);

    // ─── Boot ────────────────────────────────────────────
    loadSymbolList();
    loadSpurt();
    if (isMarketOpen()) {
      startLeftCountdown();
    }
  </script>
</body>

</html>
