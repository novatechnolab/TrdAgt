    async function fetchAccum() {
      try {
        const res = await fetch('/api/accumulation');

        if (res.status === 202) {
          // Scanner is still running — show progress in status bar
          try {
            const d = await res.json();
            const p = d.progress || {};
            const stEl = document.getElementById('accum-state');
            const pct = p.total > 0 ? ` ${p.current}/${p.total}` : '';
            _lastAccumStateText = `SCANNING${pct}`;
            _lastAccumStateColor = 'var(--amber)';
            if (stEl) {
              stEl.textContent = _lastAccumStateText;
              stEl.style.color = _lastAccumStateColor;
            }
          } catch(_) {}
          // Keep fast-polling until scan completes
          if (_accumPollInterval) { clearInterval(_accumPollInterval); _accumPollInterval = null; }
          _accumPollInterval = setInterval(fetchAccum, 5000);
          return;
        }

        if (!res.ok) return;
        const d = await res.json();
        // Reset scanner state color
        const stEl = document.getElementById('accum-state');
        if (stEl) stEl.style.color = '';
        const isFirstLoad = (_accumData === null);
        renderAccumDashboard(d);
        // Auto-expand on first successful data load only
        if (isFirstLoad && _accumCollapsed) {
          _accumCollapsed = false;
          const body = document.getElementById('accum-body');
          const arrow = document.getElementById('accum-toggle-arrow');
          if (body) body.style.display = 'block';
          if (arrow) arrow.textContent = '▲';
        }
      } catch (e) { /* silent — placeholder text stays visible */ }
    }

    function toggleAccumSection() {
      _accumCollapsed = !_accumCollapsed;
      _accumRestoreState();
    }

    function _accumRestoreState() {
      const body = document.getElementById('accum-body');
      const arrow = document.getElementById('accum-toggle-arrow');
      if (body) body.style.display = _accumCollapsed ? 'none' : 'block';
      if (arrow) arrow.textContent = _accumCollapsed ? '▼' : '▲';
      // If we have data and panel is expanded, re-render content after DOM recreation
      if (!_accumCollapsed && _accumData) renderAccumTable(_accumData);
    }

    function accumSetFilter(f) {
      _accumFilter = f;
      document.querySelectorAll('.accum-filter-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.af === f);
      });
      if (_accumData) renderAccumTable(_accumData);
    }

    function accumSetView(v) {
      _accumView = v;
      document.getElementById('accum-btn-simple').classList.toggle('active', v === 'simple');
      document.getElementById('accum-btn-advanced').classList.toggle('active', v === 'advanced');
      if (_accumData) renderAccumTable(_accumData);
    }

    function renderAccumDashboard(d) {
      _accumData = d;

      const stateMap = { PRE_MARKET:'PRE-MARKET', PRICE_DISCOVERY:'PRICE DISCOVERY', LIVE:'LIVE', EOD_MODE:'EOD MODE', SESSION_CLOSED:'CLOSED', MARKET_CLOSED:'CLOSED', LOADING:'LOADING' };
      _lastAccumStateText = stateMap[d.market_state] || d.market_state || '—';
      _lastAccumStateColor = '';
      const stEl = document.getElementById('accum-state');
      if (stEl) stEl.textContent = _lastAccumStateText;

      _lastAccumRegimeText = d.regime || '—';
      _lastAccumRegimeClass = 'as-val accum-regime ' + (d.regime || '');
      const regEl = document.getElementById('accum-regime');
      if (regEl) {
        regEl.textContent = _lastAccumRegimeText;
        regEl.className = _lastAccumRegimeClass;
      }

      _lastAccumVixText = d.india_vix ? d.india_vix.toFixed(1) : '—';
      _lastAccumVixColor = d.india_vix < 13 ? 'var(--green)' : d.india_vix < 17 ? 'var(--amber)' : 'var(--red)';
      const vixEl = document.getElementById('accum-vix');
      if (vixEl) {
        vixEl.textContent = _lastAccumVixText;
        vixEl.style.color = _lastAccumVixColor;
      }

      _lastAccumGiftText = d.gift_nifty ? d.gift_nifty.toFixed(0) : '—';
      const giftEl = document.getElementById('accum-gift');
      if (giftEl) giftEl.textContent = _lastAccumGiftText;

      _lastAccumBiasText = d.market_bias || '—';
      _lastAccumBiasColor = d.market_bias === 'BULLISH' ? 'var(--green)' : d.market_bias === 'CAUTIOUS' ? 'var(--red)' : 'var(--amber)';
      const biasEl = document.getElementById('accum-bias');
      if (biasEl) {
        biasEl.textContent = _lastAccumBiasText;
        biasEl.style.color = _lastAccumBiasColor;
      }

      // Max Pain
      const mp = (d.results || []).find(r => r.max_pain && r.max_pain.strike);
      _lastAccumMaxPainText = mp ? `${mp.max_pain.strike} ${mp.max_pain.direction === 'UP' ? '▲' : mp.max_pain.direction === 'DOWN' ? '▼' : '—'}` : '—';
      const mpEl = document.getElementById('accum-maxpain');
      if (mpEl) mpEl.textContent = _lastAccumMaxPainText;

      // PCR
      const pcrs = (d.results || []).map(r => r.pcr && r.pcr.pcr).filter(Boolean);
      _lastAccumPcrText = pcrs.length ? (pcrs.reduce((a,b) => a+b, 0) / pcrs.length).toFixed(2) : '—';
      const pcrEl = document.getElementById('accum-pcr');
      if (pcrEl) pcrEl.textContent = _lastAccumPcrText;

      // Grade counts
      const gc = d.stocks_in_accumulation || {};
      _lastAccumGradePill = `A: ${gc.A||0} · B: ${gc.B||0} · C: ${gc.C||0}`;
      const gpEl = document.getElementById('accum-grade-pill');
      if (gpEl) gpEl.textContent = _lastAccumGradePill;

      _lastAccumAbcText = `${gc.A||0} / ${gc.B||0} / ${gc.C||0}`;
      const abcEl = document.getElementById('accum-abc');
      if (abcEl) abcEl.textContent = _lastAccumAbcText;

      // Banners
      const bannersEl = document.getElementById('accum-banners');
      if (bannersEl) {
        let bh = '';
        if (d.market_state === 'SESSION_CLOSED') bh += '<div style="padding:5px 16px;font-size:0.65rem;font-weight:600;background:rgba(56,139,253,0.08);color:var(--blue);border-bottom:1px solid var(--border);">⏹ SESSION CLOSED — data for reference only</div>';
        if (d.expiry_day) bh += '<div style="padding:5px 16px;font-size:0.65rem;font-weight:600;background:rgba(188,140,255,0.08);color:var(--purple);border-bottom:1px solid var(--border);">⚡ EXPIRY DAY — max pain and OI walls take priority. Premium decay accelerates after 2 PM.</div>';
        if (d.oi_degraded) bh += '<div style="padding:5px 16px;font-size:0.65rem;font-weight:600;background:rgba(248,81,73,0.08);color:var(--red);border-bottom:1px solid var(--border);">⚠ OI DATA DEGRADED — grades based on price & volume only</div>';
        bannersEl.innerHTML = bh;

      // Breaking count
      const breakCount = (d.results || []).filter(r => r.state === 'BREAKING').length;
      const bcEl = document.getElementById('accum-cnt-breaking');

      renderAccumTable(d);

    function renderAccumBreaking(d) {
      const el = document.getElementById('accum-breaking-panel');
      if (!el) return;
      const breaking = (d.results || []).filter(r => r.state === 'BREAKING');
      if (!breaking.length) { el.innerHTML = ''; return; }
      let html = '<div class="accum-breaking-label">⚡ BREAKING NOW</div>';
      breaking.forEach(r => {
        const dir = r.direction === 'UP' ? '▲' : '▼';
        const col = r.direction === 'UP' ? 'var(--green)' : 'var(--red)';
        html += `<div class="accum-breaking-card">
          <span class="accum-bc-sym">${r.symbol}</span>
          <span class="accum-bc-dir" style="color:${col}">${dir}</span>
          <span class="accum-bc-price">₹${r.ltp}</span>
          <span class="accum-bc-target">Target: ₹${r.target1}</span>
          ${r.ce_wall ? `<span class="accum-bc-wall">Wall@${r.ce_wall}</span>` : ''}
        </div>`;
      });
      el.innerHTML = html;
    }

    function accumApplyFilter(results, filter) {
      const confOrder = { VERY_STRONG: 3, STRONG: 2, MODERATE: 1 };
      switch (filter) {
        case 'top5':
          return results.slice().sort((a, b) => (confOrder[b.confidence]||0) - (confOrder[a.confidence]||0) || b.coil_candles - a.coil_candles).slice(0, 5);
        case 'breaking':
          return results.filter(r => r.state === 'BREAKING');
        case 'hot':
          return results.filter(r => r.l3_score >= 6 || r.grade === 'A');
        case 'watch':
          return results.filter(r => r.grade === 'B');
        case 'dist':
          return results.filter(r => r.state === 'DISTRIBUTION');
        default:
          return results;
      }
    }

    function renderAccumTable(d) {
      const tbody = document.getElementById('accum-tbody');
      if (!tbody) return;

      let results = (d.results || []).slice();
      results = accumApplyFilter(results, _accumFilter);

      if (!results.length) {
        tbody.innerHTML = `<tr><td colspan="10">
          <div class="accum-empty">
            <div class="accum-empty-icon">◎</div>
            <div class="accum-empty-title">No setups match current filter</div>
            <div class="accum-empty-sub">Switch to All to see all accumulating stocks</div>
          </div>
        </td></tr>`;
        return;
      }

      const isEod = d.market_state === 'EOD_MODE';
      tbody.innerHTML = results.map(r => {
        // Direction
        const dirIcon = r.direction === 'UP' ? '<span class="accum-dir-up">▲</span>' :
                        r.direction === 'DOWN' ? '<span class="accum-dir-down">▼</span>' :
                        '<span class="accum-dir-none">—</span>';

        // Confidence
        const confLabels = { VERY_STRONG:'VERY STRONG', STRONG:'STRONG', MODERATE:'MODERATE' };
        const confDots = { VERY_STRONG:3, STRONG:2, MODERATE:1 };
        const nDots = confDots[r.confidence] || 0;
        const dotsHtml = [0,1,2].map(i => `<span class="accum-conf-dot ${i < nDots ? 'filled' : 'empty'}"></span>`).join('');
        const confHtml = `<div class="accum-conf"><div class="accum-conf-dots">${dotsHtml}</div><span class="accum-conf-${r.confidence}">${confLabels[r.confidence]||r.confidence}</span></div>`;

        // Grade
        const gradeHtml = `<span class="accum-grade accum-grade-${r.grade}">${r.grade}</span>`;

        // Wall tags
        const wallTagMap = { CE_WALL_OVERHEAD:'CE WALL', TRAPPED_IN_WALLS:'TRAPPED', PE_WALL_BELOW:'PE WALL', CE_CLEAR:'CLEAR', PE_CLEAR:'CLEAR' };
        const wallCls = { CE_WALL_OVERHEAD:'ce-wall', TRAPPED_IN_WALLS:'trapped', PE_WALL_BELOW:'pe-wall', CE_CLEAR:'clear', PE_CLEAR:'clear' };
        const wallHtml = (r.wall_tags && r.wall_tags.length)
          ? r.wall_tags.map(t => `<span class="accum-wall-tag ${wallCls[t]||''}">${wallTagMap[t]||t.replace(/_/g,' ')}</span>`).join(' ')
          : '<span style="color:var(--text-muted);font-size:0.6rem">CLEAR</span>';

        // Liquidity
        const liq = r.options_play && r.options_play.liquidity ? r.options_play.liquidity : '—';
        const liqColor = liq === 'GOOD' ? 'var(--green)' : liq === 'WIDE_SPREAD' ? 'var(--amber)' : liq === 'AVOID' ? 'var(--red)' : 'var(--text-muted)';

        // Options play
        let playHtml = '<span style="color:var(--text-muted);font-size:0.6rem">EOD only</span>';
        if (isEod && r.options_play && r.options_play.play) {
          const p = r.options_play.play;
          if (p === 'SKIP') {
            playHtml = `<span class="accum-opt-play accum-opt-SKIP">SKIP</span>`;
          } else {
            const tp = p.includes('CE') ? 'CE' : 'PE';
            playHtml = `<span class="accum-opt-play accum-opt-${tp}">${p.replace('_',' ')} ₹${r.options_play.strike||''}</span>`;
          }
        }

        // Tags
        const tags = (r.tags || []).filter(t => !t.startsWith('CE_') && !t.startsWith('PE_') && !t.startsWith('TRAPPED')).map(t => {
          const cls = t.includes('FAIL') ? 'accum-tag-warn' : t.includes('EVENT') ? 'accum-tag-warn' : t.includes('EXTENDED') ? 'accum-tag-green' : 'accum-tag-grey';
          return `<span class="accum-tag ${cls}">${t.replace(/_/g,' ')}</span>`;
        }).join('');

        // Trends
        const trends = r.trends || {};
        const trendHtml = `<div class="accum-trend-pills">
          <span class="accum-trend-pill ${trends.daily === 'Bullish' ? 'bullish' : trends.daily === 'Bearish' ? 'bearish' : ''}" title="Daily">D</span>
          <span class="accum-trend-pill ${trends.hourly === 'Bullish' ? 'bullish' : trends.hourly === 'Bearish' ? 'bearish' : ''}" title="Hourly">1H</span>
          <span class="accum-trend-pill ${trends['15min'] === 'Bullish' ? 'bullish' : trends['15min'] === 'Bearish' ? 'bearish' : ''}" title="15min">15M</span>
        </div>`;

        // Row class
        const isHot = r.grade === 'A' && r.l3_score >= 6;
        const rowCls = isHot ? 'accum-row-hot' : '';

        return `<tr class="${rowCls}">
          <td class="accum-col-sym" style="font-weight:700;">
            ${r.symbol}
            <div style="font-size:0.55rem;color:var(--text-muted);margin-top:1px;">${r.sector||''}</div>
            ${gradeHtml}
            ${tags}
          </td>
          <td class="accum-col-dir">${dirIcon}</td>
          <td class="accum-col-trend">${trendHtml}</td>
          <td class="accum-col-conf">${confHtml}</td>
          <td class="accum-col-brk" style="font-weight:600;">₹${r.breakout_level}</td>
          <td class="accum-col-stop" style="color:var(--text-muted);">₹${r.stop_level}</td>
          <td class="accum-col-coil">${r.time_in_coil}</td>
          <td class="accum-col-wall">${wallHtml}</td>
          <td class="accum-col-liq" style="color:${liqColor};font-size:0.62rem;">${liq.replace('_',' ')}</td>
          <td class="accum-col-play">${playHtml}</td>
        </tr>`;
      }).join('');
    }

    // ── Init ──────────────────────────────────────────────────────────────────
    fetchBoard();
    fetchEmaCrossovers();
    fetchLiveBreakouts();
    fetchAccum();

    // Independent EMA crossover poll — fires during market hours OR any time a scan
    // may have started on the backend (always poll every 30s so we catch the
    // scanning → progress bar transition even outside market hours).
    setInterval(() => {
      const now = new Date(new Date().toLocaleString('en-US', { timeZone: 'Asia/Kolkata' }));
      const h = now.getHours(), m = now.getMinutes(), d = now.getDay();
      const inMarket = d >= 1 && d <= 5 &&
        ((h === 9 && m >= 15) || (h >= 10 && h <= 14) || (h === 15 && m <= 30));
      // Always poll: when in market, when actively scanning, OR after-hours/weekends
      // (backend may have kicked off a new scan that changed status to 'scanning').
      // The 3s fast-poll inside fetchEmaCrossovers handles tight progress updates once
      // a scanning status is detected.
      if (inMarket || (crossoverData && crossoverData.status === 'scanning') || true) {
        fetchEmaCrossovers();
      }
    }, 30000);

    // Live Breakout poll — every 15 seconds during market hours
    setInterval(() => {
      const now = new Date(new Date().toLocaleString('en-US', { timeZone: 'Asia/Kolkata' }));
      const h = now.getHours(), m = now.getMinutes(), d = now.getDay();
      const inMarket = d >= 1 && d <= 5 &&
        ((h === 9 && m >= 15) || (h >= 10 && h <= 14) || (h === 15 && m <= 30));
      if (inMarket) fetchLiveBreakouts();
    }, 15000);

    // Accumulation Dashboard poll — 5s while scanning (202), 30s once data is loaded
    let _accumPollInterval = null;
    function _startAccumPoll() {
      if (_accumPollInterval) clearInterval(_accumPollInterval);
      const interval = (_accumData === null) ? 5000 : 30000;
      _accumPollInterval = setInterval(async () => {
        const wasNull = (_accumData === null);
        await fetchAccum();
        // If data just arrived, switch to slow poll
        if (wasNull && _accumData !== null) {
          _startAccumPoll();
        }
      }, interval);
    }
    _startAccumPoll();

    // ── Nifty Analyzer ────────────────────────────────────────────────────
    let _niftyCollapsed = true;
    let _lastNiftyBiasPill = '—';
    let _lastNiftyPillBg   = 'rgba(56,139,253,0.15)';
    let _lastNiftyPillColor = 'var(--blue)';

    let _niftyQuoteData = null;
    let _niftyBiasData = null;
    let _niftyCandlesData = null;
    let _niftySectorsData = null;

    function toggleNiftySection() {
      _niftyCollapsed = !_niftyCollapsed;
      _niftyRestoreState();
    }

    function _niftyRestoreState() {
      const body  = document.getElementById('nifty-body');
      const arrow = document.getElementById('nifty-toggle-arrow');
      if (body)  body.style.display  = _niftyCollapsed ? 'none' : 'block';
      if (arrow) arrow.textContent   = _niftyCollapsed ? '▼' : '▲';
    }

    function renderNiftyQuote(d) {
      if (!d) return;
      const priceEl = document.getElementById('nifty-price');
      if (priceEl && d.ltp !== undefined) priceEl.textContent = d.ltp.toLocaleString('en-IN', {minimumFractionDigits:2});
      const chgEl = document.getElementById('nifty-chg');
      if (chgEl && d.change !== undefined && d.change_pct !== undefined) {
        const up = d.change >= 0;
        chgEl.className = 'nifty-chg ' + (up ? 'up' : 'dn');
        chgEl.textContent = (up ? '▲ +' : '▼ ') + d.change.toFixed(2) + ' (' + (up ? '+' : '') + d.change_pct.toFixed(2) + '%)';
      }
      const timeEl = document.getElementById('nifty-time');
      if (timeEl && d.timestamp) timeEl.textContent = new Date(d.timestamp).toLocaleString('en-IN');
    }

    function renderNiftyBias(d) {
      if (!d) return;
      const readout = document.getElementById('nifty-bias-readout');
      if (readout && d.zone) {
        readout.className = 'nifty-bias-readout ' + d.zone;
        readout.textContent = d.zone.toUpperCase() + ' · Score ' + d.score + '/100';
      }
      const needle = document.getElementById('nifty-needle');
      if (needle && d.score !== undefined) needle.style.left = d.score + '%';

      // Update pill with zone info
      if (d.zone) {
        const zoneColors = { bullish: ['rgba(63,185,80,0.15)', 'var(--green)'], bearish: ['rgba(248,81,73,0.15)', 'var(--red)'], choppy: ['rgba(210,153,34,0.15)', 'var(--amber)'] };
        const zc = zoneColors[d.zone] || ['rgba(56,139,253,0.15)', 'var(--blue)'];
        _lastNiftyBiasPill  = d.zone.toUpperCase() + ' ' + d.score + '/100';
        _lastNiftyPillBg    = zc[0];
        _lastNiftyPillColor = zc[1];
        const pillEl = document.getElementById('nifty-bias-pill');
        if (pillEl) { pillEl.textContent = _lastNiftyBiasPill; pillEl.style.background = _lastNiftyPillBg; pillEl.style.color = _lastNiftyPillColor; }
      }

      const driversEl = document.getElementById('nifty-drivers');
      if (driversEl) {
        driversEl.innerHTML = '';
        (d.drivers || []).forEach(dr => {
          const sp = document.createElement('span');
          sp.className = 'nifty-driver';
          sp.innerHTML = '<span class="ndot ' + dr.tone + '"></span>' + dr.text;
          driversEl.appendChild(sp);
        });
      }

      const sigGrid = document.getElementById('nifty-signal-grid');
      if (sigGrid) {
        sigGrid.innerHTML = '';
        (d.drivers || []).forEach(dr => {
          const parts = dr.text.split(':');
          const k = parts[0];
          const v = parts.slice(1).join(':').trim();
          const card = document.createElement('div');
          card.className = 'nifty-signal-card';
          const toneClass = dr.tone === 'g' ? 'green' : dr.tone === 'r' ? 'red' : 'amber';
          card.innerHTML = '<div class="sk">' + k + '</div><div class="sv ' + toneClass + '">' + v + '</div>';
          sigGrid.appendChild(card);
        });
      }
    }

    function renderNiftyCandles(d) {
      if (!d) return;
      const svg = document.getElementById('nifty-candle-svg');
      if (!svg) return;
      svg.innerHTML = '';
      const candles = d.candles || [];
      if (!candles.length) return;
      const min = Math.min(...candles.map(c => c.l)), max = Math.max(...candles.map(c => c.h));
      const pad=10, W=640, H=160, cw=(W-pad*2)/candles.length;
      const y = v => H - pad - ((v-min)/(max-min||1))*(H-pad*2);
      const ns = 'http://www.w3.org/2000/svg';
      candles.forEach((c, i) => {
        const x = pad + i*cw + cw/2;
        const up = c.c >= c.o;
        const color = up ? '#3FB950' : '#F85149';
        const wick = document.createElementNS(ns, 'line');
        wick.setAttribute('x1',x); wick.setAttribute('x2',x);
        wick.setAttribute('y1',y(c.h)); wick.setAttribute('y2',y(c.l));
        wick.setAttribute('stroke', color); wick.setAttribute('stroke-width','1.2');
        svg.appendChild(wick);
        const bTop = y(Math.max(c.o,c.c));
        const bH   = Math.max(2, Math.abs(y(c.o)-y(c.c)));
        const rect = document.createElementNS(ns, 'rect');
        rect.setAttribute('x', x - cw*0.3); rect.setAttribute('y', bTop);
        rect.setAttribute('width', cw*0.6); rect.setAttribute('height', bH);
        rect.setAttribute('fill', color); rect.setAttribute('rx','1');
        svg.appendChild(rect);
      });
      const tagsEl = document.getElementById('nifty-pattern-tags');
      if (tagsEl) {
        tagsEl.innerHTML = '';
        (d.patterns || []).forEach(p => {
          const tag = document.createElement('span');
          tag.className = 'nifty-tag ' + (p.tone === 'bull' ? 'bull' : p.tone === 'bear' ? 'bear' : '');
          tag.textContent = p.pattern + ' — candle #' + (p.index+1);
          tagsEl.appendChild(tag);
        });
      }
    }

    // Set to track expanded sector accordions across board refreshes
    let _expandedSectors = new Set();

    function toggleNiftySector(sectorName) {
      if (_expandedSectors.has(sectorName)) {
        _expandedSectors.delete(sectorName);
      } else {
        _expandedSectors.add(sectorName);
      }
      if (_niftySectorsData) renderNiftySectors(_niftySectorsData);
    }

    /**
     * Renders Nifty 50 Sector Weightage multi-column table and collapsible constituent stocks.
     * Columns: SECTOR | GAIN | IMPACT | WT
     * Rationale:
     * - GAIN: Sector Index % change (constituent-weighted).
     * - IMPACT: Weighted contribution of sector to Nifty 50 overall movement: (Sector Gain % * Sector Wt %) / 100
     * - WT: Total Sector weight in Nifty 50.
     */
    function renderNiftySectors(d) {
      if (!d) return;
      const bar = document.getElementById('nifty-stacked-bar');
      if (bar) { bar.innerHTML = ''; (d.sectors||[]).forEach(s => { const seg=document.createElement('div'); seg.style.width=s.wt+'%'; seg.style.background=s.color; seg.title=s.name+' — '+s.wt+'%'; bar.appendChild(seg); }); }
      const list = document.getElementById('nifty-sector-list');
      if (list) {
        list.innerHTML = '';
        (d.sectors||[]).forEach(s => {
          const isExp = _expandedSectors.has(s.name);
          const hasStocks = s.stocks && s.stocks.length > 0;
          const arrow = hasStocks ? (isExp ? '▼' : '▶') : '';
          // Weighted Impact: contribution of this sector to Nifty 50 overall move %
          const impact = (s.chg * s.wt) / 100.0;

          const rowWrap = document.createElement('div');

          const row = document.createElement('div');
          row.className = 'nifty-sector-row';
          if (hasStocks) row.onclick = () => toggleNiftySector(s.name);
          row.innerHTML = '<div class="nifty-sector-left">'
            + '<span class="nifty-sector-arrow">' + arrow + '</span>'
            + '<span class="nifty-swatch" style="background:' + s.color + '"></span>'
            + '<span class="nifty-sector-name">' + s.name + '</span>'
            + '</div>'
            + '<div class="nifty-sector-right">'
            + '<span class="nifty-sector-chg ' + (s.chg >= 0 ? 'up' : 'dn') + '">' + (s.chg >= 0 ? '+' : '') + s.chg.toFixed(2) + '%</span>'
            + '<span class="nifty-sector-impact ' + (impact >= 0 ? 'up' : 'dn') + '">' + (impact >= 0 ? '+' : '') + impact.toFixed(2) + '%</span>'
            + '<span class="nifty-sector-wt">' + s.wt.toFixed(1) + '%</span>'
            + '</div>';
          rowWrap.appendChild(row);

          if (hasStocks && isExp) {
            const stockContainer = document.createElement('div');
            stockContainer.className = 'nifty-stock-container';
            s.stocks.forEach(st => {
              const stRow = document.createElement('div');
              stRow.className = 'nifty-stock-row';
              stRow.innerHTML = '<span class="nifty-stock-name">' + st.symbol + '</span>'
                + '<div class="nifty-stock-right">'
                + '<span class="nifty-sector-chg ' + (st.chg >= 0 ? 'up' : 'dn') + '">' + (st.chg >= 0 ? '+' : '') + st.chg.toFixed(2) + '%</span>'
                + '<span class="nifty-sector-impact" style="color:var(--text-faint);">—</span>'
                + '<span class="nifty-sector-wt" style="color:var(--text-muted);">' + st.wt.toFixed(1) + '%</span>'
                + '</div>';
              stockContainer.appendChild(stRow);
            });
            rowWrap.appendChild(stockContainer);
          }

          list.appendChild(rowWrap);
        });
      }
      const cnt = document.getElementById('nifty-sector-count');
      if (cnt) cnt.textContent = (d.sectors||[]).length + ' sectors';
      const tot = document.getElementById('nifty-total-wt');
      if (tot) tot.textContent = (d.total_weight||0).toFixed(1) + '%';
    }

    async function fetchNiftyQuote() {
      try {
        const r = await fetch('/api/index-quote');
        _niftyQuoteData = await r.json();
        renderNiftyQuote(_niftyQuoteData);
      } catch(e) {}
    }

    async function fetchNiftyBias() {
      try {
        const r = await fetch('/api/bias-score');
        _niftyBiasData = await r.json();
        renderNiftyBias(_niftyBiasData);
      } catch(e) {}
    }

    async function fetchNiftyCandles() {
      try {
        const r = await fetch('/api/candles');
        _niftyCandlesData = await r.json();
        renderNiftyCandles(_niftyCandlesData);
      } catch(e) {}
    }

    async function fetchNiftySectors() {
      try {
        const r = await fetch('/api/sector-weights');
        _niftySectorsData = await r.json();
        renderNiftySectors(_niftySectorsData);
      } catch(e) {}
    }

    async function refreshNifty() {
      await Promise.all([fetchNiftyQuote(), fetchNiftyBias(), fetchNiftyCandles(), fetchNiftySectors()]);
    }

    // Initial load + 15s poll
    refreshNifty();
    setInterval(refreshNifty, 15000);

    // ── OI Chain Heatmap ───────────────────────────────────────────────────
    let _niftyOiCollapsed = true;
    let _niftyOiData = null;

    function toggleNiftyOiSection() {
      _niftyOiCollapsed = !_niftyOiCollapsed;
      _niftyOiRestoreState();
    }

    function _niftyOiRestoreState() {
      const body  = document.getElementById('nifty-oi-body');
      const arrow = document.getElementById('nifty-oi-toggle-arrow');
      if (body)  body.style.display  = _niftyOiCollapsed ? 'none' : 'block';
      if (arrow) arrow.textContent   = _niftyOiCollapsed ? '▼' : '▲';
    }

    function formatOiNum(n) {
      if (n === undefined || n === null) return '—';
      const abs = Math.abs(n);
      if (abs >= 10000000) return (n / 10000000).toFixed(2) + ' Cr';
      if (abs >= 100000) return (n / 100000).toFixed(2) + ' L';
      if (abs >= 1000) return (n / 1000).toFixed(1) + 'K';
      return n.toString();
    }

    function formatOiChg(n) {
      if (n === undefined || n === null || n === 0) return '+-';
      const formatted = formatOiNum(n);
      return (n > 0 ? '+' : '') + formatted;
    }

    /**
     * Renders full-width 11-column OI Chain Heatmap table inside Nifty Analyzer.
     * Features:
     * - Descending Strike Order (highest strike at top down to lowest strike at bottom).
     * - Dynamic heat-map background tints for Call OI (green) and Put OI (red/pink).
     * - ATM (blue) and MAX PAIN (orange) strike row badging.
     */
    function renderNiftyOiChain(d) {
      if (!d) return;
      const expEl = document.getElementById('nifty-oi-exp');
      if (expEl) expEl.textContent = d.expiry || '—';
      const mpEl = document.getElementById('nifty-oi-mp');
      if (mpEl) mpEl.textContent = d.max_pain !== undefined ? d.max_pain.toLocaleString('en-IN') : '—';
      const spotEl = document.getElementById('nifty-oi-spot');
      if (spotEl) spotEl.textContent = d.spot_ltp !== undefined ? d.spot_ltp.toLocaleString('en-IN', {minimumFractionDigits:2}) : '—';
      const strdEl = document.getElementById('nifty-oi-straddle');
      if (strdEl) strdEl.textContent = d.straddle !== undefined ? '₹' + d.straddle.toFixed(1) : '—';
      const pcrEl = document.getElementById('nifty-oi-pcr');
      if (pcrEl) pcrEl.textContent = d.pcr !== undefined ? d.pcr.toFixed(2) : '—';

      // Summary Pill
      const pillEl = document.getElementById('nifty-oi-summary-pill');
      if (pillEl) {
        pillEl.textContent = 'MP: ' + (d.max_pain || '—') + ' · PCR: ' + (d.pcr !== undefined ? d.pcr.toFixed(2) : '—');
      }

      const tbody = document.getElementById('nifty-oi-tbody');
      if (!tbody) return;

      // Sort strikes in descending order (highest strike at top, e.g. 24,800 -> 23,900)
      const rows = (d.chain_data || []).slice().sort((a, b) => b.strike - a.strike);
      if (!rows.length) {
        tbody.innerHTML = '<tr><td colspan="11" style="text-align:center; padding:15px; color:var(--text-muted);">No OI Chain data available</td></tr>';
        return;
      }

      const maxCeOi = Math.max(...rows.map(r => r.ce_oi || 0));
      const maxPeOi = Math.max(...rows.map(r => r.pe_oi || 0));
      const atmStrike = d.atm;
      const maxPainStrike = d.max_pain;

      tbody.innerHTML = '';
      rows.forEach(r => {
        const tr = document.createElement('tr');
        if (r.strike === atmStrike) tr.classList.add('atm-row');
        else if (r.strike === maxPainStrike) tr.classList.add('maxpain-row');

        const ceAlpha = maxCeOi > 0 ? (0.05 + 0.35 * (r.ce_oi / maxCeOi)) : 0.05;
        const peAlpha = maxPeOi > 0 ? (0.05 + 0.35 * (r.pe_oi / maxPeOi)) : 0.05;
        const ceBg = 'background:rgba(63,185,80,' + ceAlpha.toFixed(2) + ');';
        const peBg = 'background:rgba(248,81,73,' + peAlpha.toFixed(2) + ');';

        let strikeBadge = '';
        if (r.strike === atmStrike) strikeBadge += '<span class="nifty-badge-atm">ATM</span>';
        if (r.strike === maxPainStrike) strikeBadge += '<span class="nifty-badge-mp">MAX PAIN</span>';

        const strikeStyle = (r.strike === atmStrike) ? 'color:var(--blue);font-weight:700;' : ((r.strike === maxPainStrike) ? 'color:var(--amber);font-weight:700;' : 'font-weight:700;');

        const ceBuildupColor = r.ce_buildup === 'Short Covering' || r.ce_buildup === 'Long Buildup' ? 'color:var(--green);' : (r.ce_buildup === 'Short Buildup' ? 'color:var(--red);' : 'color:var(--text-muted);');
        const peBuildupColor = r.pe_buildup === 'Short Covering' || r.pe_buildup === 'Long Buildup' ? 'color:var(--green);' : (r.pe_buildup === 'Short Buildup' ? 'color:var(--red);' : 'color:var(--text-muted);');

        const rowPcr = (r.ce_oi && r.ce_oi > 0) ? (r.pe_oi / r.ce_oi).toFixed(2) : '—';
        const pcrColor = rowPcr >= 1.0 ? 'color:var(--green);' : 'color:var(--red);';

        tr.innerHTML = '<td style="' + ceBg + '">' + formatOiNum(r.ce_oi) + '</td>'
          + '<td style="' + ceBuildupColor + '">' + (r.ce_buildup || 'Flat') + '</td>'
          + '<td style="color:var(--text-muted);">' + formatOiChg(r.ce_oi_chg) + '</td>'
          + '<td>₹' + (r.ce_ltp !== undefined ? r.ce_ltp.toFixed(1) : '—') + '</td>'
          + '<td style="' + strikeStyle + '">' + strikeBadge + r.strike.toLocaleString('en-IN') + '</td>'
          + '<td>₹' + (r.pe_ltp !== undefined ? r.pe_ltp.toFixed(1) : '—') + '</td>'
          + '<td style="color:var(--text-muted);">' + formatOiChg(r.pe_oi_chg) + '</td>'
          + '<td style="' + peBuildupColor + '">' + (r.pe_buildup || 'Flat') + '</td>'
          + '<td style="' + peBg + '">' + formatOiNum(r.pe_oi) + '</td>'
          + '<td style="' + pcrColor + '">' + rowPcr + '</td>'
          + '<td style="color:var(--text-muted);">' + (r.ce_action || r.pe_action || '–') + '</td>';

        tbody.appendChild(tr);
      });
    }

    async function fetchNiftyOiChain() {
      try {
        const r = await fetch('/api/oi/symbol/NIFTY');
        _niftyOiData = await r.json();
        renderNiftyOiChain(_niftyOiData);
      } catch(e) {}
    }

    // Initial load + 30s poll for OI Chain Heatmap
    fetchNiftyOiChain();
    setInterval(fetchNiftyOiChain, 30000);
  </script>
</body>

</html>
