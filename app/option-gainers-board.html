<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>F&amp;O Premium Gainers Board — TradeSignal</title>
  <meta name="description"
    content="Live F&O option premium gainers board — ranked by opening-to-current premium gain, updated every 5 minutes.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap"
    rel="stylesheet">
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #0d1117;
      --bg-card: #161b22;
      --bg-card2: #1c2128;
      --border: rgba(255, 255, 255, 0.07);
      --border2: rgba(255, 255, 255, 0.12);
      --text: #e6edf3;
      --text-muted: #7d8590;
      --green: #3fb950;
      --amber: #d29922;
      --orange: #db6d28;
      --red: #f85149;
      --blue: #388bfd;
      --purple: #bc8cff;
      --gold: #ffd700;
      --star-color: #f0a500;
      --run-color: #5b9bd5;
      --radius: 10px;
      --font: 'Inter', system-ui, sans-serif;
      --mono: 'JetBrains Mono', monospace;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
      font-size: 14px;
      min-height: 100vh;
      min-width: 1280px;
    }

    .header,
    .controls,
    #eod-banner {
      min-width: 1280px;
    }

    /* ── Header ── */
    .header {
      background: var(--bg-card);
      border-bottom: 1px solid var(--border);
      padding: 14px 24px;
      display: flex;
      align-items: center;
      gap: 16px;
      position: sticky;
      top: 0;
      z-index: 100;
      backdrop-filter: blur(12px);
    }

    .header-brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 700;
      font-size: 1.05rem;
      letter-spacing: -0.02em;
    }

    .header-brand span {
      font-size: 1.4rem;
    }

    .header-sub {
      font-size: 0.72rem;
      color: var(--text-muted);
      margin-left: 2px;
    }

    .header-right {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    /* Live badge */
    .live-badge {
      display: flex;
      align-items: center;
      gap: 6px;
      background: rgba(63, 185, 80, 0.12);
      border: 1px solid rgba(63, 185, 80, 0.25);
      border-radius: 20px;
      padding: 4px 12px;
      font-size: 0.72rem;
      font-weight: 600;
      color: var(--green);
      letter-spacing: 0.04em;
    }

    .live-dot {
      width: 7px;
      height: 7px;
      background: var(--green);
      border-radius: 50%;
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {

      0%,
      100% {
        opacity: 1;
        transform: scale(1);
      }

      50% {
        opacity: 0.5;
        transform: scale(0.8);
      }
    }

    .refresh-btn {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--border2);
      color: var(--text);
      padding: 6px 14px;
      border-radius: 7px;
      font-size: 0.78rem;
      cursor: pointer;
      font-family: var(--font);
      font-weight: 500;
      transition: all 0.2s;
    }

    .refresh-btn:hover {
      background: rgba(255, 255, 255, 0.1);
    }

    /* ── Stats bar ── */
    .stats-bar {
      display: flex;
      gap: 1px;
      background: var(--border);
      border-bottom: 1px solid var(--border);
      overflow-x: auto;
    }

    .stat-item {
      flex: 1;
      min-width: 130px;
      background: var(--bg-card);
      padding: 12px 20px;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .stat-label {
      font-size: 0.68rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-muted);
      font-weight: 600;
    }

    .stat-value {
      font-size: 1.35rem;
      font-weight: 700;
      font-family: var(--mono);
      color: var(--text);
      line-height: 1;
    }

    .stat-sub {
      font-size: 0.68rem;
      color: var(--text-muted);
    }

    /* ── Controls ── */
    .controls {
      display: none;
      padding: 14px 24px;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      border-bottom: 1px solid var(--border);
      background: var(--bg);
    }

    .controls.expanded {
      display: flex;
    }

    .controls-label {
      font-size: 0.72rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      font-weight: 600;
    }

    .filter-group {
      display: flex;
      gap: 4px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 3px;
    }

    .filter-btn {
      border: none;
      background: transparent;
      color: var(--text-muted);
      padding: 5px 12px;
      border-radius: 5px;
      font-size: 0.76rem;
      font-weight: 600;
      cursor: pointer;
      font-family: var(--font);
      transition: all 0.15s;
      white-space: nowrap;
    }

    .filter-btn:hover {
      color: var(--text);
      background: rgba(255, 255, 255, 0.06);
    }

    .filter-btn.active {
      background: rgba(56, 139, 253, 0.2);
      color: var(--blue);
    }

    .compact-stats {
      display: flex;
      align-items: center;
      gap: 16px;
      margin: 0 16px;
    }

    .compact-stat-item {
      display: flex;
      align-items: baseline;
      gap: 5px;
      background: rgba(255, 255, 255, 0.03);
      padding: 4px 10px;
      border-radius: 6px;
      border: 1px solid var(--border);
    }

    .compact-stat-label {
      font-size: 0.65rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      font-weight: 600;
    }

    .compact-stat-value {
      font-size: 0.82rem;
      font-weight: 700;
      color: var(--text);
      font-family: var(--mono);
    }

    .filter-toggle-btn {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--border2);
      color: var(--text);
      padding: 6px 14px;
      border-radius: 7px;
      font-size: 0.78rem;
      cursor: pointer;
      font-family: var(--font);
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
    }

    .filter-toggle-btn:hover {
      background: rgba(255, 255, 255, 0.1);
    }

    .filter-toggle-btn.active {
      background: rgba(56, 139, 253, 0.15);
      border-color: rgba(56, 139, 253, 0.4);
      color: var(--blue);
    }

    .countdown-compact {
      font-size: 0.72rem;
      color: var(--text-muted);
      font-family: var(--mono);
      white-space: nowrap;
    }

    .countdown-compact b {
      color: var(--text);
    }

    /* Removed max-width: 900px header query to keep header inline */

    /* ── Main grid ── */
    /* Unified Layout: Always 7 columns, side-by-side */
    .board {
      padding: 16px 20px;
      display: grid;
      grid-template-columns: repeat(7, minmax(0, 1fr));
      align-items: stretch;
      gap: 12px;
      min-width: 1280px;
    }

    .stock-cards-grid {
      grid-column: span 4;
      display: flex;
      flex-direction: column;
      gap: 8px;
      width: 100%;
      min-width: 0;
      overflow-x: auto;
      padding-bottom: 8px;
    }

    .board-right-bar-container {
      grid-column: span 3;
      display: flex;
      flex-direction: column;
      align-self: stretch;
    }

    /* ── Stock card ── */
    .stock-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      transition: border-color 0.2s, transform 0.2s;
    }

    .stock-card:hover {
      border-color: var(--border2);
      transform: translateY(-1px);
    }

    .card-header {
      display: flex;
      flex-direction: column;
      gap: 4px;
      padding: 8px 10px;
      border-bottom: 1px solid var(--border);
      background: var(--bg-card2);
    }

    .card-rank {
      font-size: 0.68rem;
      color: var(--text-muted);
      font-weight: 700;
      font-family: var(--mono);
      min-width: 20px;
    }

    .card-symbol {
      font-size: 0.92rem;
      font-weight: 700;
      letter-spacing: -0.01em;
      flex: 1;
    }

    .best-badge {
      font-size: 0.75rem;
      font-weight: 700;
      font-family: var(--mono);
      padding: 3px 9px;
      border-radius: 20px;
    }

    .best-fire {
      background: rgba(248, 81, 73, 0.15);
      color: #ff7b72;
      border: 1px solid rgba(248, 81, 73, 0.25);
    }

    .best-rocket {
      background: rgba(210, 153, 34, 0.15);
      color: #e3b341;
      border: 1px solid rgba(210, 153, 34, 0.25);
    }

    .best-up {
      background: rgba(63, 185, 80, 0.12);
      color: var(--green);
      border: 1px solid rgba(63, 185, 80, 0.22);
    }

    /* Contract rows */
    .contract-row {
      display: grid;
      grid-template-columns: 16px 1fr;
      align-items: center;
      gap: 6px;
      padding: 5px 10px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.03);
      transition: background 0.15s;
    }

    .contract-row:last-child {
      border-bottom: none;
    }

    .contract-row:hover {
      background: rgba(255, 255, 255, 0.025);
    }

    .layer-tag {
      font-size: 0.75rem;
    }

    .strike-info {
      display: flex;
      flex-direction: column;
      gap: 1px;
    }

    .strike-label {
      font-size: 0.78rem;
      font-weight: 600;
      font-family: var(--mono);
      color: var(--text);
    }

    .strike-detail {
      font-size: 0.65rem;
      color: var(--text-muted);
      font-family: var(--mono);
    }

    .opt-badge {
      font-size: 0.62rem;
      font-weight: 700;
      padding: 1px 5px;
      border-radius: 4px;
    }

    .opt-ce {
      background: rgba(63, 185, 80, 0.15);
      color: var(--green);
    }

    .opt-pe {
      background: rgba(248, 81, 73, 0.15);
      color: var(--red);
    }

    .gain-pct {
      font-size: 0.72rem;
      font-weight: 800;
      font-family: var(--mono);
      text-align: left;
      min-width: 0;
    }

    .gain-fire {
      color: #ff7b72;
    }

    .gain-rocket {
      color: #e3b341;
    }

    .gain-up {
      color: var(--green);
    }

    /* ── Confluence dots ── */
    .conf-row {
      display: flex;
      gap: 3px;
      align-items: center;
      margin-top: 3px;
    }

    .conf-pill {
      font-size: 0.58rem;
      font-weight: 700;
      padding: 1px 5px;
      border-radius: 3px;
      letter-spacing: 0.03em;
      cursor: default;
      transition: opacity 0.2s;
    }

    .conf-loading {
      background: rgba(125, 133, 144, 0.08);
      color: #7d8590;
      border: 1px solid rgba(125, 133, 144, 0.15);
    }

    .conf-bullish {
      background: rgba(63, 185, 80, 0.15);
      color: #3fb950;
      border: 1px solid rgba(63, 185, 80, 0.25);
    }

    .conf-bearish {
      background: rgba(248, 81, 73, 0.15);
      color: #ff7b72;
      border: 1px solid rgba(248, 81, 73, 0.25);
    }

    .conf-neutral {
      background: rgba(125, 133, 144, 0.15);
      color: #8b949e;
      border: 1px solid rgba(125, 133, 144, 0.2);
    }

    .card-title {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 0;
      min-width: 0;
    }

    /* Gain bar (mini progress indicator) */
    .gain-bar-wrap {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 2px;
      background: var(--border);
    }

    .gain-bar {
      height: 100%;
      background: linear-gradient(90deg, var(--green), var(--amber));
      transition: width 0.4s ease;
    }

    /* ── Empty / Loading state ── */
    .empty-state {
      grid-column: 1 / -1;
      text-align: center;
      padding: 80px 20px;
      color: var(--text-muted);
    }

    .empty-state .icon {
      font-size: 3rem;
      margin-bottom: 14px;
    }

    .empty-state h3 {
      font-size: 1.1rem;
      font-weight: 600;
      margin-bottom: 8px;
      color: var(--text);
    }

    .empty-state p {
      font-size: 0.82rem;
      line-height: 1.6;
    }

    /* ── Loading spinner ── */
    .spinner {
      width: 36px;
      height: 36px;
      border: 3px solid var(--border);
      border-top-color: var(--blue);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      margin: 0 auto 16px;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    /* ── Toast ── */
    .toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: var(--bg-card2);
      border: 1px solid var(--border2);
      border-radius: 9px;
      padding: 10px 16px;
      font-size: 0.8rem;
      color: var(--text);
      opacity: 0;
      transform: translateY(10px);
      transition: all 0.3s;
      z-index: 200;
      pointer-events: none;
    }

    .toast.show {
      opacity: 1;
      transform: translateY(0);
    }

    /* ── Scrollbar ── */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }

    ::-webkit-scrollbar-track {
      background: transparent;
    }

    ::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.1);
      border-radius: 3px;
    }

    /* ── Responsive ── */
    @media (max-width: 600px) {
      .board {
        padding: 12px;
        gap: 10px;
        grid-template-columns: 1fr;
      }

      .header {
        padding: 10px 14px;
      }

      .controls {
        padding: 10px 14px;
      }

      .stats-bar .stat-item {
        padding: 10px 14px;
      }
    }

    /* ── Right Bar Panel Layout ── */
    .board-right-bar-container {
      display: flex;
      flex-direction: column;
      gap: 12px;
      align-self: stretch;
      max-height: calc(100vh - 120px);
    }

    .crossover-columns-wrap {
      display: flex;
      flex-direction: row;
      /* Three side-by-side columns: Bulls, Bears, Live Breakouts */
      gap: 12px;
      flex: 1;
      min-height: 0;
      overflow: hidden;
    }

    .board-right-bar {
      display: flex;
      flex-direction: column;
      background: var(--bg-card);
      border: 1px solid var(--border2);
      border-radius: var(--radius);
      overflow: hidden;
      flex: 1;
      /* Share horizontal space equally */
      min-height: 200px;
    }

    /* ── Beautiful Live Breakouts Card ── */
    .live-breakout-horizontal-bar {
      display: flex;
      flex-direction: column;
      background: var(--bg-card);
      border: 1px solid rgba(255, 215, 0, 0.22);
      border-radius: var(--radius);
      padding: 10px 14px;
      flex: 0 0 196px;
      /* Doubled height for plenty of space! */
      overflow: hidden;
      box-shadow: 0 0 10px rgba(255, 215, 0, 0.02);
      gap: 8px;
    }

    .breakouts-horizontal-grid {
      display: flex;
      flex-direction: column;
      gap: 10px;
      flex: 1;
      min-height: 0;
    }

    .breakout-horizontal-row {
      display: flex;
      flex-direction: column;
      /* Stack headings and scroll pills vertically */
      align-items: flex-start;
      gap: 4px;
      flex: 1;
      min-height: 0;
      width: 100%;
    }

    .breakout-row-label {
      font-size: 0.58rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 4px;
      flex-shrink: 0;
    }

    .breakout-horizontal-scroll {
      display: flex;
      flex-direction: row;
      gap: 8px;
      overflow-x: auto;
      white-space: nowrap;
      padding: 4px 0;
      /* Extra room for custom scrollbar */
      align-items: center;
      flex: 1;
      min-width: 0;
      width: 100%;
    }

    .breakout-horizontal-scroll::-webkit-scrollbar {
      height: 4px;
    }

    .breakout-horizontal-scroll::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.1);
      border-radius: 2px;
    }

    .breakout-alert-pill {
      display: flex;
      flex-direction: column;
      gap: 3px;
      padding: 7px 10px;
      border-radius: 8px;
      margin-bottom: 5px;
      border: 1px solid transparent;
      font-size: 0.67rem;
    }

    .breakout-alert-pill.horizontal {
      display: inline-flex;
      flex-direction: row;
      align-items: center;
      gap: 5px;
      padding: 3px 6px;
      border-radius: 4px;
      font-size: 0.60rem;
      white-space: nowrap;
      flex-shrink: 0;
      margin-bottom: 0;
    }

    .squeeze-pill.horizontal {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: rgba(210, 153, 34, 0.08);
      border: 1px solid rgba(210, 153, 34, 0.25);
      color: #e3b341;
      padding: 3px 6px;
      border-radius: 4px;
      font-size: 0.60rem;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .breakout-alert-pill.grade-a {
      background: rgba(255, 215, 0, 0.07);
      border-color: rgba(255, 215, 0, 0.3);
    }

    .breakout-alert-pill.grade-b {
      background: rgba(63, 185, 80, 0.06);
      border-color: rgba(63, 185, 80, 0.2);
    }

    .breakout-alert-pill.bearish {
      background: rgba(255, 123, 114, 0.07);
      border-color: rgba(255, 123, 114, 0.25);
    }

    .squeeze-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 5px 10px;
      border-bottom: 1px solid var(--border);
      font-size: 0.66rem;
      color: var(--text-muted);
    }

    .squeeze-row:last-child {
      border-bottom: none;
    }

    .squeeze-sym {
      font-weight: 700;
      font-size: 0.72rem;
      color: var(--text);
      letter-spacing: 0.02em;
    }

    .squeeze-dur {
      background: rgba(210, 153, 34, 0.12);
      color: #e3b341;
      border-radius: 4px;
      padding: 1px 5px;
      font-size: 0.6rem;
      font-weight: 600;
    }

    .right-bar-header {
      padding: 16px 20px;
      border-bottom: 1px solid var(--border2);
    }

    .right-bar-title-wrap {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 4px;
    }

    .right-bar-title-wrap h3 {
      font-size: 0.98rem;
      font-weight: 600;
      color: var(--text);
      margin: 0;
    }

    .right-bar-header p {
      font-size: 0.72rem;
      color: var(--text-muted);
      margin: 0;
      line-height: 1.3;
    }

    .pulse-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--text-muted);
      position: relative;
    }

    .pulse-dot.active {
      background: #238636;
    }

    .pulse-dot.active::after {
      content: '';
      position: absolute;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: #238636;
      animation: pulse 1.8s infinite ease-in-out;
    }

    @keyframes pulse {
      0% {
        transform: scale(1);
        opacity: 0.8;
      }

      100% {
        transform: scale(2.8);
        opacity: 0;
      }
    }

    .right-bar-toolbar {
      padding: 12px 20px;
      background: rgba(22, 27, 34, 0.2);
      border-bottom: 1px solid var(--border2);
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .search-input-wrap {
      position: relative;
      display: flex;
      align-items: center;
    }

    .search-input-wrap input {
      width: 100%;
      background: rgba(13, 17, 23, 0.8);
      border: 1px solid var(--border2);
      border-radius: 6px;
      padding: 6px 10px 6px 28px;
      font-size: 0.75rem;
      color: var(--text);
      outline: none;
      transition: border-color 0.2s;
    }

    .search-input-wrap input:focus {
      border-color: #58a6ff;
    }

    .search-input-wrap .search-icon {
      position: absolute;
      left: 8px;
      font-size: 0.75rem;
      color: var(--text-muted);
      pointer-events: none;
    }

    .crossover-filters {
      display: flex;
      gap: 6px;
    }

    .filter-btn {
      flex: 1;
      background: rgba(13, 17, 23, 0.5);
      border: 1px solid var(--border2);
      border-radius: 5px;
      color: var(--text-muted);
      font-size: 0.7rem;
      padding: 4px 0;
      cursor: pointer;
      font-weight: 500;
      transition: all 0.2s;
    }

    .filter-btn:hover {
      color: var(--text);
      background: rgba(255, 255, 255, 0.05);
    }

    .filter-btn.active {
      color: #58a6ff;
      border-color: #58a6ff;
      background: rgba(88, 166, 255, 0.15);
    }

    .right-bar-list {
      flex: 1;
      overflow-y: auto;
      padding: 6px 8px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .crossover-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 6px 8px;
      background: rgba(22, 27, 34, 0.3);
      border: 1px solid var(--border2);
      border-radius: 5px;
      transition: transform 0.15s, border-color 0.15s;
    }

    .crossover-item:hover {
      transform: translateX(2px);
      border-color: rgba(88, 166, 255, 0.3);
    }

    .crossover-left {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .crossover-left-sub {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .cross-time-sub {
      font-size: 0.52rem;
      color: var(--text-muted);
      opacity: 0.85;
      background: rgba(255, 255, 255, 0.03);
      padding: 1px 3px;
      border-radius: 3px;
      border: 1px dashed rgba(255, 255, 255, 0.08);
      white-space: nowrap;
    }

    .flag-badge {
      background: linear-gradient(135deg, #f39c12, #e67e22);
      color: #fff;
      font-size: 0.52rem;
      font-weight: bold;
      padding: 1px 3px;
      border-radius: 3px;
      display: inline-flex;
      align-items: center;
      gap: 2px;
      animation: flagPulse 2s infinite ease-in-out;
      box-shadow: 0 0 6px rgba(243, 156, 18, 0.4);
      white-space: nowrap;
    }

    @keyframes flagPulse {
      0% {
        transform: scale(1);
        box-shadow: 0 0 4px rgba(243, 156, 18, 0.4);
      }

      50% {
        transform: scale(1.05);
        box-shadow: 0 0 10px rgba(243, 156, 18, 0.8);
      }

      100% {
        transform: scale(1);
        box-shadow: 0 0 4px rgba(243, 156, 18, 0.4);
      }
    }

    .crossover-item.new-entry {
      animation: highlightNew 3s ease;
    }

    @keyframes highlightNew {
      0% {
        background: rgba(243, 156, 18, 0.15);
        border-color: rgba(243, 156, 18, 0.4);
      }

      50% {
        background: rgba(243, 156, 18, 0.25);
        border-color: rgba(243, 156, 18, 0.6);
      }

      100% {
        background: rgba(22, 27, 34, 0.3);
        border-color: var(--border2);
      }
    }

    .crossover-symbol {
      font-size: 0.68rem;
      font-weight: 600;
      color: var(--text);
    }

    .alignment-badge {
      display: inline-block;
      font-size: 0.52rem;
      padding: 1px 4px;
      border-radius: 3px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.3px;
    }

    .alignment-badge.aligned-bull {
      background: rgba(35, 134, 54, 0.15);
      color: #3fb950;
      border: 1px solid rgba(63, 185, 80, 0.2);
    }

    .alignment-badge.aligned-bear {
      background: rgba(248, 81, 73, 0.15);
      color: #ff7b72;
      border: 1px solid rgba(255, 123, 114, 0.2);
    }

    .alignment-badge.mixed {
      background: rgba(255, 255, 255, 0.05);
      color: var(--text-muted);
      border: 1px solid var(--border2);
    }

    .crossover-right {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 5px;
    }

    .timeframes-strip {
      display: flex;
      gap: 4px;
    }

    .tf-pill {
      font-size: 0.44rem;
      font-weight: 800;
      padding: 0.5px 1.5px;
      border-radius: 2px;
      background: rgba(255, 255, 255, 0.04);
      color: var(--text-muted);
      border: 1px solid var(--border2);
      cursor: help;
      min-width: 14px;
      text-align: center;
      box-sizing: border-box;
    }

    .tf-pill.bullish {
      background: rgba(46, 160, 67, 0.2);
      color: #58d68d;
      border-color: rgba(88, 214, 141, 0.3);
    }

    .tf-pill.bearish {
      background: rgba(248, 81, 73, 0.2);
      color: #f88379;
      border-color: rgba(248, 131, 121, 0.3);
    }

    .cross-pill {
      font-size: 0.46rem;
      font-weight: 800;
      padding: 0.5px 3.5px;
      border-radius: 3px;
      text-transform: uppercase;
      animation: flash-badge 2s infinite ease-in-out;
      white-space: nowrap;
    }

    .cross-pill.bullish {
      background: #238636;
      color: #fff;
    }

    .cross-pill.bearish {
      background: #f85149;
      color: #fff;
    }

    @keyframes flash-badge {
      0% {
        opacity: 1;
      }

      50% {
        opacity: 0.6;
      }

      100% {
        opacity: 1;
      }
    }

    .right-bar-footer {
      padding: 8px 16px;
      background: rgba(22, 27, 34, 0.4);
      border-top: 1px solid var(--border2);
      display: flex;
      justify-content: space-between;
      font-size: 0.65rem;
      color: var(--text-muted);
    }

    /* Collapsible stock row layout */
    .stock-row-container {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: border-color 0.2s;
    }

    .stock-row-container:hover {
      border-color: var(--border2);
    }

    .stock-row-header {
      display: grid;
      grid-template-columns: 125px 65px 60px 60px 65px 70px 60px 60px 45px 50px 65px 1fr 95px;
      gap: 8px;
      align-items: center;
      padding: 10px 16px;
      cursor: pointer;
      user-select: none;
      background: var(--bg-card2);
    }

    .stock-row-header:hover {
      background: rgba(255, 255, 255, 0.02);
    }

    .col-symbol {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .col-spot {
      text-align: left;
    }

    .col-rvol {
      text-align: left;
    }

    .col-linearity {
      text-align: left;
      font-size: 0.68rem;
      font-weight: 700;
      color: #58a6ff;
    }

    .col-points {
      text-align: left;
      font-size: 0.68rem;
      font-weight: 700;
    }

    .col-highest {
      text-align: left;
    }

    .col-gap {
      text-align: left;
    }

    .col-inst {
      text-align: left;
    }

    .col-e9h {
      text-align: center;
      font-family: var(--mono);
      font-weight: 700;
      font-size: 0.78rem;
    }

    .col-fhvol {
      text-align: center;
      font-family: var(--mono);
      font-weight: 700;
      font-size: 0.72rem;
      line-height: 1.3;
    }

    .col-futbuild {
      text-align: center;
    }

    .col-netdrift {
      text-align: center;
      font-size: 0.78rem;
      font-family: var(--mono);
      font-weight: 700;
    }

    .col-timeframes {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 10px;
    }

    .expand-arrow {
      font-size: 0.65rem;
      color: var(--text-muted);
      transition: transform 0.2s ease;
      display: inline-block;
    }

    .stock-row-container.expanded .expand-arrow {
      transform: rotate(180deg);
    }

    .stock-row-details {
      border-top: 1px solid var(--border);
      background: rgba(0, 0, 0, 0.22);
      padding: 4px 0;
    }

    /* Option Cards (Matches screenshot specs) */
    .option-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 20px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.03);
    }

    .option-card:last-child {
      border-bottom: none;
    }

    .opt-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .opt-meta {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .strike-wrap {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .strike-price {
      font-size: 0.9rem;
      font-weight: 800;
      font-family: var(--mono);
      color: var(--text);
    }

    .opt-badge {
      font-size: 0.52rem;
      padding: 1.5px 4px;
      font-weight: 800;
      border-radius: 3px;
      line-height: 1;
    }

    .opt-pe {
      background: rgba(248, 81, 73, 0.15);
      color: var(--red);
    }

    .opt-ce {
      background: rgba(63, 185, 80, 0.15);
      color: var(--green);
    }

    .premium-flow {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.72rem;
      color: var(--text-muted);
      font-family: var(--mono);
    }

    .prem-arrow {
      font-size: 0.65rem;
      opacity: 0.45;
      margin: 0;
    }

    .opt-right {
      text-align: right;
    }

    .stock-board-header {
      display: grid;
      grid-template-columns: 125px 65px 60px 60px 65px 70px 60px 60px 45px 50px 65px 1fr 95px;
      gap: 8px;
      align-items: center;
      padding: 8px 16px;
      margin-bottom: 4px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }

    .stock-board-header div {
      color: var(--text-muted) !important;
      font-size: 0.65rem !important;
      font-weight: 700 !important;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .stock-board-header div.sortable {
      cursor: pointer;
      user-select: none;
    }

    .stock-board-header div.sortable:hover {
      color: var(--text) !important;
    }

    /* Keep all columns visible, no media query hiding col-linearity or col-points */

    /* ── Accumulation Dashboard ──────────────────────────────────────────── */
    .accum-panel-header {
      background: var(--bg-card2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 10px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      user-select: none;
      margin-top: 4px;
      transition: border-color 0.2s;
    }
    .accum-panel-header:hover { border-color: var(--border2); }

    .accum-body {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-top: none;
      border-radius: 0 0 var(--radius) var(--radius);
      overflow: hidden;
    }

    /* Mini status bar */
    .accum-status-bar {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 8px 16px;
      background: rgba(14, 17, 23, 0.6);
      border-bottom: 1px solid var(--border);
      font-size: 0.7rem;
      color: var(--text-muted);
      flex-wrap: wrap;
    }
    .accum-status-bar .as-label {
      font-size: 0.58rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-muted);
      font-weight: 600;
    }
    .accum-status-bar .as-val {
      font-weight: 700;
      color: var(--text);
      font-family: var(--mono);
    }
    .accum-status-item {
      display: flex;
      flex-direction: column;
      gap: 1px;
      padding: 0 10px;
      border-right: 1px solid var(--border);
    }
    .accum-status-item:last-child { border-right: none; }

    /* Regime badge */
    .accum-regime {
      font-size: 0.6rem;
      font-weight: 600;
      padding: 1px 6px;
      border-radius: 3px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    .accum-regime.TRENDING  { background: rgba(63,185,80,0.15);  color: var(--green); }
    .accum-regime.SIDEWAYS  { background: rgba(210,153,34,0.15); color: var(--amber); }
    .accum-regime.VOLATILE  { background: rgba(248,81,73,0.15);  color: var(--red);   }
    .accum-regime.EXPIRY    { background: rgba(188,140,255,0.15);color: var(--purple);}

    /* Filter bar */
    .accum-filter-bar {
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 6px 12px;
      background: rgba(14, 17, 23, 0.4);
      border-bottom: 1px solid var(--border);
    }
    .accum-filter-btn {
      padding: 3px 10px;
      font-size: 0.62rem;
      font-weight: 600;
      font-family: var(--font);
      letter-spacing: 0.04em;
      cursor: pointer;
      background: transparent;
      color: var(--text-muted);
      border: 1px solid transparent;
      border-radius: 3px;
      transition: all 0.15s;
      text-transform: uppercase;
    }
    .accum-filter-btn:hover { border-color: var(--border2); color: var(--text); }
    .accum-filter-btn.active { background: rgba(56,139,253,0.15); border-color: rgba(56,139,253,0.3); color: var(--blue); }
    .accum-filter-sep { width: 1px; height: 16px; background: var(--border); margin: 0 2px; }
    .accum-view-toggle {
      margin-left: auto;
      display: flex;
      gap: 0;
      border: 1px solid var(--border2);
      border-radius: 4px;
      overflow: hidden;
    }
    .accum-view-btn {
      padding: 3px 8px;
      font-size: 0.6rem;
      font-weight: 600;
      font-family: var(--font);
      letter-spacing: 0.04em;
      cursor: pointer;
      background: transparent;
      color: var(--text-muted);
      border: none;
      transition: all 0.15s;
    }
    .accum-view-btn.active { background: var(--blue); color: var(--bg); }

    /* Breaking Now panel */
    .accum-breaking-panel {
      padding: 8px 12px;
    }
    .accum-breaking-panel:empty { display: none; }
    .accum-breaking-label {
      font-size: 0.6rem;
      font-weight: 700;
      color: var(--red);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .accum-breaking-label::after { content:''; flex:1; height:1px; background:rgba(248,81,73,0.2); }
    .accum-breaking-card {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: rgba(20,24,32,0.8);
      border: 1px solid var(--red);
      border-radius: 6px;
      padding: 8px 12px;
      margin: 0 6px 6px 0;
      animation: accumBreakGlow 1s ease-in-out infinite alternate;
    }
    @keyframes accumBreakGlow {
      from { box-shadow: 0 0 4px rgba(248,81,73,0.1); }
      to   { box-shadow: 0 0 14px rgba(248,81,73,0.3); }
    }
    .accum-bc-sym    { font-weight: 700; font-size: 0.82rem; }
    .accum-bc-dir    { font-size: 1rem; }
    .accum-bc-price  { font-size: 0.7rem; color: var(--text-muted); font-family: var(--mono); }
    .accum-bc-target { font-size: 0.65rem; color: var(--green); }
    .accum-bc-wall   { font-size: 0.55rem; background: rgba(210,153,34,0.15); color: var(--amber); padding: 1px 4px; border-radius: 2px; font-weight: 600; }

    /* Table */
    .accum-tbl-wrap { overflow-x: auto; }
    .accum-tbl {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
    }
    .accum-tbl thead th {
      background: rgba(20,24,32,0.8);
      border-bottom: 1px solid var(--border2);
      padding: 6px 10px;
      text-align: left;
      font-size: 0.56rem;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      white-space: nowrap;
    }
    .accum-tbl tbody tr {
      border-bottom: 1px solid var(--border);
      transition: background 0.1s;
    }
    .accum-tbl tbody tr:hover { background: rgba(20,24,32,0.5); }
    .accum-tbl tbody td {
      padding: 7px 10px;
      vertical-align: middle;
      font-size: 0.72rem;
    }

    /* Accum table column widths */
    .accum-col-sym   { width: 110px; }
    .accum-col-dir   { width: 40px; text-align: center; }
    .accum-col-trend { width: 90px; }
    .accum-col-conf  { width: 120px; }
    .accum-col-brk   { width: 80px; }
    .accum-col-stop  { width: 70px; }
    .accum-col-coil  { width: 70px; }
    .accum-col-wall  { width: 100px; }
    .accum-col-liq   { width: 70px; }
    .accum-col-play  { width: 90px; }

    /* Grade badge */
    .accum-grade {
      font-size: 0.65rem;
      font-weight: 700;
      padding: 1px 5px;
      border-radius: 3px;
      letter-spacing: 0.03em;
    }
    .accum-grade-A { background: rgba(63,185,80,0.15);  color: var(--green); }
    .accum-grade-B { background: rgba(210,153,34,0.15); color: var(--amber); }
    .accum-grade-C { background: rgba(56,139,253,0.15); color: var(--blue);  }

    /* Direction arrows */
    .accum-dir-up   { color: var(--green); font-size: 0.9rem; font-weight: 700; }
    .accum-dir-down { color: var(--red);   font-size: 0.9rem; font-weight: 700; }
    .accum-dir-none { color: var(--text-muted); }

    /* Confidence */
    .accum-conf {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 0.62rem;
      font-weight: 700;
      letter-spacing: 0.03em;
    }
    .accum-conf-dots { display: flex; gap: 2px; }
    .accum-conf-dot {
      width: 6px; height: 6px; border-radius: 50%;
    }
    .accum-conf-dot.filled { background: var(--green); }
    .accum-conf-dot.half   { background: var(--green); }
    .accum-conf-dot.empty  { background: rgba(255,255,255,0.08); border: 1px solid var(--border2); }
    .accum-conf-VERY_STRONG { color: var(--green); }
    .accum-conf-STRONG      { color: var(--green); }
    .accum-conf-MODERATE    { color: var(--amber); }

    /* Wall tags */
    .accum-wall-tag {
      display: inline-block;
      font-size: 0.52rem;
      font-weight: 700;
      padding: 1px 4px;
      border-radius: 2px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }
    .accum-wall-tag.ce-wall  { background: rgba(248,81,73,0.12);  color: var(--red);   }
    .accum-wall-tag.trapped  { background: rgba(248,81,73,0.12);  color: var(--red);   }
    .accum-wall-tag.pe-wall  { background: rgba(63,185,80,0.12);  color: var(--green); }
    .accum-wall-tag.clear    { background: rgba(63,185,80,0.08);  color: var(--green); }

    /* State badges */
    .accum-state-BREAKING     { color: var(--red);    font-size: 0.62rem; font-weight: 700; }
    .accum-state-DISTRIBUTION { color: var(--amber);  font-size: 0.62rem; font-weight: 600; }
    .accum-state-ACCUMULATING { color: var(--text-muted); font-size: 0.62rem; }

    /* Tags */
    .accum-tag {
      display: inline-block;
      font-size: 0.5rem;
      font-weight: 600;
      padding: 1px 4px;
      border-radius: 2px;
      margin: 1px 1px 0 0;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    .accum-tag-warn  { background: rgba(210,153,34,0.15); color: var(--amber); }
    .accum-tag-green { background: rgba(63,185,80,0.12);  color: var(--green); }
    .accum-tag-grey  { background: rgba(255,255,255,0.05); color: var(--text-muted); }

    /* Trend pills */
    .accum-trend-pills {
      display: flex;
      gap: 3px;
    }
    .accum-trend-pill {
      font-size: 0.48rem;
      font-weight: 800;
      padding: 1px 3px;
      border-radius: 2px;
      background: rgba(255,255,255,0.04);
      color: var(--text-muted);
      border: 1px solid var(--border2);
      min-width: 14px;
      text-align: center;
    }
    .accum-trend-pill.bullish { background: rgba(63,185,80,0.2); color: #58d68d; border-color: rgba(88,214,141,0.3); }
    .accum-trend-pill.bearish { background: rgba(248,81,73,0.2); color: #f88379; border-color: rgba(248,131,121,0.3); }

    /* Options play */
    .accum-opt-play {
      font-size: 0.6rem;
      font-weight: 600;
      padding: 1px 5px;
      border-radius: 3px;
    }
    .accum-opt-CE   { background: rgba(63,185,80,0.12);  color: var(--green); }
    .accum-opt-PE   { background: rgba(248,81,73,0.12);  color: var(--red);   }
    .accum-opt-SKIP { background: rgba(255,255,255,0.05); color: var(--text-muted); }

    /* Empty state */
    .accum-empty {
      text-align: center;
      padding: 30px 16px;
      color: var(--text-muted);
    }
    .accum-empty-icon { font-size: 1.6rem; margin-bottom: 8px; }
    .accum-empty-title { font-size: 0.82rem; font-weight: 600; color: var(--text); margin-bottom: 4px; }
    .accum-empty-sub { font-size: 0.68rem; }

    /* Row hot highlight */
    .accum-tbl tbody tr.accum-row-hot {
      box-shadow: inset 3px 0 0 var(--green);
      background: rgba(63,185,80,0.03);
    }

    /* ── Nifty Analyzer ──────────────────────────────────────────────────── */
    .nifty-body {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-top: none;
      border-radius: 0 0 var(--radius) var(--radius);
      overflow: hidden;
      padding: 14px 16px;
    }
    .nifty-header-strip {
      display: flex; justify-content: space-between; align-items: center;
      padding: 10px 0 12px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 12px;
      flex-wrap: wrap; gap: 8px;
    }
    .nifty-price { font-family: var(--mono); font-size: 1.45rem; font-weight: 700; color: var(--text); }
    .nifty-chg   { font-family: var(--mono); font-size: 0.8rem; font-weight: 600; margin-left: 8px; }
    .nifty-chg.up { color: var(--green); } .nifty-chg.dn { color: var(--red); }
    .nifty-meta  { font-family: var(--mono); font-size: 0.65rem; color: var(--text-muted); text-align: right; line-height: 1.5; }
    .nifty-live-dot { display:inline-block; width:6px; height:6px; border-radius:50%; background:var(--green); margin-right:5px; animation: pulse 1.8s infinite; }
    @keyframes pulse { 0%,100%{opacity:1;} 50%{opacity:0.3;} }

    /* Gauge */
    .nifty-gauge-panel { margin-bottom: 12px; }
    .nifty-gauge-label { display:flex; justify-content:space-between; align-items:baseline; margin-bottom:10px; }
    .nifty-section-title { font-family:var(--mono); font-size:0.6rem; letter-spacing:0.12em; text-transform:uppercase; color:var(--text-muted); }
    .nifty-bias-readout { font-family:var(--mono); font-weight:700; font-size:0.9rem; }
    .nifty-bias-readout.bullish { color:var(--green); } .nifty-bias-readout.bearish { color:var(--red); } .nifty-bias-readout.choppy { color:var(--amber); }
    .nifty-gauge-track { position:relative; height:32px; display:flex; border-radius:3px; overflow:visible; margin-bottom:4px; }
    .nifty-gauge-zone { flex:1; position:relative; display:flex; align-items:center; justify-content:center; border-right:1px solid var(--border); }
    .nifty-gauge-zone:last-child { border-right:none; }
    .nifty-gauge-zone::after { content:''; position:absolute; inset:0; opacity:0.12; }
    .nifty-zone-bear::after { background:var(--red); } .nifty-zone-choppy::after { background:var(--amber); } .nifty-zone-bull::after { background:var(--green); }
    .nifty-zone-tag { font-family:var(--mono); font-size:0.58rem; letter-spacing:0.08em; text-transform:uppercase; color:var(--text-muted); z-index:1; }
    .nifty-needle { position:absolute; top:-6px; bottom:-6px; width:2px; background:var(--text); box-shadow:0 0 8px 1px rgba(233,230,221,0.4); transition:left 900ms cubic-bezier(.2,.9,.25,1); z-index:2; }
    .nifty-ticks { display:flex; justify-content:space-between; font-family:var(--mono); font-size:0.58rem; color:var(--text-muted); margin-top:3px; }
    .nifty-drivers { display:flex; gap:14px; flex-wrap:wrap; margin-top:10px; padding-top:10px; border-top:1px dashed var(--border); }
    .nifty-driver { font-family:var(--mono); font-size:0.62rem; color:var(--text-muted); display:flex; align-items:center; gap:5px; }
    .nifty-driver .ndot { width:5px; height:5px; border-radius:50%; flex-shrink:0; }
    .ndot.g { background:var(--green); } .ndot.r { background:var(--red); } .ndot.a { background:var(--amber); }

    /* Grid */
    .nifty-grid { display:grid; grid-template-columns:1.3fr 1fr; gap:12px; margin-top:12px; }
    .nifty-panel { background:var(--bg-card2); border:1px solid var(--border); border-radius:var(--radius); padding:14px 16px; }
    .nifty-candle-wrap { background:rgba(14,17,23,0.5); border:1px solid var(--border); border-radius:var(--radius); padding:10px 8px 6px; margin-top:10px; }
    .nifty-pattern-tags { display:flex; gap:6px; flex-wrap:wrap; margin-top:10px; }
    .nifty-tag { font-family:var(--mono); font-size:0.6rem; padding:3px 7px; border-radius:2px; border:1px solid var(--border); color:var(--text-muted); background:var(--bg-card2); }
    .nifty-tag.bull { color:var(--green); border-color:rgba(63,185,80,0.3); background:rgba(63,185,80,0.06); }
    .nifty-tag.bear { color:var(--red);   border-color:rgba(248,81,73,0.3);  background:rgba(248,81,73,0.06); }
    .nifty-signal-grid { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:10px; }
    .nifty-signal-card { background:rgba(14,17,23,0.5); border:1px solid var(--border); border-radius:var(--radius); padding:9px 12px; }
    .nifty-signal-card .sk { font-family:var(--mono); font-size:0.58rem; color:var(--text-muted); text-transform:uppercase; letter-spacing:0.06em; }
    .nifty-signal-card .sv { font-family:var(--mono); font-size:0.82rem; font-weight:700; margin-top:3px; }
    .sv.green { color:var(--green); } .sv.red { color:var(--red); } .sv.amber { color:var(--amber); }

    /* Sector */
    .nifty-stacked-bar { display:flex; width:100%; height:14px; border-radius:2px; overflow:hidden; margin:10px 0 10px; border:1px solid var(--border); }
    .nifty-sector-col-header { display:flex; align-items:center; justify-content:space-between; padding:4px 4px 6px; border-bottom:1px solid var(--border); font-family:var(--mono); font-size:0.58rem; font-weight:700; color:var(--text-muted); letter-spacing:0.06em; text-transform:uppercase; }
    .nifty-sector-list { display:flex; flex-direction:column; }
    .nifty-sector-row { display:flex; align-items:center; justify-content:space-between; padding:6px 4px; border-bottom:1px solid var(--border); font-family:var(--mono); font-size:0.65rem; cursor:pointer; user-select:none; transition:background 0.15s; }
    .nifty-sector-row:hover { background:rgba(255,255,255,0.03); }
    .nifty-sector-arrow { font-size:0.55rem; color:var(--text-muted); width:10px; display:inline-block; }
    .nifty-sector-left { display:flex; align-items:center; gap:6px; flex:1; overflow:hidden; white-space:nowrap; text-overflow:ellipsis; }
    .nifty-swatch { width:7px; height:7px; border-radius:1px; flex-shrink:0; }
    .nifty-sector-name { color:var(--text-muted); overflow:hidden; text-overflow:ellipsis; }
    .nifty-sector-right { display:flex; align-items:center; }
    .nifty-sector-chg { font-size:0.6rem; width:50px; text-align:right; }
    .nifty-sector-chg.up { color:var(--green); } .nifty-sector-chg.dn { color:var(--red); }
    .nifty-sector-impact { font-size:0.6rem; width:55px; text-align:right; font-weight:600; }
    .nifty-sector-impact.up { color:var(--green); } .nifty-sector-impact.dn { color:var(--red); }
    .nifty-sector-wt { width:42px; text-align:right; font-weight:600; color:var(--text); }

    /* Stock Subrow */
    .nifty-stock-container { background:rgba(14,17,23,0.4); border-bottom:1px solid var(--border); padding:2px 0 4px 16px; }
    .nifty-stock-row { display:flex; align-items:center; justify-content:space-between; padding:3px 4px 3px 0; font-family:var(--mono); font-size:0.6rem; color:var(--text-muted); }
    .nifty-stock-name { color:var(--text); font-weight:500; flex:1; }
    .nifty-stock-right { display:flex; align-items:center; }
    .nifty-total-row { display:flex; justify-content:space-between; margin-top:8px; padding-top:8px; border-top:1px solid var(--border); font-family:var(--mono); font-size:0.6rem; color:var(--text-muted); }

    /* OI Chain Heatmap */
    .nifty-oi-metrics-bar { display:flex; gap:16px; align-items:center; flex-wrap:wrap; font-family:var(--mono); font-size:0.65rem; color:var(--text-muted); padding:6px 12px; background:rgba(14,17,23,0.5); border:1px solid var(--border); border-radius:3px; }
    .nifty-oi-metrics-bar b { font-weight:700; }
    .nifty-oi-tbl { width:100%; border-collapse:collapse; font-family:var(--mono); font-size:0.62rem; text-align:center; }
    .nifty-oi-tbl th { background:rgba(14,17,23,0.7); color:var(--text-muted); font-size:0.58rem; font-weight:700; padding:6px 4px; border:1px solid var(--border); letter-spacing:0.04em; }
    .nifty-oi-tbl td { padding:5px 4px; border:1px solid var(--border); color:var(--text); white-space:nowrap; }
    .nifty-oi-tbl tr.atm-row { background:rgba(56,139,253,0.08) !important; font-weight:700; }
    .nifty-oi-tbl tr.maxpain-row { background:rgba(210,153,34,0.08) !important; }
    .nifty-badge-atm { background:rgba(56,139,253,0.2); color:var(--blue); font-size:0.55rem; padding:1px 4px; border-radius:2px; font-weight:700; margin-right:4px; }
    .nifty-badge-mp { background:rgba(210,153,34,0.2); color:var(--amber); font-size:0.55rem; padding:1px 4px; border-radius:2px; font-weight:700; margin-right:4px; }
  </style>
</head>

<body>

  <!-- Header -->
  <header class="header">
    <div class="header-brand">
      <span>📈</span>
      <div>
        F&amp;O Premium Gainers Board
        <div class="header-sub">Opening ATM ± 2 OTM + Accumulated Running Strikes</div>
      </div>
    </div>

    <!-- Compact stats in header -->
    <div class="compact-stats">
      <div class="compact-stat-item" title="Active contracts tracked on board">
        <span class="compact-stat-label">Contracts:</span>
        <span class="compact-stat-value" id="st-tracked">—</span>
      </div>
      <div class="compact-stat-item" title="Contracts with positive option gains vs open premium">
        <span class="compact-stat-label">Positive:</span>
        <span class="compact-stat-value" id="st-positive" style="color:var(--green)">—</span>
      </div>
      <div class="compact-stat-item" title="Stocks with positive option contracts">
        <span class="compact-stat-label">Stocks:</span>
        <span class="compact-stat-value" id="st-stocks">—</span>
      </div>
      <div class="compact-stat-item" title="Last updated time">
        <span class="compact-stat-label">Updated:</span>
        <span class="compact-stat-value" id="st-time">—</span>
        <span class="compact-stat-sub" id="st-date" style="display:none;">—</span>
      </div>
    </div>

    <div class="header-right">
      <div class="live-badge" id="live-badge">
        <div class="live-dot" id="live-dot"></div>
        <span id="live-label">LIVE</span>
      </div>

      <div class="countdown-compact">
        Refresh: <b id="countdown">30s</b>
      </div>

      <!-- Expandable Filters Button -->
      <button class="filter-toggle-btn" id="filter-toggle-btn" onclick="toggleFilters()">
        🎛️ Filters <span id="filter-toggle-arrow">▼</span>
      </button>

      <button class="refresh-btn" onclick="fetchBoard(true)">⟳ Refresh Now</button>
    </div>
  </header>

  <!-- Controls (Expandable filter panel) -->
  <div class="controls">
    <span class="controls-label">Filter</span>
    <div class="filter-group" id="type-filter">
      <button class="filter-btn active" data-type="all">All</button>
      <button class="filter-btn" data-type="CE">CE Only</button>
      <button class="filter-btn" data-type="PE">PE Only</button>
    </div>
    <div class="filter-group" id="layer-filter">
      <button class="filter-btn active" data-layer="all">⭐🏃 Both Layers</button>
      <button class="filter-btn" data-layer="opening">⭐ Opening Only</button>
      <button class="filter-btn" data-layer="running">🏃 Running Only</button>
    </div>
    <div class="filter-group" id="sort-filter">
      <button class="filter-btn" id="sort-rvol-btn">📊 Sort by RVOL</button>
    </div>
  </div>

  <!-- EOD snapshot banner -->
  <div id="eod-banner"
    style="display:none;background:rgba(210,153,34,0.1);border-bottom:1px solid rgba(210,153,34,0.25);padding:8px 24px;font-size:0.75rem;color:#e3b341;display:none;align-items:center;gap:8px;">
    <span>📸</span>
    <span id="eod-banner-text">Showing EOD snapshot — prices as of market close. Live data available 09:15–15:30
      IST.</span>
    <button onclick="fetchBoard(true)"
      style="margin-left:auto;background:rgba(210,153,34,0.15);border:1px solid rgba(210,153,34,0.3);color:#e3b341;padding:3px 10px;border-radius:5px;font-size:0.72rem;cursor:pointer;">↻
      Refresh</button>
  </div>

  <!-- Board grid -->
  <div class="board" id="board">
    <div class="empty-state">
      <div class="spinner"></div>
      <h3>Loading board data...</h3>
      <p>Polling <code>/api/option-gainers-board</code></p>
    </div>
  </div>

  <!-- Toast -->
  <div class="toast" id="toast"></div>

  <script>
    const REFRESH_INTERVAL = 30; // seconds
    let countdown = REFRESH_INTERVAL;
    let timerHandle = null;
    let activeTypeFilter = 'all';
    let activeLayerFilter = 'all';
    let currentSortColumn = 'gain';
    let currentSortDirection = 'desc';
    let lastData = null;
    let _mainBoardCollapsed = false;
    const expandedSymbols = new Set();
    const spurtCache = {};

    function toggleMainBoardPanel() {
      _mainBoardCollapsed = !_mainBoardCollapsed;
      const wrapper = document.getElementById('main-board-collapsible-wrapper');
      const arrow = document.getElementById('main-board-collapse-arrow');
      if (wrapper) wrapper.style.display = _mainBoardCollapsed ? 'none' : 'block';
      if (arrow) arrow.textContent = _mainBoardCollapsed ? '▲' : '▼';
    }

    function getBuildupBadge(sym) {
      const cached = spurtCache[sym];
      if (!cached || (Date.now() - cached.fetchedAt > 180000)) {
        return `<span style="font-size:0.75rem; color:var(--text-muted)">–</span>`;
      }
      const b = cached.futures_buildup;
      let bg = 'rgba(255, 255, 255, 0.05)', color = 'var(--text-muted)', border = 'rgba(255, 255, 255, 0.1)';
      let text = b;
      if (b.includes('LB') || b.includes('Long Buildup')) {
        bg = 'rgba(63, 185, 80, 0.15)'; color = 'var(--green)'; border = 'rgba(63, 185, 80, 0.25)'; text = 'LB';
      } else if (b.includes('SC') || b.includes('Short Covering')) {
        bg = 'rgba(56, 139, 253, 0.15)'; color = 'var(--accent)'; border = 'rgba(56, 139, 253, 0.25)'; text = 'SC';
      } else if (b.includes('LU') || b.includes('Long Unwinding')) {
        bg = 'rgba(241, 224, 90, 0.15)'; color = 'var(--yellow)'; border = 'rgba(241, 224, 90, 0.25)'; text = 'LU';
      } else if (b.includes('SB') || b.includes('Short Buildup')) {
        bg = 'rgba(248, 81, 73, 0.15)'; color = 'var(--red)'; border = 'rgba(248, 81, 73, 0.25)'; text = 'SB';
      }
      return `<span class="badge" style="background:${bg}; color:${color}; border:1px solid ${border}; font-size:9px; padding:2px 6px; border-radius:4px; font-weight:700;">${text}</span>`;
    }

    function getDriftHtml(sym) {
      const cached = spurtCache[sym];
      if (!cached || (Date.now() - cached.fetchedAt > 180000)) {
        return `<span style="font-size:0.75rem; color:var(--text-muted)">Not live</span>`;
      }
      const d = cached.net_drift;
      let color = 'var(--text-muted)';
      if (d.includes('Bullish') || d.includes('Lifting')) {
        color = 'var(--green)';
      } else if (d.includes('Bearish') || d.includes('Sinking')) {
        color = 'var(--red)';
      } else if (d.includes('Range')) {
        color = 'var(--yellow)';
      }
      return `<span style="color:${color}; font-weight:700; font-size:0.78rem;">${d}</span>`;
    }

    function toggleDetails(headerEl) {
      const container = headerEl.parentElement;
      const symbol = container.dataset.symbol;
      const details = container.querySelector('.stock-row-details');
      const isExpanded = container.classList.toggle('expanded');

      if (isExpanded) {
        details.style.display = 'block';
        expandedSymbols.add(symbol);
      } else {
        details.style.display = 'none';
        expandedSymbols.delete(symbol);
      }
    }

    // ── Filters ──────────────────────────────────────────────────────────────
    document.querySelectorAll('#type-filter .filter-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('#type-filter .filter-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        activeTypeFilter = btn.dataset.type;
        if (lastData) renderBoard(lastData);
      });
    });
    document.querySelectorAll('#layer-filter .filter-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('#layer-filter .filter-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        activeLayerFilter = btn.dataset.layer;
        if (lastData) renderBoard(lastData);
      });
    });

    const rvolBtn = document.getElementById('sort-rvol-btn');

    if (rvolBtn) {
      rvolBtn.addEventListener('click', () => {
        if (currentSortColumn === 'rvol') {
          currentSortColumn = 'gain';
          currentSortDirection = 'desc';
        } else {
          currentSortColumn = 'rvol';
          currentSortDirection = 'desc';
        }
        if (lastData) renderBoard(lastData);
      });
    }

    function handleHeaderSort(col) {
      if (currentSortColumn === col) {
        currentSortDirection = currentSortDirection === 'desc' ? 'asc' : 'desc';
      } else {
        currentSortColumn = col;
        currentSortDirection = 'desc';
      }
      if (lastData) renderBoard(lastData);
    }

    function getSortArrow(col) {
      if (currentSortColumn === col) {
        return currentSortDirection === 'desc' ? ' ▼' : ' ▲';
      }
      return ' ↕';
    }

    function toggleFilters() {
      const controls = document.querySelector('.controls');
      const btn = document.getElementById('filter-toggle-btn');
      const arrow = document.getElementById('filter-toggle-arrow');

      const isExpanded = controls.classList.toggle('expanded');
      btn.classList.toggle('active', isExpanded);
      if (arrow) {
        arrow.textContent = isExpanded ? '▲' : '▼';
      }
    }

    // ── Fetch ─────────────────────────────────────────────────────────────────
    async function fetchBoard(manual = false) {
      try {
        const res = await fetch('/api/option-gainers-board');
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();

        // Loading state: background fetch in progress
        if (data.status === 'loading') {
          const isEodLoading = data.message && (data.message.includes('EOD') || data.message.includes('snapshot'));
          const title = isEodLoading ? 'Loading EOD Snapshot...' : 'Initializing Live Board...';
          showBoard(`
          <div class="empty-state">
            <div class="spinner"></div>
            <h3>${title}</h3>
            <p>${data.message || 'Building board from today\'s OHLC data.'}<br>
               Auto-refreshing in <b id="load-countdown">30s</b>.</p>
          </div>`);
          setLiveMode(false, true);
          updateStats(data);
          resetCountdown();
          return;
        }

        lastData = data;

        // Stale pre-close snapshot: backend returned is_eod_snapshot but 0 stocks
        // (background rebuild triggered — show spinner instead of "No gainers data yet")
        if (data.is_eod_snapshot && (!data.stocks || data.stocks.length === 0)) {
          showBoard(`
          <div class="empty-state">
            <div class="spinner"></div>
            <h3>📸 Rebuilding EOD Snapshot…</h3>
            <p>Today's pre-market snapshot was incomplete.<br>
               Fetching final end-of-day data — auto-refreshing in 30s.</p>
          </div>`);
          setLiveMode(false, false, true);
          showEodBanner(true, data.date);
          updateStats(data);
          resetCountdown();
          return;
        }

        renderBoard(data);
        fetchEmaCrossovers();
        fetchOIStatsForSymbols(data.stocks.map(s => s.symbol));
        updateStats(data);

        const isSnapshot = !!data.is_eod_snapshot;
        setLiveMode(!isSnapshot, false, isSnapshot);
        showEodBanner(isSnapshot, data.date);

        resetCountdown();

        if (manual) showToast(isSnapshot ? '📸 EOD snapshot loaded ✓' : 'Board refreshed ✓');
      } catch (e) {
        showBoard('<div class="empty-state"><div class="icon">⚠️</div><h3>Could not reach server</h3><p>' + e.message + '</p></div>');
        resetCountdown();
      }
    }  // end fetchBoard

    function setLiveMode(isLive, isLoading, isSnapshot) {

      const badge = document.getElementById('live-badge');
      const dot = document.getElementById('live-dot');
      const label = document.getElementById('live-label');
      if (isLoading) {
        badge.style.background = 'rgba(125,133,144,0.12)';
        badge.style.borderColor = 'rgba(125,133,144,0.25)';
        badge.style.color = 'var(--text-muted)';
        dot.style.background = 'var(--text-muted)';
        dot.style.animation = 'none';
        label.textContent = 'LOADING';
      } else if (isSnapshot) {
        badge.style.background = 'rgba(210,153,34,0.12)';
        badge.style.borderColor = 'rgba(210,153,34,0.25)';
        badge.style.color = '#e3b341';
        dot.style.background = '#e3b341';
        dot.style.animation = 'pulse 1.5s infinite';
        label.textContent = 'EOD SNAPSHOT';
      } else {
        badge.style.background = 'rgba(63,185,80,0.12)';
        badge.style.borderColor = 'rgba(63,185,80,0.25)';
        badge.style.color = 'var(--green)';
        dot.style.background = 'var(--green)';
        dot.style.animation = 'pulse 1.5s infinite';
        label.textContent = 'LIVE';
      }
    }

    function showEodBanner(show, date) {
      const b = document.getElementById('eod-banner');
      if (show) {
        b.style.display = 'flex';
        document.getElementById('eod-banner-text').textContent =
          `📸 Showing EOD snapshot${date ? ' for ' + date : ''} — prices as of market close. Live updates resume at 09:15 AM IST.`;
      } else {
        b.style.display = 'none';
      }
    }

    // ── Render ────────────────────────────────────────────────────────────────
    function renderBoard(data) {
      if (!data || !data.stocks || data.stocks.length === 0) {
        showBoard(`
        <div class="empty-state">
          <div class="icon">📭</div>
          <h3>No gainers data yet</h3>
          <p>The background scanner runs from 09:15 AM.<br>
             Data populates at the first 5-minute poll.<br>
             Board: <b>${data.total_tracked || 0}</b> contracts tracked.</p>
        </div>`);
        return;
      }

      const stocks = data.stocks.filter(s => {
        // Apply filters to contracts, keep stock if any contract passes
        const filtered = filterContracts(s.contracts);
        return filtered.length > 0;
      });

      if (stocks.length === 0) {
        showBoard('<div class="empty-state"><div class="icon">🔍</div><h3>No results for current filter</h3><p>Try changing the filter options above.</p></div>');
        return;
      }

      // Synchronize the RVOL active button state
      const rvolBtn = document.getElementById('sort-rvol-btn');
      if (rvolBtn) {
        rvolBtn.classList.toggle('active', currentSortColumn === 'rvol');
      }

      // Sort by selected column
      if (currentSortColumn) {
        stocks.sort((a, b) => {
          let valA = 0;
          let valB = 0;
          if (currentSortColumn === 'rvol') {
            valA = a.rvol_ratio != null ? a.rvol_ratio : 0;
            valB = b.rvol_ratio != null ? b.rvol_ratio : 0;
          } else if (currentSortColumn === 'linearity') {
            valA = a.linearity_score != null ? a.linearity_score : 0;
            valB = b.linearity_score != null ? b.linearity_score : 0;
          } else if (currentSortColumn === 'gain') {
            const filtA = filterContracts(a.contracts);
            const filtB = filterContracts(b.contracts);
            valA = filtA.length > 0 ? Math.max(...filtA.map(c => c.gain_pct)) : a.best_gain;
            valB = filtB.length > 0 ? Math.max(...filtB.map(c => c.gain_pct)) : b.best_gain;
          } else if (currentSortColumn === 'gap') {
            valA = a.gap_pct != null ? a.gap_pct : 0;
            valB = b.gap_pct != null ? b.gap_pct : 0;
          } else if (currentSortColumn === 'inst') {
            valA = a.inst_holding != null ? a.inst_holding : 0;
            valB = b.inst_holding != null ? b.inst_holding : 0;
          } else if (currentSortColumn === 'e9h') {
            // Sort: Y before N, then by hold time desc. No data sorts last.
            const e9hScore = (s) => {
              if (s.ema9_hold === 'Y') return 1000 + (s.ema9_hold_minutes || 0);
              if (s.ema9_hold === 'N') return -(s.ema9_hold_minutes || 0);
              return -9999;
            };
            valA = e9hScore(a);
            valB = e9hScore(b);
          } else if (currentSortColumn === 'fhvol') {
            valA = a.fh_cumulative_ratio != null ? a.fh_cumulative_ratio : 0;
            valB = b.fh_cumulative_ratio != null ? b.fh_cumulative_ratio : 0;
          } else if (currentSortColumn === 'futbuild') {
            const getBuildupWeight = (s) => {
              const cached = spurtCache[s.symbol];
              if (!cached || (Date.now() - cached.fetchedAt > 180000)) return 0;
              const b = cached.futures_buildup || '';
              if (b.includes('LB') || b.includes('Long Buildup')) return 4;
              if (b.includes('SC') || b.includes('Short Covering')) return 3;
              if (b.includes('LU') || b.includes('Long Unwinding')) return 2;
              if (b.includes('SB') || b.includes('Short Buildup')) return 1;
              return 0;
            };
            valA = getBuildupWeight(a);
            valB = getBuildupWeight(b);
          } else if (currentSortColumn === 'netdrift') {
            const getDriftWeight = (s) => {
              const cached = spurtCache[s.symbol];
              if (!cached || (Date.now() - cached.fetchedAt > 180000)) return 0;
              const d = cached.net_drift || '';
              if (d.includes('Bullish Breakout')) return 5;
              if (d.includes('Lifting')) return 4;
              if (d.includes('Range-Bound')) return 3;
              if (d.includes('Sinking')) return 2;
              if (d.includes('Bearish Breakout')) return 1;
              return 0;
            };
            valA = getDriftWeight(a);
            valB = getDriftWeight(b);
          }

          if (valA !== valB) {
            return currentSortDirection === 'desc' ? valB - valA : valA - valB;
          }
          return b.best_gain - a.best_gain;

    async function fetchConfluence(symbols) {
      if (!symbols || !symbols.length) return;
      try {
        const res = await fetch('/api/confluence?symbols=' + symbols.join(','));
        if (!res.ok) return;
        const data = await res.json();
        const TF_ORDER = [
          { label: 'D', key: 'day', name: 'Daily' },
          { label: '1H', key: '1h', name: '1 Hour' },
          { label: '15M', key: '15m', name: '15 Min' },
        ];
        for (const [symbol, tfs] of Object.entries(data)) {
          const row = document.getElementById('conf-' + symbol);
          if (!row) continue;
          row.innerHTML = TF_ORDER.map(({ label, key, name }) => {
            const sig = tfs[key] || {};
            const overall = sig.overall || 'neutral';
            const tip = `${name}: RSI ${sig.rsi ?? '—'} · MACD ${sig.macd || '—'} · EMA ${sig.ema || '—'}`;
            return `<span class="conf-pill conf-${overall}" title="${tip}">${label}</span>`;
          }).join('');
        }
      } catch (e) {
        // Confluence is non-critical — fail silently
      }
    }

        } else {
          // Outside market hours with no EOD data yet — poll slowly to keep
          // client heartbeat alive so the backend EOD scan can complete (~2 min).
          const _istPoll = new Date(new Date().toLocaleString('en-US', { timeZone: 'Asia/Kolkata' }));
          const _hPoll = _istPoll.getHours(), _mPoll = _istPoll.getMinutes();
          const _inMktPoll = (_hPoll === 9 && _mPoll >= 15) || (_hPoll >= 10 && _hPoll < 15) || (_hPoll === 15 && _mPoll <= 30);
          const hasEodData = data.crossovers && Object.keys(data.crossovers).length > 0;
          if (!_inMktPoll && !hasEodData) {
            _emaPollTimer = setTimeout(fetchEmaCrossovers, 15000); // keep heartbeat until EOD scan done

            }
            if (item.cross_1h === 'bullish' || item.cross_1h === 'bearish') {
              return { rank: 2, size: item.cross_candle_size_1h || 0 };
            }
            if (item.cross_day === 'bullish' || item.cross_day === 'bearish') {
              return { rank: 1, size: item.cross_candle_size_day || 0 };
            }
            return { rank: 0, size: 0 };
          };

          const gA = getTimeframeGroup(cA);
          const gB = getTimeframeGroup(cB);

          // Tier 1: Group by timeframe priority (5M first, then 15M, then 1H, then Daily)
          if (gA.rank !== gB.rank) {
            return gB.rank - gA.rank;
          }

          // Tier 2: Within the same timeframe group, sort by candle strength (largest first)
          if (gA.rank > 0) {
            if (Math.abs(gA.size - gB.size) > 0.01) {
              return gB.size - gA.size;
            }
          }

          // Tier 3: Fallback to existing order (most recent epoch timestamp first)
          const epochA = Math.max(cA.cross_epoch_5m || 0, cA.cross_epoch_15m || 0, cA.cross_epoch_1h || 0, cA.cross_epoch_day || 0);
          const epochB = Math.max(cB.cross_epoch_5m || 0, cB.cross_epoch_15m || 0, cB.cross_epoch_1h || 0, cB.cross_epoch_day || 0);
          if (epochA !== epochB) return epochB - epochA;

          return a.localeCompare(b);
        });
      };
      sortKeys(bullKeys);
      sortKeys(bearKeys);

      if (countBulls) countBulls.textContent = bullKeys.length;
      if (countBears) countBears.textContent = bearKeys.length;

      const nowSecs = Math.floor(Date.now() / 1000);

      const renderList = (keysList, container) => {
        if (!container) return;

        // Build a tiny, elegant progress bar to display at the top while scanning
        let progressHtml = '';
        if (crossoverData && crossoverData.status === 'scanning') {
          const cur = crossoverData.scan_current || 0;
          const tot = crossoverData.scan_total || 214;
          const pct = tot > 0 ? Math.round((cur / tot) * 100) : 0;

              <div style="height: 2px; background: rgba(255,255,255,0.07); border-radius: 1px; overflow: hidden;">

        }

        if (keysList.length === 0) {
          if (crossoverData && crossoverData.status === 'scanning') {
            container.innerHTML = progressHtml;
          } else {
            // Market-hours-aware empty state
            const _ist = new Date(new Date().toLocaleString('en-US', { timeZone: 'Asia/Kolkata' }));
            const _h = _ist.getHours(), _m = _ist.getMinutes();
            const _inMkt = (_h === 9 && _m >= 15) || (_h >= 10 && _h < 15) || (_h === 15 && _m <= 30);
            let _msg;
            if (!_inMkt) {
              _msg = '🌙 No EOD data yet &nbsp;·&nbsp; Will populate after first live scan';
            } else if (crossoverData.status === 'initializing') {
              _msg = '⏳ Waiting for first scan…';
            } else {
              _msg = 'No symbols found';
            }
            container.innerHTML = `<div style="text-align:center;padding:15px;font-size:0.68rem;color:var(--text-muted);">${_msg}</div>`;
          }
          return;
        }

        container.innerHTML = progressHtml + keysList.map(k => {
          const item = crossovers[k];
          let alignmentClass = 'mixed';
          let alignmentText = 'Mixed';
          if (item.alignment === 'bullish') {
            alignmentClass = 'aligned-bull';
            alignmentText = '🔥 Bullish';
          } else if (item.alignment === 'bearish') {
            alignmentClass = 'aligned-bear';
            alignmentText = '❄️ Bearish';
          }

          // Dynamic Fresh Crossover Badge & New live flag
          let crossBadge = '';
          let activeCrossTime = '';
          if (item.cross_5m === 'bullish') {
            crossBadge = '<span class="cross-pill bullish">▲ 5M Cross</span>';
            activeCrossTime = item.cross_time_5m;
          } else if (item.cross_15m === 'bullish') {
            crossBadge = '<span class="cross-pill bullish">▲ 15M Cross</span>';
            activeCrossTime = item.cross_time_15m;
          } else if (item.cross_1h === 'bullish') {
            crossBadge = '<span class="cross-pill bullish">▲ 1H Cross</span>';
            activeCrossTime = item.cross_time_1h;
          } else if (item.cross_day === 'bullish') {
            crossBadge = '<span class="cross-pill bullish">▲ Daily Cross</span>';
            activeCrossTime = item.cross_time_day;
          } else if (item.cross_5m === 'bearish') {
            crossBadge = '<span class="cross-pill bearish">▼ 5M Cross</span>';
            activeCrossTime = item.cross_time_5m;
          } else if (item.cross_15m === 'bearish') {
            crossBadge = '<span class="cross-pill bearish">▼ 15M Cross</span>';
            activeCrossTime = item.cross_time_15m;
          } else if (item.cross_1h === 'bearish') {
            crossBadge = '<span class="cross-pill bearish">▼ 1H Cross</span>';
            activeCrossTime = item.cross_time_1h;
          } else if (item.cross_day === 'bearish') {
            crossBadge = '<span class="cross-pill bearish">▼ Daily Cross</span>';
            activeCrossTime = item.cross_time_day;
          }

          // Crossover occurred in the last 5 minutes (300 seconds)
          const itemEpoch = Math.max(item.cross_epoch_5m || 0, item.cross_epoch_15m || 0, item.cross_epoch_1h || 0, item.cross_epoch_day || 0);
          const diffSecs = nowSecs - itemEpoch;
          // A fresh 5M cross on the current candle = always flagged NEW (intraday entry signal)
          const has5mFreshCross = item.cross_5m === 'bullish' || item.cross_5m === 'bearish';
          const isNewCrossover = has5mFreshCross || (itemEpoch > 0 && diffSecs >= 0 && diffSecs <= 300);
          const flagMarkup = isNewCrossover ? '<span class="flag-badge">🚩 NEW</span>' : '';
          const itemClass = isNewCrossover ? 'crossover-item new-entry' : 'crossover-item';

          // Find the crossover timeframe that is the most recent (has the largest epoch timestamp)
          const crossoverEpochs = [
            { time: item.cross_time_5m, epoch: item.cross_epoch_5m || 0 },
            { time: item.cross_time_15m, epoch: item.cross_epoch_15m || 0 },
            { time: item.cross_time_1h, epoch: item.cross_epoch_1h || 0 },
            { time: item.cross_time_day, epoch: item.cross_epoch_day || 0 }
          ];
          crossoverEpochs.sort((a, b) => b.epoch - a.epoch);

          let cross_desc = '';
          if (crossoverEpochs[0].epoch > 0) {
            cross_desc = crossoverEpochs[0].time;
          } else {
            cross_desc = item.cross_time_5m || item.cross_time_15m || item.cross_time_1h || item.cross_time_day || '';
          }
          const sub_desc = cross_desc ? `<span class="cross-time-sub" title="Crossover Time">${cross_desc}</span>` : '';

          const pill_5m = item.state_5m === 'bullish' ? 'bullish' : (item.state_5m === 'bearish' ? 'bearish' : '');
          const pill_15m = item.state_15m === 'bullish' ? 'bullish' : (item.state_15m === 'bearish' ? 'bearish' : '');
          const pill_1h = item.state_1h === 'bullish' ? 'bullish' : (item.state_1h === 'bearish' ? 'bearish' : '');
          const pill_day = item.state_day === 'bullish' ? 'bullish' : (item.state_day === 'bearish' ? 'bearish' : '');

          const time_5m = item.cross_time_5m ? ` · Cross: ${item.cross_time_5m}` : '';
          const time_15m = item.cross_time_15m ? ` · Cross: ${item.cross_time_15m}` : '';
          const time_1h = item.cross_time_1h ? ` · Cross: ${item.cross_time_1h}` : '';
          const time_day = item.cross_time_day ? ` · Cross: ${item.cross_time_day}` : '';

          const title_5m = `5M Trend: ${item.state_5m || 'none'}${time_5m}`;
          const title_15m = `15M Trend: ${item.state_15m || 'none'}${time_15m}`;
          const title_1h = `1H Trend: ${item.state_1h || 'none'}${time_1h}`;
          const title_day = `Daily Trend: ${item.state_day || 'none'}${time_day}`;

          return `
          <div class="${itemClass}" style="padding: 4px 6px; border-bottom: 1px solid var(--border2); display: flex; justify-content: space-between; align-items: center; gap: 3px; min-width: 0;">
            <div class="crossover-left" style="display: flex; flex-direction: column; gap: 1px; min-width: 0; flex: 1;">

                ${(() => { const scp = item.spot_change_pct; return scp != null ? `<span style="font-size:0.48rem;font-weight:700;color:${scp >= 0 ? '#3fb950' : '#ff7b72'}">${scp >= 0 ? '▲' : '▼'}${scp >= 0 ? '+' : ''}${scp.toFixed(2)}%</span>` : ''; })()}
              </span>
              <div class="crossover-left-sub" style="display: flex; align-items: center; gap: 2px; margin-top: 1px; flex-wrap: wrap;">
                <span class="alignment-badge ${alignmentClass}" style="font-size: 0.46rem; padding: 0.5px 2.5px; border-radius: 2px;">${alignmentText}</span>

              </div>
            </div>
            <div class="crossover-right" style="display: flex; flex-direction: column; align-items: flex-end; gap: 2px; flex-shrink: 0;">
              <div class="timeframes-strip" style="display: flex; gap: 2px;">
                <span class="tf-pill ${pill_5m}"  title="${title_5m}">5M</span>
                <span class="tf-pill ${pill_15m}" title="${title_15m}">15M</span>
                <span class="tf-pill ${pill_1h}"  title="${title_1h}">1H</span>
                <span class="tf-pill ${pill_day}" title="${title_day}">D</span>
              </div>
              ${crossBadge}
            </div>
          </div>`;
        }).join('');
      };

      renderList(bullKeys, listBulls);
      renderList(bearKeys, listBears);
    }

    // ── Spurt Scanner Stats Fetcher ──
    let _oiStatsFetchActive = false;
    async function fetchOIStatsForSymbols(symbols) {
      if (_oiStatsFetchActive) return;
      _oiStatsFetchActive = true;

      const now = Date.now();
      const symbolsToFetch = symbols.filter(sym => {
        const cached = spurtCache[sym];
        return !cached || (now - cached.fetchedAt > 120000); // refresh every 2 mins
      });

      if (symbolsToFetch.length === 0) {
        _oiStatsFetchActive = false;
        return;
      }

      for (const sym of symbolsToFetch) {
        try {
          const response = await fetch(`/api/oi/symbol/${sym}`);
          if (response.ok) {
            const resData = await response.json();
            spurtCache[sym] = {
              futures_buildup: resData.futures_data?.buildup || '–',
              net_drift: resData.transition_conviction?.net_drift || 'Not live',
              fetchedAt: Date.now()
            };
            if (lastData) renderBoard(lastData);
          }
        } catch (e) {
          console.warn(`Failed to fetch Spurt stats for ${sym}:`, e);
        }
        await new Promise(resolve => setTimeout(resolve, 150));
      }
      _oiStatsFetchActive = false;
    }
