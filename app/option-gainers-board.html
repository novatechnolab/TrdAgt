<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>F&amp;O Premium Gainers Board — TradeSignal</title>
  <meta name="description"
    content="Live F&O option premium gainers board — ranked by opening-to-current premium gain, updated every 5 minutes.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap"
    rel="stylesheet">
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #0d1117;
      --bg-card: #161b22;
      --bg-card2: #1c2128;
      --border: rgba(255, 255, 255, 0.07);
      --border2: rgba(255, 255, 255, 0.12);
      --text: #e6edf3;
      --text-muted: #7d8590;
      --green: #3fb950;
      --amber: #d29922;
      --orange: #db6d28;
      --red: #f85149;
      --blue: #388bfd;
      --purple: #bc8cff;
      --gold: #ffd700;
      --star-color: #f0a500;
      --run-color: #5b9bd5;
      --radius: 10px;
      --font: 'Inter', system-ui, sans-serif;
      --mono: 'JetBrains Mono', monospace;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
      font-size: 14px;
      min-height: 100vh;
      min-width: 1280px;
    }

    .header,
    .controls,
    #eod-banner {
      min-width: 1280px;
    }

    /* ── Header ── */
    .header {
      background: var(--bg-card);
      border-bottom: 1px solid var(--border);
      padding: 14px 24px;
      display: flex;
      align-items: center;
      gap: 16px;
      position: sticky;
      top: 0;
      z-index: 100;
      backdrop-filter: blur(12px);
    }

    .header-brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 700;
      font-size: 1.05rem;
      letter-spacing: -0.02em;
    }

    .header-brand span {
      font-size: 1.4rem;
    }

    .header-sub {
      font-size: 0.72rem;
      color: var(--text-muted);
      margin-left: 2px;
    }

    .header-right {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    /* Live badge */
    .live-badge {
      display: flex;
      align-items: center;
      gap: 6px;
      background: rgba(63, 185, 80, 0.12);
      border: 1px solid rgba(63, 185, 80, 0.25);
      border-radius: 20px;
      padding: 4px 12px;
      font-size: 0.72rem;
      font-weight: 600;
      color: var(--green);
      letter-spacing: 0.04em;
    }

    .live-dot {
      width: 7px;
      height: 7px;
      background: var(--green);
      border-radius: 50%;
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {

      0%,
      100% {
        opacity: 1;
        transform: scale(1);
      }

      50% {
        opacity: 0.5;
        transform: scale(0.8);
      }
    }

    .refresh-btn {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--border2);
      color: var(--text);
      padding: 6px 14px;
      border-radius: 7px;
      font-size: 0.78rem;
      cursor: pointer;
      font-family: var(--font);
      font-weight: 500;
      transition: all 0.2s;
    }

    .refresh-btn:hover {
      background: rgba(255, 255, 255, 0.1);
    }

    /* ── Stats bar ── */
    .stats-bar {
      display: flex;
      gap: 1px;
      background: var(--border);
      border-bottom: 1px solid var(--border);
      overflow-x: auto;
    }

    .stat-item {
      flex: 1;
      min-width: 130px;
      background: var(--bg-card);
      padding: 12px 20px;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .stat-label {
      font-size: 0.68rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-muted);
      font-weight: 600;
    }

    .stat-value {
      font-size: 1.35rem;
      font-weight: 700;
      font-family: var(--mono);
      color: var(--text);
      line-height: 1;
    }

    .stat-sub {
      font-size: 0.68rem;
      color: var(--text-muted);
    }

    /* ── Controls ── */
    .controls {
      display: none;
      padding: 14px 24px;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      border-bottom: 1px solid var(--border);
      background: var(--bg);
    }

    .controls.expanded {
      display: flex;
    }

    .controls-label {
      font-size: 0.72rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      font-weight: 600;
    }

    .filter-group {
      display: flex;
      gap: 4px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 3px;
    }

    .filter-btn {
      border: none;
      background: transparent;
      color: var(--text-muted);
      padding: 5px 12px;
      border-radius: 5px;
      font-size: 0.76rem;
      font-weight: 600;
      cursor: pointer;
      font-family: var(--font);
      transition: all 0.15s;
      white-space: nowrap;
    }

    .filter-btn:hover {
      color: var(--text);
      background: rgba(255, 255, 255, 0.06);
    }

    .filter-btn.active {
      background: rgba(56, 139, 253, 0.2);
      color: var(--blue);
    }

    .compact-stats {
      display: flex;
      align-items: center;
      gap: 16px;
      margin: 0 16px;
    }

    .compact-stat-item {
      display: flex;
      align-items: baseline;
      gap: 5px;
      background: rgba(255, 255, 255, 0.03);
      padding: 4px 10px;
      border-radius: 6px;
      border: 1px solid var(--border);
    }

    .compact-stat-label {
      font-size: 0.65rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      font-weight: 600;
    }

    .compact-stat-value {
      font-size: 0.82rem;
      font-weight: 700;
      color: var(--text);
      font-family: var(--mono);
    }

    .filter-toggle-btn {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--border2);
      color: var(--text);
      padding: 6px 14px;
      border-radius: 7px;
      font-size: 0.78rem;
      cursor: pointer;
      font-family: var(--font);
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
    }

    .filter-toggle-btn:hover {
      background: rgba(255, 255, 255, 0.1);
    }

    .filter-toggle-btn.active {
      background: rgba(56, 139, 253, 0.15);
      border-color: rgba(56, 139, 253, 0.4);
      color: var(--blue);
    }

    .countdown-compact {
      font-size: 0.72rem;
      color: var(--text-muted);
      font-family: var(--mono);
      white-space: nowrap;
    }

    .countdown-compact b {
      color: var(--text);
    }

    /* Removed max-width: 900px header query to keep header inline */

    /* ── Main grid ── */
    /* Unified Layout: Always 7 columns, side-by-side */
    .board {
      padding: 16px 20px;
      display: grid;
      grid-template-columns: repeat(7, minmax(0, 1fr));
      align-items: stretch;
      gap: 12px;
      min-width: 1280px;
    }

    .stock-cards-grid {
      grid-column: span 4;
      display: flex;
      flex-direction: column;
      gap: 8px;
      width: 100%;
      min-width: 0;
      overflow-x: auto;
      padding-bottom: 8px;
    }

    .board-right-bar-container {
      grid-column: span 3;
      display: flex;
      flex-direction: column;
      align-self: stretch;
    }

    /* ── Stock card ── */
    .stock-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      transition: border-color 0.2s, transform 0.2s;
    }

    .stock-card:hover {
      border-color: var(--border2);
      transform: translateY(-1px);
    }

    .card-header {
      display: flex;
      flex-direction: column;
      gap: 4px;
      padding: 8px 10px;
      border-bottom: 1px solid var(--border);
      background: var(--bg-card2);
    }

    .card-rank {
      font-size: 0.68rem;
      color: var(--text-muted);
      font-weight: 700;
      font-family: var(--mono);
      min-width: 20px;
    }

    .card-symbol {
      font-size: 0.92rem;
      font-weight: 700;
      letter-spacing: -0.01em;
      flex: 1;
    }

    .best-badge {
      font-size: 0.75rem;
      font-weight: 700;
      font-family: var(--mono);
      padding: 3px 9px;
      border-radius: 20px;
    }

    .best-fire {
      background: rgba(248, 81, 73, 0.15);
      color: #ff7b72;
      border: 1px solid rgba(248, 81, 73, 0.25);
    }

    .best-rocket {
      background: rgba(210, 153, 34, 0.15);
      color: #e3b341;
      border: 1px solid rgba(210, 153, 34, 0.25);
    }

    .best-up {
      background: rgba(63, 185, 80, 0.12);
      color: var(--green);
      border: 1px solid rgba(63, 185, 80, 0.22);
    }

    /* Contract rows */
    .contract-row {
      display: grid;
      grid-template-columns: 16px 1fr;
      align-items: center;
      gap: 6px;
      padding: 5px 10px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.03);
      transition: background 0.15s;
    }

    .contract-row:last-child {
      border-bottom: none;
    }

    .contract-row:hover {
      background: rgba(255, 255, 255, 0.025);
    }

    .layer-tag {
      font-size: 0.75rem;
    }

    .strike-info {
      display: flex;
      flex-direction: column;
      gap: 1px;
    }

    .strike-label {
      font-size: 0.78rem;
      font-weight: 600;
      font-family: var(--mono);
      color: var(--text);
    }

    .strike-detail {
      font-size: 0.65rem;
      color: var(--text-muted);
      font-family: var(--mono);
    }

    .opt-badge {
      font-size: 0.62rem;
      font-weight: 700;
      padding: 1px 5px;
      border-radius: 4px;
    }

    .opt-ce {
      background: rgba(63, 185, 80, 0.15);
      color: var(--green);
    }

    .opt-pe {
      background: rgba(248, 81, 73, 0.15);
      color: var(--red);
    }

    .gain-pct {
      font-size: 0.72rem;
      font-weight: 800;
      font-family: var(--mono);
      text-align: left;
      min-width: 0;
    }

    .gain-fire {
      color: #ff7b72;
    }

    .gain-rocket {
      color: #e3b341;
    }

    .gain-up {
      color: var(--green);
    }

    /* ── Confluence dots ── */
    .conf-row {
      display: flex;
      gap: 3px;
      align-items: center;
      margin-top: 3px;
    }

    .conf-pill {
      font-size: 0.58rem;
      font-weight: 700;
      padding: 1px 5px;
      border-radius: 3px;
      letter-spacing: 0.03em;
      cursor: default;
      transition: opacity 0.2s;
    }

    .conf-loading {
      background: rgba(125, 133, 144, 0.08);
      color: #7d8590;
      border: 1px solid rgba(125, 133, 144, 0.15);
    }

    .conf-bullish {
      background: rgba(63, 185, 80, 0.15);
      color: #3fb950;
      border: 1px solid rgba(63, 185, 80, 0.25);
    }

    .conf-bearish {
      background: rgba(248, 81, 73, 0.15);
      color: #ff7b72;
      border: 1px solid rgba(248, 81, 73, 0.25);
    }

    .conf-neutral {
      background: rgba(125, 133, 144, 0.15);
      color: #8b949e;
      border: 1px solid rgba(125, 133, 144, 0.2);
    }

    .card-title {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 0;
      min-width: 0;
    }

    /* Gain bar (mini progress indicator) */
    .gain-bar-wrap {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 2px;
      background: var(--border);
    }

    .gain-bar {
      height: 100%;
      background: linear-gradient(90deg, var(--green), var(--amber));
      transition: width 0.4s ease;
    }

    /* ── Empty / Loading state ── */
    .empty-state {
      grid-column: 1 / -1;
      text-align: center;
      padding: 80px 20px;
      color: var(--text-muted);
    }

    .empty-state .icon {
      font-size: 3rem;
      margin-bottom: 14px;
    }

    .empty-state h3 {
      font-size: 1.1rem;
      font-weight: 600;
      margin-bottom: 8px;
      color: var(--text);
    }

    .empty-state p {
      font-size: 0.82rem;
      line-height: 1.6;
    }

    /* ── Loading spinner ── */
    .spinner {
      width: 36px;
      height: 36px;
      border: 3px solid var(--border);
      border-top-color: var(--blue);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      margin: 0 auto 16px;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    /* ── Toast ── */
    .toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: var(--bg-card2);
      border: 1px solid var(--border2);
      border-radius: 9px;
      padding: 10px 16px;
      font-size: 0.8rem;
      color: var(--text);
      opacity: 0;
      transform: translateY(10px);
      transition: all 0.3s;
      z-index: 200;
      pointer-events: none;
    }

    .toast.show {
      opacity: 1;
      transform: translateY(0);
    }

    /* ── Scrollbar ── */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }

    ::-webkit-scrollbar-track {
      background: transparent;
    }

    ::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.1);
      border-radius: 3px;
    }

    /* ── Responsive ── */
    @media (max-width: 600px) {
      .board {
        padding: 12px;
        gap: 10px;
        grid-template-columns: 1fr;
      }

      .header {
        padding: 10px 14px;
      }

      .controls {
        padding: 10px 14px;
      }

      .stats-bar .stat-item {
        padding: 10px 14px;
      }
    }

    /* ── Right Bar Panel Layout ── */
    .board-right-bar-container {
      display: flex;
      flex-direction: column;
      gap: 12px;
      align-self: stretch;
      max-height: calc(100vh - 120px);
    }

    .crossover-columns-wrap {
      display: flex;
      flex-direction: row;
      /* Three side-by-side columns: Bulls, Bears, Live Breakouts */
      gap: 12px;
      flex: 1;
      min-height: 0;
      overflow: hidden;
    }

    .board-right-bar {
      display: flex;
      flex-direction: column;
      background: var(--bg-card);
      border: 1px solid var(--border2);
      border-radius: var(--radius);
      overflow: hidden;
      flex: 1;
      /* Share horizontal space equally */
      min-height: 200px;
    }

    /* ── Beautiful Live Breakouts Card ── */
    .live-breakout-horizontal-bar {
      display: flex;
      flex-direction: column;
      background: var(--bg-card);
      border: 1px solid rgba(255, 215, 0, 0.22);
      border-radius: var(--radius);
      padding: 10px 14px;
      flex: 0 0 196px;
      /* Doubled height for plenty of space! */
      overflow: hidden;
      box-shadow: 0 0 10px rgba(255, 215, 0, 0.02);
      gap: 8px;
    }

    .breakouts-horizontal-grid {
      display: flex;
      flex-direction: column;
      gap: 10px;
      flex: 1;
      min-height: 0;
    }

    .breakout-horizontal-row {
      display: flex;
      flex-direction: column;
      /* Stack headings and scroll pills vertically */
      align-items: flex-start;
      gap: 4px;
      flex: 1;
      min-height: 0;
      width: 100%;
    }

    .breakout-row-label {
      font-size: 0.58rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 4px;
      flex-shrink: 0;
    }

    .breakout-horizontal-scroll {
      display: flex;
      flex-direction: row;
      gap: 8px;
      overflow-x: auto;
      white-space: nowrap;
      padding: 4px 0;
      /* Extra room for custom scrollbar */
      align-items: center;
      flex: 1;
      min-width: 0;
      width: 100%;
    }

    .breakout-horizontal-scroll::-webkit-scrollbar {
      height: 4px;
    }

    .breakout-horizontal-scroll::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.1);
      border-radius: 2px;
    }

    .breakout-alert-pill {
      display: flex;
      flex-direction: column;
      gap: 3px;
      padding: 7px 10px;
      border-radius: 8px;
      margin-bottom: 5px;
      border: 1px solid transparent;
      font-size: 0.67rem;
    }

    .breakout-alert-pill.horizontal {
      display: inline-flex;
      flex-direction: row;
      align-items: center;
      gap: 5px;
      padding: 3px 6px;
      border-radius: 4px;
      font-size: 0.60rem;
      white-space: nowrap;
      flex-shrink: 0;
      margin-bottom: 0;
    }

    .squeeze-pill.horizontal {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: rgba(210, 153, 34, 0.08);
      border: 1px solid rgba(210, 153, 34, 0.25);
      color: #e3b341;
      padding: 3px 6px;
      border-radius: 4px;
      font-size: 0.60rem;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .breakout-alert-pill.grade-a {
      background: rgba(255, 215, 0, 0.07);
      border-color: rgba(255, 215, 0, 0.3);
    }

    .breakout-alert-pill.grade-b {
      background: rgba(63, 185, 80, 0.06);
      border-color: rgba(63, 185, 80, 0.2);
    }

    .breakout-alert-pill.bearish {
      background: rgba(255, 123, 114, 0.07);
      border-color: rgba(255, 123, 114, 0.25);
    }

    .squeeze-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 5px 10px;
      border-bottom: 1px solid var(--border);
      font-size: 0.66rem;
      color: var(--text-muted);
    }

    .squeeze-row:last-child {
      border-bottom: none;
    }

    .squeeze-sym {
      font-weight: 700;
      font-size: 0.72rem;
      color: var(--text);
      letter-spacing: 0.02em;
    }

    .squeeze-dur {
      background: rgba(210, 153, 34, 0.12);
      color: #e3b341;
      border-radius: 4px;
      padding: 1px 5px;
      font-size: 0.6rem;
      font-weight: 600;
    }

    .right-bar-header {
      padding: 16px 20px;
      border-bottom: 1px solid var(--border2);
    }

    .right-bar-title-wrap {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 4px;
    }

    .right-bar-title-wrap h3 {
      font-size: 0.98rem;
      font-weight: 600;
      color: var(--text);
      margin: 0;
    }

    .right-bar-header p {
      font-size: 0.72rem;
      color: var(--text-muted);
      margin: 0;
      line-height: 1.3;
    }

    .pulse-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--text-muted);
      position: relative;
    }

    .pulse-dot.active {
      background: #238636;
    }

    .pulse-dot.active::after {
      content: '';
      position: absolute;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: #238636;
      animation: pulse 1.8s infinite ease-in-out;
    }

    @keyframes pulse {
      0% {
        transform: scale(1);
        opacity: 0.8;
      }

      100% {
        transform: scale(2.8);
        opacity: 0;
      }
    }

    .right-bar-toolbar {
      padding: 12px 20px;
      background: rgba(22, 27, 34, 0.2);
      border-bottom: 1px solid var(--border2);
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .search-input-wrap {
      position: relative;
      display: flex;
      align-items: center;
    }

    .search-input-wrap input {
      width: 100%;
      background: rgba(13, 17, 23, 0.8);
      border: 1px solid var(--border2);
      border-radius: 6px;
      padding: 6px 10px 6px 28px;
      font-size: 0.75rem;
      color: var(--text);
      outline: none;
      transition: border-color 0.2s;
    }

    .search-input-wrap input:focus {
      border-color: #58a6ff;
    }

    .search-input-wrap .search-icon {
      position: absolute;
      left: 8px;
      font-size: 0.75rem;
      color: var(--text-muted);
      pointer-events: none;
    }

    .crossover-filters {
      display: flex;
      gap: 6px;
    }

    .filter-btn {
      flex: 1;
      background: rgba(13, 17, 23, 0.5);
      border: 1px solid var(--border2);
      border-radius: 5px;
      color: var(--text-muted);
      font-size: 0.7rem;
      padding: 4px 0;
      cursor: pointer;
      font-weight: 500;
      transition: all 0.2s;
    }

    .filter-btn:hover {
      color: var(--text);
      background: rgba(255, 255, 255, 0.05);
    }

    .filter-btn.active {
      color: #58a6ff;
      border-color: #58a6ff;
      background: rgba(88, 166, 255, 0.15);
    }

    .right-bar-list {
      flex: 1;
      overflow-y: auto;
      padding: 6px 8px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

<body>

  <!-- Header -->
  <header class="header">
    <div class="header-brand">
      <span>📈</span>
      <div>
        F&amp;O Premium Gainers Board
        <div class="header-sub">Opening ATM ± 2 OTM + Accumulated Running Strikes</div>
      </div>
    </div>

    <!-- Compact stats in header -->
    <div class="compact-stats">
      <div class="compact-stat-item" title="Active contracts tracked on board">
        <span class="compact-stat-label">Contracts:</span>
        <span class="compact-stat-value" id="st-tracked">—</span>
      </div>
      <div class="compact-stat-item" title="Contracts with positive option gains vs open premium">
        <span class="compact-stat-label">Positive:</span>
        <span class="compact-stat-value" id="st-positive" style="color:var(--green)">—</span>
      </div>
      <div class="compact-stat-item" title="Stocks with positive option contracts">
        <span class="compact-stat-label">Stocks:</span>
        <span class="compact-stat-value" id="st-stocks">—</span>
      </div>
      <div class="compact-stat-item" title="Last updated time">
        <span class="compact-stat-label">Updated:</span>
        <span class="compact-stat-value" id="st-time">—</span>
        <span class="compact-stat-sub" id="st-date" style="display:none;">—</span>
      </div>
    </div>

    <div class="header-right">
      <div class="live-badge" id="live-badge">
        <div class="live-dot" id="live-dot"></div>
        <span id="live-label">LIVE</span>
      </div>

      <div class="countdown-compact">
        Refresh: <b id="countdown">30s</b>
      </div>

      <!-- Expandable Filters Button -->
      <button class="filter-toggle-btn" id="filter-toggle-btn" onclick="toggleFilters()">
        🎛️ Filters <span id="filter-toggle-arrow">▼</span>
      </button>

      <button class="refresh-btn" onclick="fetchBoard(true)">⟳ Refresh Now</button>
    </div>
  </header>

  <!-- Controls (Expandable filter panel) -->
  <div class="controls">
    <span class="controls-label">Filter</span>
    <div class="filter-group" id="type-filter">
      <button class="filter-btn active" data-type="all">All</button>
      <button class="filter-btn" data-type="CE">CE Only</button>
      <button class="filter-btn" data-type="PE">PE Only</button>
    </div>
    <div class="filter-group" id="layer-filter">
      <button class="filter-btn active" data-layer="all">⭐🏃 Both Layers</button>
      <button class="filter-btn" data-layer="opening">⭐ Opening Only</button>
      <button class="filter-btn" data-layer="running">🏃 Running Only</button>
    </div>
    <div class="filter-group" id="sort-filter">
      <button class="filter-btn" id="sort-rvol-btn">📊 Sort by RVOL</button>
    </div>
  </div>

  <!-- EOD snapshot banner -->
  <div id="eod-banner"
    style="display:none;background:rgba(210,153,34,0.1);border-bottom:1px solid rgba(210,153,34,0.25);padding:8px 24px;font-size:0.75rem;color:#e3b341;display:none;align-items:center;gap:8px;">
    <span>📸</span>
    <span id="eod-banner-text">Showing EOD snapshot — prices as of market close. Live data available 09:15–15:30
      IST.</span>
    <button onclick="fetchBoard(true)"
      style="margin-left:auto;background:rgba(210,153,34,0.15);border:1px solid rgba(210,153,34,0.3);color:#e3b341;padding:3px 10px;border-radius:5px;font-size:0.72rem;cursor:pointer;">↻
      Refresh</button>
  </div>

  <!-- Board grid -->
  <div class="board" id="board">
    <div class="empty-state">
      <div class="spinner"></div>
      <h3>Loading board data...</h3>
      <p>Polling <code>/api/option-gainers-board</code></p>
    </div>
  </div>


  <div class="toast" id="toast"></div>

  <script>
    const REFRESH_INTERVAL = 30; // seconds
    let countdown = REFRESH_INTERVAL;
    let timerHandle = null;
    let activeTypeFilter = 'all';
    let activeLayerFilter = 'all';
    let currentSortColumn = 'gain';
    let currentSortDirection = 'desc';
    let lastData = null;
    let _mainBoardCollapsed = false;
    const expandedSymbols = new Set();
    const spurtCache = {};

    function toggleMainBoardPanel() {
      _mainBoardCollapsed = !_mainBoardCollapsed;
      const wrapper = document.getElementById('main-board-collapsible-wrapper');
      const arrow = document.getElementById('main-board-collapse-arrow');
      if (wrapper) wrapper.style.display = _mainBoardCollapsed ? 'none' : 'block';
      if (arrow) arrow.textContent = _mainBoardCollapsed ? '▲' : '▼';
    }

    function getBuildupBadge(sym) {
      const cached = spurtCache[sym];
      if (!cached || (Date.now() - cached.fetchedAt > 180000)) {
        return `<span style="font-size:0.75rem; color:var(--text-muted)">–</span>`;
      }
      const b = cached.futures_buildup;
      let bg = 'rgba(255, 255, 255, 0.05)', color = 'var(--text-muted)', border = 'rgba(255, 255, 255, 0.1)';
      let text = b;
      if (b.includes('LB') || b.includes('Long Buildup')) {
        bg = 'rgba(63, 185, 80, 0.15)'; color = 'var(--green)'; border = 'rgba(63, 185, 80, 0.25)'; text = 'LB';
      } else if (b.includes('SC') || b.includes('Short Covering')) {
        bg = 'rgba(56, 139, 253, 0.15)'; color = 'var(--accent)'; border = 'rgba(56, 139, 253, 0.25)'; text = 'SC';
      } else if (b.includes('LU') || b.includes('Long Unwinding')) {
        bg = 'rgba(241, 224, 90, 0.15)'; color = 'var(--yellow)'; border = 'rgba(241, 224, 90, 0.25)'; text = 'LU';
      } else if (b.includes('SB') || b.includes('Short Buildup')) {
        bg = 'rgba(248, 81, 73, 0.15)'; color = 'var(--red)'; border = 'rgba(248, 81, 73, 0.25)'; text = 'SB';
      }
      return `<span class="badge" style="background:${bg}; color:${color}; border:1px solid ${border}; font-size:9px; padding:2px 6px; border-radius:4px; font-weight:700;">${text}</span>`;
    }


    function toggleDetails(headerEl) {
      const container = headerEl.parentElement;
      const symbol = container.dataset.symbol;
      const details = container.querySelector('.stock-row-details');
      const isExpanded = container.classList.toggle('expanded');

      if (isExpanded) {
        details.style.display = 'block';
        expandedSymbols.add(symbol);
      } else {
        details.style.display = 'none';
        expandedSymbols.delete(symbol);
      }
    }

    // ── Filters ──────────────────────────────────────────────────────────────
    document.querySelectorAll('#type-filter .filter-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('#type-filter .filter-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        activeTypeFilter = btn.dataset.type;
        if (lastData) renderBoard(lastData);
      });
    });
    document.querySelectorAll('#layer-filter .filter-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('#layer-filter .filter-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        activeLayerFilter = btn.dataset.layer;
        if (lastData) renderBoard(lastData);
      });
    });

    const rvolBtn = document.getElementById('sort-rvol-btn');

    if (rvolBtn) {
      rvolBtn.addEventListener('click', () => {
        if (currentSortColumn === 'rvol') {
          currentSortColumn = 'gain';
          currentSortDirection = 'desc';
        } else {
          currentSortColumn = 'rvol';
          currentSortDirection = 'desc';
        }
        if (lastData) renderBoard(lastData);
      });
    }

    function handleHeaderSort(col) {
      if (currentSortColumn === col) {
        currentSortDirection = currentSortDirection === 'desc' ? 'asc' : 'desc';
      } else {
        currentSortColumn = col;
        currentSortDirection = 'desc';
      }
      if (lastData) renderBoard(lastData);
    }

    function getSortArrow(col) {
      if (currentSortColumn === col) {
        return currentSortDirection === 'desc' ? ' ▼' : ' ▲';
      }
      return ' ↕';
    }

    function toggleFilters() {
      const controls = document.querySelector('.controls');
      const btn = document.getElementById('filter-toggle-btn');
      const arrow = document.getElementById('filter-toggle-arrow');

      const isExpanded = controls.classList.toggle('expanded');
      btn.classList.toggle('active', isExpanded);
      if (arrow) {
        arrow.textContent = isExpanded ? '▲' : '▼';
      }
    }

    // ── Fetch ─────────────────────────────────────────────────────────────────
    async function fetchBoard(manual = false) {
      try {
        const res = await fetch('/api/option-gainers-board');
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();

        // Loading state: background fetch in progress
        if (data.status === 'loading') {
          const isEodLoading = data.message && (data.message.includes('EOD') || data.message.includes('snapshot'));
          const title = isEodLoading ? 'Loading EOD Snapshot...' : 'Initializing Live Board...';
          showBoard(`
          <div class="empty-state">
            <div class="spinner"></div>
            <h3>${title}</h3>
            <p>${data.message || 'Building board from today\'s OHLC data.'}<br>
               Auto-refreshing in <b id="load-countdown">30s</b>.</p>
          </div>`);
          setLiveMode(false, true);
          updateStats(data);
          resetCountdown();
          return;
        }

        lastData = data;

        // Stale pre-close snapshot: backend returned is_eod_snapshot but 0 stocks
        // (background rebuild triggered — show spinner instead of "No gainers data yet")
        if (data.is_eod_snapshot && (!data.stocks || data.stocks.length === 0)) {
          showBoard(`
          <div class="empty-state">
            <div class="spinner"></div>
            <h3>📸 Rebuilding EOD Snapshot…</h3>
            <p>Today's pre-market snapshot was incomplete.<br>
               Fetching final end-of-day data — auto-refreshing in 30s.</p>
          </div>`);
          setLiveMode(false, false, true);
          showEodBanner(true, data.date);
          updateStats(data);
          resetCountdown();
          return;
        }

        renderBoard(data);
        fetchEmaCrossovers();
        fetchOIStatsForSymbols(data.stocks.map(s => s.symbol));
        updateStats(data);

        const isSnapshot = !!data.is_eod_snapshot;
        setLiveMode(!isSnapshot, false, isSnapshot);
        showEodBanner(isSnapshot, data.date);

        resetCountdown();

        if (manual) showToast(isSnapshot ? '📸 EOD snapshot loaded ✓' : 'Board refreshed ✓');
      } catch (e) {
        showBoard('<div class="empty-state"><div class="icon">⚠️</div><h3>Could not reach server</h3><p>' + e.message + '</p></div>');
        resetCountdown();
      }
    }  // end fetchBoard

    function setLiveMode(isLive, isLoading, isSnapshot) {

      const badge = document.getElementById('live-badge');
      const dot = document.getElementById('live-dot');
      const label = document.getElementById('live-label');
      if (isLoading) {
        badge.style.background = 'rgba(125,133,144,0.12)';
        badge.style.borderColor = 'rgba(125,133,144,0.25)';
        badge.style.color = 'var(--text-muted)';
        dot.style.background = 'var(--text-muted)';
        dot.style.animation = 'none';
        label.textContent = 'LOADING';
      } else if (isSnapshot) {
        badge.style.background = 'rgba(210,153,34,0.12)';
        badge.style.borderColor = 'rgba(210,153,34,0.25)';
        badge.style.color = '#e3b341';
        dot.style.background = '#e3b341';
        dot.style.animation = 'pulse 1.5s infinite';
        label.textContent = 'EOD SNAPSHOT';
      } else {
        badge.style.background = 'rgba(63,185,80,0.12)';
        badge.style.borderColor = 'rgba(63,185,80,0.25)';
        badge.style.color = 'var(--green)';
        dot.style.background = 'var(--green)';
        dot.style.animation = 'pulse 1.5s infinite';
        label.textContent = 'LIVE';
      }
    }

    function showEodBanner(show, date) {
      const b = document.getElementById('eod-banner');
      if (show) {
        b.style.display = 'flex';
        document.getElementById('eod-banner-text').textContent =
          `📸 Showing EOD snapshot${date ? ' for ' + date : ''} — prices as of market close. Live updates resume at 09:15 AM IST.`;
      } else {
        b.style.display = 'none';
      }
    }

    // ── Render ────────────────────────────────────────────────────────────────
    function renderBoard(data) {
      if (!data || !data.stocks || data.stocks.length === 0) {
        showBoard(`
        <div class="empty-state">
          <div class="icon">📭</div>
          <h3>No gainers data yet</h3>
          <p>The background scanner runs from 09:15 AM.<br>
             Data populates at the first 5-minute poll.<br>
             Board: <b>${data.total_tracked || 0}</b> contracts tracked.</p>
        </div>`);
        return;
      }

      const stocks = data.stocks.filter(s => {
        // Apply filters to contracts, keep stock if any contract passes
        const filtered = filterContracts(s.contracts);
        return filtered.length > 0;
      });

      if (stocks.length === 0) {
        showBoard('<div class="empty-state"><div class="icon">🔍</div><h3>No results for current filter</h3><p>Try changing the filter options above.</p></div>');
        return;
      }

      // Synchronize the RVOL active button state
      const rvolBtn = document.getElementById('sort-rvol-btn');
      if (rvolBtn) {
        rvolBtn.classList.toggle('active', currentSortColumn === 'rvol');
      }

      // Sort by selected column
      if (currentSortColumn) {
        stocks.sort((a, b) => {
          let valA = 0;
          let valB = 0;
          if (currentSortColumn === 'rvol') {
            valA = a.rvol_ratio != null ? a.rvol_ratio : 0;
            valB = b.rvol_ratio != null ? b.rvol_ratio : 0;
          } else if (currentSortColumn === 'linearity') {
            valA = a.linearity_score != null ? a.linearity_score : 0;
            valB = b.linearity_score != null ? b.linearity_score : 0;
          } else if (currentSortColumn === 'gain') {
            const filtA = filterContracts(a.contracts);
            const filtB = filterContracts(b.contracts);
            valA = filtA.length > 0 ? Math.max(...filtA.map(c => c.gain_pct)) : a.best_gain;
            valB = filtB.length > 0 ? Math.max(...filtB.map(c => c.gain_pct)) : b.best_gain;
          } else if (currentSortColumn === 'dxcnt') {
            valA = a.dxcnt != null ? a.dxcnt : 0;
            valB = b.dxcnt != null ? b.dxcnt : 0;
          } else if (currentSortColumn === 'gap') {
            valA = a.gap_pct != null ? a.gap_pct : 0;
            valB = b.gap_pct != null ? b.gap_pct : 0;
          } else if (currentSortColumn === 'inst') {
            valA = a.inst_holding != null ? a.inst_holding : 0;
            valB = b.inst_holding != null ? b.inst_holding : 0;
          } else if (currentSortColumn === 'e9h') {
            // Sort: Y before N, then by hold time desc. No data sorts last.
            const e9hScore = (s) => {
              if (s.ema9_hold === 'Y') return 1000 + (s.ema9_hold_minutes || 0);
              if (s.ema9_hold === 'N') return -(s.ema9_hold_minutes || 0);
              return -9999;
            };
            valA = e9hScore(a);
            valB = e9hScore(b);
          } else if (currentSortColumn === 'fhvol') {
            valA = a.fh_cumulative_ratio != null ? a.fh_cumulative_ratio : 0;
            valB = b.fh_cumulative_ratio != null ? b.fh_cumulative_ratio : 0;
          } else if (currentSortColumn === 'futbuild') {
            const getBuildupWeight = (s) => {
              const cached = spurtCache[s.symbol];
              if (!cached || (Date.now() - cached.fetchedAt > 180000)) return 0;
              const b = cached.futures_buildup || '';
              if (b.includes('LB') || b.includes('Long Buildup')) return 4;
              if (b.includes('SC') || b.includes('Short Covering')) return 3;
              if (b.includes('LU') || b.includes('Long Unwinding')) return 2;
              if (b.includes('SB') || b.includes('Short Buildup')) return 1;
              return 0;
            };
            valA = getBuildupWeight(a);
            valB = getBuildupWeight(b);
          }

          if (valA !== valB) {
            return currentSortDirection === 'desc' ? valB - valA : valA - valB;
          }
          return b.best_gain - a.best_gain;
        });
      } else {
        stocks.sort((a, b) => b.best_gain - a.best_gain);
      }

      // Max gain across all visible stocks for bar scaling
      const maxGain = Math.max(...stocks.map(s => s.best_gain), 1);

      const cardsHtml = stocks.map((s, idx) => {
        const filtered = filterContracts(s.contracts);
        const bestGain = Math.max(...filtered.map(c => c.gain_pct));
        const badgeClass = bestGain >= 100 ? 'best-fire' : bestGain >= 50 ? 'best-rocket' : 'best-up';
        const badgeEmoji = bestGain >= 100 ? '🔥' : bestGain >= 50 ? '🚀' : '📈';

        const scp = s.spot_change_pct;
        const spotBadge = scp != null
          ? `<span style="font-size:0.75rem;font-weight:700;color:${scp >= 0 ? 'var(--green)' : 'var(--red)'};">${scp >= 0 ? '▲' : '▼'} ${scp >= 0 ? '+' : ''}${scp.toFixed(2)}%</span>`
          : '';

        const rvol = s.rvol_ratio;
        let rvolBadge = '';
        if (rvol != null) {
          const rvolColor = rvol >= 3 ? '#ff7b72' : rvol >= 2 ? '#3fb950' : rvol >= 1 ? '#e3b341' : '#8b949e';
          const rvolPrefix = rvol >= 3 ? '🔥' : rvol >= 2 ? '⚡' : rvol >= 1 ? '▲' : '▽';
          rvolBadge = `<span style="font-size:0.7rem;font-weight:700;color:${rvolColor};" title="Relative Volume vs 20-day avg">${rvolPrefix} ${rvol}x</span>`;
        } else {
          rvolBadge = `<span style="font-size:0.7rem;font-weight:700;color:#8b949e;opacity:0.6;" title="RVOL calculations warming up...">⏳ Loading</span>`;
        }

        const instVal = s.inst_holding != null ? s.inst_holding : 0;
        const instBadge = instVal > 0
          ? `<span style="font-family: var(--mono); font-weight: 700; font-size: 0.82rem; color: ${instVal >= 50.0 ? 'var(--blue)' : 'var(--text)'};">${instVal.toFixed(1)}%</span>`
          : `<span style="color: var(--text-muted); font-size: 0.82rem;">—</span>`;

        // EMA9 Hold badge
        const e9hState = s.ema9_hold;
        const e9hMins = s.ema9_hold_minutes || 0;
        let e9hBadge = '<span style="color:var(--text-muted);">—</span>';
        if (e9hState === 'Y') {
          const e9hColor = e9hMins >= 30 ? '#3fb950' : 'rgba(63,185,80,0.75)';
          e9hBadge = `<span style="color:${e9hColor};" title="Price holding above EMA9 for ${e9hMins} min">Y${e9hMins}</span>`;
        } else if (e9hState === 'N') {
          const e9hColor = e9hMins >= 30 ? '#ff7b72' : 'rgba(255,123,114,0.75)';
          e9hBadge = `<span style="color:${e9hColor};" title="Price below EMA9 for ${e9hMins} min">N${e9hMins}</span>`;
        }

        // First-Hour Volume Spurt badge (combined: spurt / cumulative)
        const fhSpurt = s.fh_spurt_ratio;
        const fhCumul = s.fh_cumulative_ratio;
        const fhTag = s.fh_spurt_tag;
        let fhBadge = '<span style="color:var(--text-muted);font-size:0.7rem;">—</span>';
        if (fhSpurt != null && fhCumul != null) {
          let fhColor = '#8b949e'; // Normal
          let fhGlow = '';
          if (fhTag === 'Abnormal') {
            fhColor = '#3fb950';
            fhGlow = 'text-shadow: 0 0 6px rgba(63,185,80,0.6);';
          } else if (fhTag === 'Elevated') {
            fhColor = '#e3b341';
          } else if (fhTag === 'Weak') {
            fhColor = '#ff7b72';
          }
          fhBadge = `<span style="color:${fhColor};${fhGlow}" title="Slot: ${fhSpurt}x vs baseline | 1H Pace: ${fhCumul}x">${fhSpurt}x<br><span style='font-size:0.62rem;opacity:0.7;'>${fhCumul}x</span></span>`;
        }

        // Expanded Option Premium Cards (Matches the layout in user's screenshot)
        const contractRows = filtered.map(c => {
          const gainClass = c.gain_pct >= 100 ? 'gain-fire' : c.gain_pct >= 50 ? 'gain-rocket' : 'gain-up';
          const emoji = c.gain_pct >= 100 ? '🔥' : c.gain_pct >= 50 ? '🚀' : '📈';
          const tag = c.is_opening ? '⭐' : '🏃';
          const optClass = c.opt_type === 'CE' ? 'opt-ce' : 'opt-pe';
          return `
          <div class="option-card">
            <div class="opt-left">
              <span class="layer-tag" title="${c.is_opening ? 'Opening strike (locked at 09:15)' : 'Running strike (accumulated)'}" style="font-size:0.85rem; color:${c.is_opening ? 'var(--gold)' : 'var(--run-color)'};">${tag}</span>
              <div class="opt-meta">
                <div class="strike-wrap">
                  <span class="strike-price">₹${c.strike.toLocaleString('en-IN')}</span>
                  <span class="opt-badge ${optClass}">${c.opt_type}</span>
                </div>
                <div class="premium-flow">
                  <span>₹${c.open_prem.toFixed(1)}</span>
                  <span class="prem-arrow">→</span>
                  <span>₹${c.ltp.toFixed(1)}</span>
                </div>
              </div>
            </div>
            <div class="opt-right">
              <span class="gain-pct ${gainClass}">${emoji} +${c.gain_pct.toFixed(1)}%</span>
            </div>
          </div>`;
        }).join('');

        // Remember expansion state
        const isExpanded = expandedSymbols.has(s.symbol);
        const displayStyle = isExpanded ? 'block' : 'none';
        const containerClass = isExpanded ? 'stock-row-container expanded' : 'stock-row-container';

        return `
        <div class="${containerClass}" data-symbol="${s.symbol}">
          <!-- Collapsed Header Row -->
          <div class="stock-row-header" onclick="toggleDetails(this)">
            
            <!-- Column 1: Symbol & Rank -->
            <div class="col-symbol">
              <span class="row-rank">#${idx + 1}</span>
              <span class="row-symbol">${s.symbol}</span>
            </div>
            
            <!-- Column 2: Spot % change -->
            <div class="col-spot">
              ${spotBadge}
            </div>
            
            <!-- Column 3: RVOL -->
            <div class="col-rvol">
              ${rvolBadge}
            </div>
            
            <!-- Column 4: Linearity % -->
            <div class="col-linearity">
              📏 ${s.linearity_score != null ? s.linearity_score : 100}%
            </div>
            
            <!-- Column 5: DXCNT (Daily EMA9/21 Crossover Count) -->
            <div class="col-points" style="color:${(s.dxcnt != null ? s.dxcnt : 0) >= 0 ? 'var(--green)' : 'var(--red)'}; font-family: var(--mono); font-weight: 700;">
              ${(s.dxcnt != null ? s.dxcnt : 0) >= 0 ? '+' : ''}${s.dxcnt != null ? s.dxcnt : 0}D
            </div>
            
            <!-- Column 6: Highest Option Gain % -->
            <div class="col-highest">
              <span class="best-badge ${badgeClass}">${badgeEmoji} +${bestGain.toFixed(0)}%</span>
            </div>
            
            <!-- Column 7: GAP % -->
            <div class="col-gap" style="color:${s.gap_pct >= 0 ? 'var(--green)' : 'var(--red)'}; font-family: var(--mono); font-weight: 700; font-size: 0.82rem;">
              ${s.gap_pct >= 0 ? '+' : ''}${s.gap_pct.toFixed(2)}%
            </div>
            
            <!-- Column 8: Inst Hold % -->
            <div class="col-inst">
              ${instBadge}
            </div>
            
            <!-- Column 9: E9H (EMA9 Hold) -->
            <div class="col-e9h">
              ${e9hBadge}
            </div>
            
            <!-- Column 10: FH Volume Spurt -->
            <div class="col-fhvol">
              ${fhBadge}
            </div>
            
            <!-- Column 10b: Future Buildup -->
            <div class="col-futbuild">
              ${getBuildupBadge(s.symbol)}
            </div>

            
            <!-- Column 11: Confluence Badges & Expand Arrow -->
            <div class="col-timeframes">
              <div class="conf-row" id="conf-${s.symbol}">
                ${getInitialConfluenceHtml(s.symbol)}
              </div>
              <span class="expand-arrow">▼</span>
            </div>
          </div>

          <!-- Collapsible Premium Details Section -->
          <div class="stock-row-details" style="display:${displayStyle};">
            ${contractRows}
          </div>
        </div>`;
      }).join('');

      const wrapperDisplay = _mainBoardCollapsed ? 'display: none;' : 'display: block;';
      const arrowChar = _mainBoardCollapsed ? '▲' : '▼';

      const html = `
      <div class="stock-cards-grid">
        <div class="outer-panel-header" onclick="toggleMainBoardPanel()" style="background: var(--bg-card2); border: 1px solid var(--border); border-radius: var(--radius); padding: 10px 16px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; user-select: none; margin-bottom: 2px;">
          <div style="font-weight: 700; font-size: 0.88rem; color: var(--text); display: flex; align-items: center; gap: 8px;">
            <span>🔥 Premium Gainers Board</span>
            <span style="background: rgba(56, 139, 253, 0.15); color: var(--blue); font-size: 0.68rem; padding: 2px 8px; border-radius: 12px; font-weight: 600; font-family: var(--mono);">${stocks.length} Stocks</span>
          </div>
          <span id="main-board-collapse-arrow" style="font-size: 0.75rem; color: var(--text-muted); font-weight: bold;">${arrowChar}</span>
        </div>
        <div id="main-board-collapsible-wrapper" style="${wrapperDisplay}">
          <div class="stock-board-header">
            <div class="col-symbol">Symbol</div>
            <div class="col-spot">% ▲/▼</div>
            <div class="col-rvol sortable" onclick="handleHeaderSort('rvol')">RVOL${getSortArrow('rvol')}</div>
            <div class="col-linearity sortable" onclick="handleHeaderSort('linearity')">Linearity${getSortArrow('linearity')}</div>
            <div class="col-points sortable" onclick="handleHeaderSort('dxcnt')">DXCNT${getSortArrow('dxcnt')}</div>
            <div class="col-highest sortable" onclick="handleHeaderSort('gain')">Gain${getSortArrow('gain')}</div>
            <div class="col-gap sortable" onclick="handleHeaderSort('gap')">GAP${getSortArrow('gap')}</div>
            <div class="col-inst sortable" onclick="handleHeaderSort('inst')">Inst Hold${getSortArrow('inst')}</div>
            <div class="col-e9h sortable" onclick="handleHeaderSort('e9h')">E9H${getSortArrow('e9h')}</div>
            <div class="col-fhvol sortable" onclick="handleHeaderSort('fhvol')">FH Vol${getSortArrow('fhvol')}</div>
            <div class="col-futbuild sortable" onclick="handleHeaderSort('futbuild')">Fut Buildup${getSortArrow('futbuild')}</div>
            <div class="col-timeframes" style="padding-right: 24px;">Confluence</div>
          </div>
          ${cardsHtml}
        </div>

        <!-- Futures Buildup Panel (inside stock-cards-grid) -->
        <div class="futbld-panel">
          <div class="futbld-panel-header" onclick="toggleFutbldPanel()">
            <div style="display:flex;align-items:center;gap:8px;">
              <span style="font-weight:700;font-size:0.88rem;color:var(--text);">📊 Futures Buildup</span>
              <span class="futbld-count-pill" id="futbld-count-pill">${_futbldData ? _futbldData.count + ' Stocks' : '—'}</span>
              <span class="futbld-updated" id="futbld-updated-at">${_futbldData && _futbldData.updated_at ? '· ' + _futbldData.updated_at : ''}</span>
            </div>
            <span id="futbld-arrow" style="font-size:0.75rem;color:var(--text-muted);font-weight:bold;">${_futbldOpen ? '▲' : '▼'}</span>
          </div>
          <div class="futbld-body${_futbldOpen ? ' open' : ''}" id="futbld-body">
            ${_buildFutbldGroupsHtml()}
          </div>
        </div>

      </div>
      <div class="board-right-bar-container" id="right-bar">
        <div class="crossover-columns-wrap">
          <!-- Bulls Column -->
          <div class="board-right-bar bulls-card">
            <div class="right-bar-header" style="padding: 10px 14px; border-bottom: 1px solid var(--border2);">
              <div class="right-bar-title-wrap" style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 6px;">
                <h3 style="color:#3fb950; font-size:0.85rem; margin:0; display:flex; align-items:center; gap:6px;">🟢 Bulls <span class="badge" id="crossover-count-bulls" style="background:rgba(63,185,80,0.15); color:#3fb950; font-size:0.68rem; padding:1px 5px; border-radius:10px; font-weight:600;">0</span></h3>
                <span class="pulse-dot active" id="crossover-pulse-bulls"></span>
              </div>
              <div class="crossover-filters" style="display:flex; gap:3px;">
                <button class="filter-btn compact" id="crossover-filter-all-bulls" onclick="setCrossoverFilterBulls('all')" style="font-size:0.6rem; padding:2px 6px;">All</button>
                <button class="filter-btn compact" id="crossover-filter-aligned-bulls" onclick="setCrossoverFilterBulls('aligned')" style="font-size:0.6rem; padding:2px 6px;">Aligned</button>
                <button class="filter-btn compact" id="crossover-filter-cross-bulls" onclick="setCrossoverFilterBulls('cross')" style="font-size:0.6rem; padding:2px 6px;">Cross</button>
              </div>
            </div>
            <div class="right-bar-list" id="crossover-list-bulls" style="flex:1; overflow-y:auto;">
              <div class="empty-state" style="padding: 15px 0;">
                <div class="spinner" style="width: 16px; height: 16px;"></div>
              </div>
            </div>
            <div class="right-bar-footer" style="padding: 6px 10px; font-size: 0.62rem; display:flex; justify-content:space-between; border-top:1px solid var(--border2); color:var(--text-muted);">
              <span>Updated: <span id="crossover-time-bulls">—</span></span>
            </div>
          </div>

          <!-- Bears Column -->
          <div class="board-right-bar bears-card">
            <div class="right-bar-header" style="padding: 10px 14px; border-bottom: 1px solid var(--border2);">
              <div class="right-bar-title-wrap" style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 6px;">
                <h3 style="color:#ff7b72; font-size:0.85rem; margin:0; display:flex; align-items:center; gap:6px;">🔴 Bears <span class="badge" id="crossover-count-bears" style="background:rgba(255,123,114,0.15); color:#ff7b72; font-size:0.68rem; padding:1px 5px; border-radius:10px; font-weight:600;">0</span></h3>
                <span class="pulse-dot active" id="crossover-pulse-bears"></span>
              </div>

    function filterContracts(contracts) {

        return `<span class="conf-pill conf-loading">D</span><span class="conf-pill conf-loading">1H</span><span class="conf-pill conf-loading">15M</span>`;
      }
      const getConfClass = (st) => st === 'bullish' ? 'conf-bullish' : (st === 'bearish' ? 'conf-bearish' : 'conf-neutral');
      const dC = getConfClass(item.state_day);
      const h1C = getConfClass(item.state_1h);
      const m15C = getConfClass(item.state_15m);

      const dT = `Daily Trend: ${item.state_day || 'none'}${item.cross_time_day ? ' · Cross: ' + item.cross_time_day : ''}`;
      const h1T = `1H Trend: ${item.state_1h || 'none'}${item.cross_time_1h ? ' · Cross: ' + item.cross_time_1h : ''}`;
      const m15T = `15M Trend: ${item.state_15m || 'none'}${item.cross_time_15m ? ' · Cross: ' + item.cross_time_15m : ''}`;

      return `<span class="conf-pill ${dC}" title="${dT}">D</span><span class="conf-pill ${h1C}" title="${h1T}">1H</span><span class="conf-pill ${m15C}" title="${m15T}">15M</span>`;
    }

    // ── Confluence ────────────────────────────────────────────────────
    async function fetchConfluence(symbols) {
      if (!symbols || !symbols.length) return;
      try {
        const res = await fetch('/api/confluence?symbols=' + symbols.join(','));
        if (!res.ok) return;
        const data = await res.json();
        const TF_ORDER = [
          { label: 'D', key: 'day', name: 'Daily' },
          { label: '1H', key: '1h', name: '1 Hour' },
          { label: '15M', key: '15m', name: '15 Min' },
        ];
        for (const [symbol, tfs] of Object.entries(data)) {
          const row = document.getElementById('conf-' + symbol);
          if (!row) continue;
          row.innerHTML = TF_ORDER.map(({ label, key, name }) => {
            const sig = tfs[key] || {};
            const overall = sig.overall || 'neutral';
            const tip = `${name}: RSI ${sig.rsi ?? '—'} · MACD ${sig.macd || '—'} · EMA ${sig.ema || '—'}`;
            return `<span class="conf-pill conf-${overall}" title="${tip}">${label}</span>`;
          }).join('');
        }
      } catch (e) {
        // Confluence is non-critical — fail silently
      }
    }

    // ── EMA Crossovers ────────────────────────────────────────────────────────
    // ── EMA Crossovers ────────────────────────────────────────────────────────
    let crossoverData = null;
    let crossoverFilterBulls = 'all';
    let crossoverFilterBears = 'all';

    let _emaPollTimer = null;

    async function fetchEmaCrossovers() {
      try {
        const res = await fetch('/api/ema-crossovers');
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();
        crossoverData = data;
        renderCrossovers();

        // Fast-poll every 3s while backend is actively scanning
        if (_emaPollTimer) clearTimeout(_emaPollTimer);
        if (data.status === 'scanning') {
          _emaPollTimer = setTimeout(fetchEmaCrossovers, 3000);
        } else {
          // Outside market hours with no EOD data yet — poll slowly to keep
          // client heartbeat alive so the backend EOD scan can complete (~2 min).
          const _istPoll = new Date(new Date().toLocaleString('en-US', { timeZone: 'Asia/Kolkata' }));
          const _hPoll = _istPoll.getHours(), _mPoll = _istPoll.getMinutes();
          const _inMktPoll = (_hPoll === 9 && _mPoll >= 15) || (_hPoll >= 10 && _hPoll < 15) || (_hPoll === 15 && _mPoll <= 30);
          const hasEodData = data.crossovers && Object.keys(data.crossovers).length > 0;
          if (!_inMktPoll && !hasEodData) {
            _emaPollTimer = setTimeout(fetchEmaCrossovers, 15000); // keep heartbeat until EOD scan done
          }
          // hasEodData or in market hours → no further auto-poll needed
        }
      } catch (e) {
        console.error('Error fetching crossovers:', e);
      }
    }

    function setCrossoverFilterBulls(filter) {
      crossoverFilterBulls = filter;
      document.querySelectorAll('.bulls-card .filter-btn').forEach(btn => btn.classList.remove('active'));
      const activeBtn = document.getElementById(`crossover-filter-${filter}-bulls`);

    }

    function setCrossoverFilterBears(filter) {
      crossoverFilterBears = filter;
      document.querySelectorAll('.bears-card .filter-btn').forEach(btn => btn.classList.remove('active'));
      const activeBtn = document.getElementById(`crossover-filter-${filter}-bears`);
      if (activeBtn) activeBtn.classList.add('active');
      renderCrossovers();
    }

    function renderCrossovers() {
      const listBulls = document.getElementById('crossover-list-bulls');
      const listBears = document.getElementById('crossover-list-bears');
      const timeBulls = document.getElementById('crossover-time-bulls');
      const timeBears = document.getElementById('crossover-time-bears');
      const pulseBulls = document.getElementById('crossover-pulse-bulls');
      const pulseBears = document.getElementById('crossover-pulse-bears');
      const countBulls = document.getElementById('crossover-count-bulls');
      const countBears = document.getElementById('crossover-count-bears');

      if (!crossoverData) return;

      const _istNow = new Date(new Date().toLocaleString('en-US', { timeZone: 'Asia/Kolkata' }));
      const _hNow = _istNow.getHours(), _mNow = _istNow.getMinutes();
      const _inMktNow = (_hNow === 9 && _mNow >= 15) || (_hNow >= 10 && _hNow < 15) || (_hNow === 15 && _mNow <= 30);

      let timeText = '—';
      if (crossoverData.last_update) {
        const parts = crossoverData.last_update.split(' '); // ["2026-05-26", "15:28:45"]
        if (!_inMktNow && parts.length >= 2) {
          // Outside market hours — show full EOD label: "📸 EOD · 26-May 15:28"
          const timePart = parts[1].substring(0, 5);
          const [yr, mo, dy] = parts[0].split('-');
          const monName = new Date(+yr, +mo - 1).toLocaleString('en-US', { month: 'short' });
          timeText = `📸 EOD &nbsp;·&nbsp; ${dy}-${monName} ${timePart}`;
        } else {
          timeText = parts[1] || crossoverData.last_update; // time only during live hours
        }
      }
      if (timeBulls) timeBulls.innerHTML = timeText;
      if (timeBears) timeBears.innerHTML = timeText;

      const updatePulse = (pulseEl) => {
        if (!pulseEl) return;
        if (crossoverData.status === 'scanning') {
          pulseEl.style.background = '#d29922';
          pulseEl.classList.add('active');
        } else if (crossoverData.status === 'completed') {
          pulseEl.style.background = '#238636';
          pulseEl.classList.add('active');
        } else {
          pulseEl.classList.remove('active');
        }
      };
      updatePulse(pulseBulls);
      updatePulse(pulseBears);

      const crossovers = crossoverData.crossovers || {};
      const allKeys = Object.keys(crossovers);

      // Separate into Bulls and Bears
      let bullKeys = [];
      let bearKeys = [];

      const isTodayEpoch = (ep) => {
        if (!ep || ep <= 0) return false;
        const d = new Date(ep * 1000);
        const now = new Date();
        return d.toDateString() === now.toDateString();
      };

      const get5mCrossDirection = (item) => {
        if (!item) return 'none';
        if (item.cross_hold_5m) {
          if (item.cross_hold_5m.startsWith('Y')) return 'bullish';
          if (item.cross_hold_5m.startsWith('N')) return 'bearish';
        }
        if (item.cross_5m === 'bullish') return 'bullish';
        if (item.cross_5m === 'bearish') return 'bearish';
        if (item.cross_epoch_5m > 0 && isTodayEpoch(item.cross_epoch_5m)) {
          if (item.state_5m === 'bullish') return 'bullish';
          if (item.state_5m === 'bearish') return 'bearish';
        }
        return 'none';
      };

      allKeys.forEach(k => {
        const item = crossovers[k];
        const states = [item.state_5m, item.state_15m, item.state_1h, item.state_day];
        const bullCount = states.filter(s => s === 'bullish').length;
        const bearCount = states.filter(s => s === 'bearish').length;

        const crossDir = get5mCrossDirection(item);
        const hasBullCross = crossDir === 'bullish';
        const hasBearCross = crossDir === 'bearish';

        let isBull = false;
        if (hasBullCross) {
          isBull = true;
        } else if (hasBearCross) {
          isBull = false;
        } else if (item.alignment === 'bullish') {
          isBull = true;
        } else if (item.alignment === 'bearish') {
          isBull = false;
        } else {
          isBull = bullCount > bearCount;
        }

        if (isBull) {
          bullKeys.push(k);
        } else {
          bearKeys.push(k);
        }
      });

      // Apply Button Filters to Bulls (strictly 5M Cross from today)
      if (crossoverFilterBulls === 'aligned') {
        bullKeys = bullKeys.filter(k => crossovers[k].alignment === 'bullish');
      } else if (crossoverFilterBulls === 'cross') {
        bullKeys = bullKeys.filter(k => get5mCrossDirection(crossovers[k]) === 'bullish');
      }

      // Apply Button Filters to Bears (strictly 5M Cross from today)
      if (crossoverFilterBears === 'aligned') {
        bearKeys = bearKeys.filter(k => crossovers[k].alignment === 'bearish');
      } else if (crossoverFilterBears === 'cross') {
        bearKeys = bearKeys.filter(k => get5mCrossDirection(crossovers[k]) === 'bearish');
      }

      const sortKeys = (keysList) => {
        keysList.sort((a, b) => {
          const cA = crossovers[a];
          const cB = crossovers[b];

          const dirA = get5mCrossDirection(cA);
          const dirB = get5mCrossDirection(cB);
          const isCrossA = (dirA === 'bullish' || dirA === 'bearish');
          const isCrossB = (dirB === 'bullish' || dirB === 'bearish');

          // Priority 1: 5M Crossovers grouped at top
          if (isCrossA !== isCrossB) {
            return isCrossB ? 1 : -1;
          }

          // Priority 2: Sort by most recent crossover epoch timestamp (newest on top)
          const epochA = cA.cross_epoch_5m || 0;
          const epochB = cB.cross_epoch_5m || 0;
          if (epochA !== epochB) {
            return epochB - epochA;
          }

          // Priority 3: Candle size (largest first)
          const sizeA = cA.cross_candle_size_5m || 0;
          const sizeB = cB.cross_candle_size_5m || 0;
          if (Math.abs(sizeA - sizeB) > 0.01) {
            return sizeB - sizeA;
          }

          return a.localeCompare(b);
        });
      };
      sortKeys(bullKeys);
      sortKeys(bearKeys);

      if (countBulls) countBulls.textContent = bullKeys.length;
      if (countBears) countBears.textContent = bearKeys.length;

      const nowSecs = Math.floor(Date.now() / 1000);

      const renderList = (keysList, container) => {
        if (!container) return;

        // Build a tiny, elegant progress bar to display at the top while scanning
        let progressHtml = '';
        if (crossoverData && crossoverData.status === 'scanning') {
          const cur = crossoverData.scan_current || 0;
          const tot = crossoverData.scan_total || 214;
          const pct = tot > 0 ? Math.round((cur / tot) * 100) : 0;
          progressHtml = `
            <div style="padding: 6px 10px; border-bottom: 1px solid var(--border2); background: rgba(210,153,34,0.03); margin-bottom: 6px;">
              <div style="font-size: 0.58rem; color: var(--text-muted); margin-bottom: 3px; display: flex; justify-content: space-between; align-items: center;">
                <span>Scanning FNO symbols…</span>
                <span style="font-weight: 600; color: #e3b341;">${cur}/${tot}</span>
              </div>
              <div style="height: 2px; background: rgba(255,255,255,0.07); border-radius: 1px; overflow: hidden;">
                <div style="height: 100%; width: ${pct}%; background: linear-gradient(90deg, #d29922, #e3b341); border-radius: 1px; transition: width 0.4s ease;"></div>
              </div>
            </div>`;
        }

        if (keysList.length === 0) {
          if (crossoverData && crossoverData.status === 'scanning') {
            container.innerHTML = progressHtml;
          } else {
            // Market-hours-aware empty state
            const _ist = new Date(new Date().toLocaleString('en-US', { timeZone: 'Asia/Kolkata' }));
            const _h = _ist.getHours(), _m = _ist.getMinutes();
            const _inMkt = (_h === 9 && _m >= 15) || (_h >= 10 && _h < 15) || (_h === 15 && _m <= 30);
            let _msg;
            if (!_inMkt) {
              _msg = '🌙 No EOD data yet &nbsp;·&nbsp; Will populate after first live scan';
            } else if (crossoverData.status === 'initializing') {
              _msg = '⏳ Waiting for first scan…';
            } else {
              _msg = 'No symbols found';
            }
            container.innerHTML = `<div style="text-align:center;padding:15px;font-size:0.68rem;color:var(--text-muted);">${_msg}</div>`;
          }
          return;
        }

        container.innerHTML = progressHtml + keysList.map(k => {
          const item = crossovers[k];
          let alignmentClass = 'mixed';
          let alignmentText = 'Mixed';
          if (item.alignment === 'bullish') {
            alignmentClass = 'aligned-bull';
            alignmentText = '🔥 Bullish';
          } else if (item.alignment === 'bearish') {
            alignmentClass = 'aligned-bear';
            alignmentText = '❄️ Bearish';
          }

          // Dynamic Fresh Crossover Badge & New live flag (strictly 5M Cross)
          const crossDir = get5mCrossDirection(item);
          let crossBadge = '';
          let activeCrossTime = item.cross_time_5m || '';
          const holdStr = item.cross_hold_5m ? ` ${item.cross_hold_5m}` : '';
          if (crossDir === 'bullish') {
            crossBadge = `<span class="cross-pill bullish">▲ 5M Cross${holdStr}</span>`;
          } else if (crossDir === 'bearish') {
            crossBadge = `<span class="cross-pill bearish">▼ 5M Cross${holdStr}</span>`;
          }

          // Crossover occurred in today's session
          const itemEpoch = item.cross_epoch_5m || 0;
          const diffSecs = nowSecs - itemEpoch;
          const isFresh5m = crossDir !== 'none';
          const isNewCrossover = isFresh5m && (itemEpoch > 0 && diffSecs >= 0 && diffSecs <= 3600);
          const flagMarkup = isNewCrossover ? '<span class="flag-badge">🚩 NEW</span>' : '';
          const itemClass = isNewCrossover ? 'crossover-item new-entry' : 'crossover-item';

          let cross_desc = activeCrossTime;
          const sub_desc = cross_desc ? `<span class="cross-time-sub" title="Crossover Time">${cross_desc}</span>` : '';

          const pill_5m = item.state_5m === 'bullish' ? 'bullish' : (item.state_5m === 'bearish' ? 'bearish' : '');

                ${(() => { const scp = item.spot_change_pct; return scp != null ? `<span style="font-size:0.48rem;font-weight:700;color:${scp >= 0 ? '#3fb950' : '#ff7b72'}">${scp >= 0 ? '▲' : '▼'}${scp >= 0 ? '+' : ''}${scp.toFixed(2)}%</span>` : ''; })()}
