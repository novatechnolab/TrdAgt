      renderList(bullKeys, listBulls);
      renderList(bearKeys, listBears);

      // Synchronize main table confluence pills using fresh crossover scanner cache
      if (crossoverData && crossoverData.crossovers) {
        document.querySelectorAll('[id^="conf-"]').forEach(row => {
          const sym = row.id.replace('conf-', '');
          const html = getInitialConfluenceHtml(sym);
          if (html && !html.includes('conf-loading')) {
            row.innerHTML = html;
          }
        });
      }
    }

    // ── Countdown ─────────────────────────────────────────────────────────────
    function resetCountdown() {
      countdown = REFRESH_INTERVAL;
      if (timerHandle) clearInterval(timerHandle);
      timerHandle = setInterval(() => {
        countdown--;
        document.getElementById('countdown').textContent = countdown + 's';
        if (countdown <= 0) {
          clearInterval(timerHandle);
          fetchBoard();
        }
      }, 1000);
    }

    // ── Spurt Scanner Stats Fetcher ──
    let _oiStatsFetchActive = false;
    async function fetchOIStatsForSymbols(symbols) {
      if (_oiStatsFetchActive) return;
      _oiStatsFetchActive = true;

      const now = Date.now();
      const symbolsToFetch = symbols.filter(sym => {
        const cached = spurtCache[sym];
        return !cached || (now - cached.fetchedAt > 120000); // refresh every 2 mins
      });

      if (symbolsToFetch.length === 0) {
        _oiStatsFetchActive = false;
        return;
      }

      for (const sym of symbolsToFetch) {
        try {
          const response = await fetch(`/api/oi/symbol/${sym}`);
          if (response.ok) {
            const resData = await response.json();
            spurtCache[sym] = {
              futures_buildup: resData.futures_data?.buildup || '–',
              fetchedAt: Date.now()
            };
            if (lastData) renderBoard(lastData);
          }
        } catch (e) {
          console.warn(`Failed to fetch Spurt stats for ${sym}:`, e);
        }
        await new Promise(resolve => setTimeout(resolve, 150));
      }
      _oiStatsFetchActive = false;
    }

    // ── Toast ─────────────────────────────────────────────────────────────────
    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 2500);
    }

    // ── Live Breakout Polling ─────────────────────────────────────────────────
    let _liveBreakoutData = null;

    async function fetchLiveBreakouts() {
      try {
        const res = await fetch('/api/live-breakouts');
        if (!res.ok) return;
        _liveBreakoutData = await res.json();
        renderLiveBreakouts();
      } catch (e) {
        // Fail silently — non-critical feature
      }
    }

    function renderLiveBreakouts() {
      const data = _liveBreakoutData;
      if (!data) return;

      const alertList = document.getElementById('live-alert-list');
      const squeezeList = document.getElementById('live-squeeze-list');
      const coilList = document.getElementById('live-coil-list');
      const alertCount = document.getElementById('live-alert-count');
      const squeezeCount = document.getElementById('live-squeeze-count');
      const coilCount = document.getElementById('live-coil-count');

      if (!alertList || !squeezeList) return;

      const alerts = data.triggered_alerts || [];
      const watches = data.squeeze_watchlist || [];
      const collisions = data.collision_alerts || [];
      const bbSqueezes = data.bb_squeezes || [];
      const emaCoils = data.ema_coils || [];

      // Update counts
      if (alertCount) alertCount.textContent = alerts.length;
      if (squeezeCount) squeezeCount.textContent = bbSqueezes.length;
      if (coilCount) coilCount.textContent = emaCoils.length;

      const totalCount = document.getElementById('live-total-count');
      if (totalCount) totalCount.textContent = alerts.length + watches.length;

      const squeezeWatchlistSub = document.getElementById('live-squeeze-watchlist-subtitle');
      if (squeezeWatchlistSub) {
        squeezeWatchlistSub.textContent = `Squeeze: ${bbSqueezes.length} · EMA Coil: ${emaCoils.length}`;
      }

      // Combine all live alerts (breakouts + EMA collisions) and sort strictly by trigger_epoch descending (newest on top)
      const combinedAlerts = [
        ...alerts.map(a => ({ ...a, _kind: 'breakout' })),
        ...collisions.map(c => ({ ...c, _kind: 'collision' }))
      ];
      combinedAlerts.sort((a, b) => (b.trigger_epoch || 0) - (a.trigger_epoch || 0));

      if (alertCount) alertCount.textContent = combinedAlerts.length;

      if (combinedAlerts.length === 0) {
        alertList.innerHTML = `<div style="font-size:0.56rem; color:var(--text-muted); padding:3px 0;">⏳ Waiting for breakouts…</div>`;
      } else {
        alertList.innerHTML = combinedAlerts.map(item => {
          if (item._kind === 'breakout') {
            const isBull = item.direction === 'bullish';
            const isA = item.grade === 'Grade A' || item.grade === '5M Cross';
            const pillCls = isA ? (isBull ? 'grade-a' : 'grade-a bearish') : (isBull ? 'grade-b' : 'grade-b bearish');
            const arrow = isBull ? '▲' : '▼';
            const gradeStar = item.grade === 'Grade A' ? '★ ' : '';
            const volStr = item.vol_multiplier ? `×${item.vol_multiplier}` : '';
            return `
              <div class="breakout-alert-pill horizontal ${pillCls}" style="display:flex; justify-content:space-between; width:100%; padding:6px 10px; border-radius:6px; margin:0; box-sizing:border-box;" title="LTP: ₹${item.ltp} · Vol: ${volStr} · Time: ${item.time}">
                <div style="display:flex; align-items:center; gap:5px;">
                  <span style="font-weight:800; color:${isBull ? '#3fb950' : '#ff7b72'}; font-size:0.65rem;">${arrow} ${item.symbol}</span>
                  <span style="opacity:0.85; font-size:0.52rem; background:rgba(255,255,255,0.06); padding:1px 3.5px; border-radius:3px; font-weight:700; color:${isBull ? '#3fb950' : '#ff7b72'};">${gradeStar}${item.grade}</span>
                </div>
                <div style="display:flex; align-items:center; gap:6px;">
                  <span style="font-family:var(--mono); font-weight:700; color:var(--text); font-size:0.62rem;">₹${item.ltp}</span>
                  ${volStr ? `<span style="opacity:0.65; font-size:0.52rem; color:var(--text-muted); font-weight:600;">${volStr}</span>` : ''}
                  <span style="opacity:0.5; font-size:0.52rem; color:var(--text-muted); font-family:var(--mono);">${item.time}</span>
                </div>
              </div>`;
          } else {
            // Collision alert (EMA Collision)
            const isBull = item.direction === 'bullish';
            const arrow = isBull ? '▲' : '▼';
            const color = isBull ? '#388bfd' : '#e09400';
            const bg = isBull ? 'rgba(56,139,253,0.10)' : 'rgba(224,148,0,0.10)';
            const gapStr = item.gap_pct ? ` · Δ${Number(item.gap_pct).toFixed(3)}%` : '';
            const volStr = item.vol_multiplier ? `×${item.vol_multiplier}` : '';
            return `
              <div class="breakout-alert-pill horizontal" style="display:flex; justify-content:space-between; width:100%; padding:6px 10px; border-radius:6px; margin:0; box-sizing:border-box; background:${bg}; border-left:2px solid ${color};" title="EMA9/EMA21 Coil Breakout${gapStr} · LTP: ₹${item.ltp} · ${item.time}">
                <div style="display:flex; align-items:center; gap:5px;">
                  <span style="font-weight:800; color:${color}; font-size:0.65rem;">${arrow} ${item.symbol}</span>
                  <span style="opacity:0.85; font-size:0.50rem; background:${bg}; padding:1px 4px; border-radius:3px; font-weight:700; color:${color}; border:1px solid ${color}40; letter-spacing:0.3px;">EMA COLLISION</span>
                </div>
                <div style="display:flex; align-items:center; gap:6px;">
                  <span style="font-family:var(--mono); font-weight:700; color:var(--text); font-size:0.62rem;">₹${item.ltp}</span>
                  ${volStr ? `<span style="opacity:0.65; font-size:0.52rem; color:var(--text-muted); font-weight:600;">${volStr}</span>` : ''}
                  <span style="opacity:0.5; font-size:0.52rem; color:var(--text-muted); font-family:var(--mono);">${item.time}</span>
                </div>
              </div>`;
          }
        }).join('');
      }

      // Render BB Squeeze watchlist (gold pills)
      if (bbSqueezes.length === 0) {
        squeezeList.innerHTML = `<div style="font-size:0.56rem; color:var(--text-muted); padding:3px 0;">No active squeezes</div>`;
      } else {
        squeezeList.innerHTML = [...bbSqueezes]
          .sort((a, b) => b.squeeze_duration_mins - a.squeeze_duration_mins)
          .map(w => {
            const durLabel = w.squeeze_duration_mins >= 2 ? `${w.squeeze_duration_mins}m` : '<1m';
            return `
              <div class="squeeze-pill horizontal" style="display:flex; justify-content:space-between; width:100%; padding:6px 10px; border-radius:6px; margin:0; box-sizing:border-box;" title="Consolidation Range: ₹${w.consolidation_low}–₹${w.consolidation_high}">
                <div style="display:flex; align-items:center; gap:5px;">
                  <span style="font-weight:800; color:#ffd700; font-size:0.65rem;">◌ ${w.symbol}</span>
                  <span style="opacity:0.85; font-size:0.52rem; background:rgba(255,255,255,0.06); padding:1px 3px; border-radius:3px; font-weight:600; color:#ffd700;">Squeeze</span>
                </div>
                <div style="display:flex; align-items:center; gap:6px;">
                  <span style="font-family:var(--mono); font-weight:700; color:var(--text); font-size:0.62rem;">₹${w.last_ltp}</span>
                  <span style="opacity:0.75; font-size:0.52rem; font-weight:600; background:rgba(210,153,34,0.15); border-radius:3px; padding:1px 3px; color:#e3b341; font-family:var(--mono);">⏳ ${durLabel}</span>
                </div>
              </div>`;
          }).join('');
      }

      // Render EMA Coil watchlist (blue pills)
      if (coilList) {
        if (emaCoils.length === 0) {
          coilList.innerHTML = `<div style="font-size:0.56rem; color:var(--text-muted); padding:3px 0;">No EMA coil stocks</div>`;
        } else {
          coilList.innerHTML = [...emaCoils]
            .map(w => {
              const gapLabel = w.ema_gap_pct ? `${Number(w.ema_gap_pct).toFixed(3)}%` : '';
              const coilTime = w.coil_time || '';
              return `
                <div class="squeeze-pill horizontal" style="display:flex; justify-content:space-between; width:100%; padding:6px 10px; border-radius:6px; margin:0; box-sizing:border-box; border-left:2px solid #388bfd;" title="EMA Gap: ${gapLabel} of LTP · First seen: ${coilTime}">
                  <div style="display:flex; align-items:center; gap:5px;">
                    <span style="font-weight:800; color:#388bfd; font-size:0.65rem;">⟳ ${w.symbol}</span>
                    <span style="opacity:0.85; font-size:0.52rem; background:rgba(56,139,253,0.12); padding:1px 3px; border-radius:3px; font-weight:600; color:#388bfd;">EMA Coil</span>
                  </div>
                  <div style="display:flex; align-items:center; gap:6px;">
                    <span style="font-family:var(--mono); font-weight:700; color:var(--text); font-size:0.62rem;">₹${w.last_ltp}</span>
                    ${gapLabel ? `<span style="opacity:0.75; font-size:0.52rem; font-weight:600; background:rgba(56,139,253,0.12); border-radius:3px; padding:1px 3px; color:#388bfd; font-family:var(--mono);">Δ${gapLabel}</span>` : ''}
                    ${coilTime ? `<span style="opacity:0.5; font-size:0.52rem; color:var(--text-muted); font-family:var(--mono);">${coilTime}</span>` : ''}
                  </div>
                </div>`;
            }).join('');
        }
      }
    }


    // ── Init ──────────────────────────────────────────────────────────────────
    fetchBoard();
    fetchEmaCrossovers();
    fetchLiveBreakouts();

    // Independent EMA crossover poll — fires during market hours OR any time a scan
    // may have started on the backend (always poll every 30s so we catch the
    // scanning → progress bar transition even outside market hours).
    setInterval(() => {
      const now = new Date(new Date().toLocaleString('en-US', { timeZone: 'Asia/Kolkata' }));
      const h = now.getHours(), m = now.getMinutes(), d = now.getDay();
      const inMarket = d >= 1 && d <= 5 &&
        ((h === 9 && m >= 15) || (h >= 10 && h <= 14) || (h === 15 && m <= 30));
      // Always poll: when in market, when actively scanning, OR after-hours/weekends
      // (backend may have kicked off a new scan that changed status to 'scanning').
      // The 3s fast-poll inside fetchEmaCrossovers handles tight progress updates once
      // a scanning status is detected.
      if (inMarket || (crossoverData && crossoverData.status === 'scanning') || true) {
        fetchEmaCrossovers();
      }
    }, 30000);

    // Live Breakout poll — every 15 seconds during market hours
    setInterval(() => {
      const now = new Date(new Date().toLocaleString('en-US', { timeZone: 'Asia/Kolkata' }));
      const h = now.getHours(), m = now.getMinutes(), d = now.getDay();
      const inMarket = d >= 1 && d <= 5 &&
        ((h === 9 && m >= 15) || (h >= 10 && h <= 14) || (h === 15 && m <= 30));
      if (inMarket) fetchLiveBreakouts();
    }, 15000);


    // ── Futures Buildup Section ──────────────────────────────────────────────
    let _futbldOpen = false;
    let _futbldData = null;
    let _futbldFetchedOnce = false;
    const FUTBLD_GROUPS = [
      { key: 'lb', label: 'Long Buildup', emoji: '🟢', cls: 'long-buildup', desc: ': Bullish Forceful/aggressive :Long Buildup (fresh conviction buying)' },
      { key: 'sc', label: 'Short Covering', emoji: '🔵', cls: 'short-covering', desc: ': Bullish(Gentle):Short Covering (forced buy-back)' },
      { key: 'fl', label: 'Flat', emoji: '⚪', cls: 'flat', desc: '' },
      { key: 'lu', label: 'Long Unwinding', emoji: '🟡', cls: 'long-unwinding', desc: ': Bearish(Gentle):Long Unwinding (voluntary exit)' },
      { key: 'sb', label: 'Short Buildup', emoji: '🔴', cls: 'short-buildup', desc: ': Bearish Forceful/aggressive:Short Buildup (fresh conviction selling)' },
    ];
    const _futbldGroupOpen = {};
    const _futbldSort = {};   // {grp: {col: 'chg'|'ltp'|'rvol'|..., dir: 'asc'|'desc'}}
    FUTBLD_GROUPS.forEach(g => { _futbldGroupOpen[g.key] = true; _futbldSort[g.key] = { col: null, dir: null }; });
    const CAP_ORDER = { 'Large Cap': 0, 'Mid Cap': 1, 'Small Cap': 2 };
    const CAP_SHORT = { 'Large Cap': 'L', 'Mid Cap': 'M', 'Small Cap': 'S' };
    const CAP_CSS = { 'Large Cap': 'large', 'Mid Cap': 'mid', 'Small Cap': 'small' };

    function _fbArrow(grp, col) {
      const s = _futbldSort[grp];
      if (s.col === col) return s.dir === 'asc' ? ' ▴' : ' ▾';
      return '<span style="opacity:0.25;"> ⇅</span>';
    }

    function _buildFutbldGroupsHtml() {
      return FUTBLD_GROUPS.map(g => {
        const open = _futbldGroupOpen[g.key];
        const k = g.key;
        return `<div class="futbld-group" id="futbld-grp-${k}">
              <div class="futbld-group-hdr" onclick="toggleFutbldGroup('${k}')">
                <span>${g.emoji} ${g.label} <span id="futbld-${k}-count" style="font-size:0.6rem;font-weight:400;margin-left:4px;"></span></span>
                <span id="futbld-${k}-arrow">${open ? '▼' : '▶'}</span>
              </div>
              <div id="futbld-${k}-wrap" class="futbld-tbl-wrap" style="${open ? '' : 'display:none'}">
                <table class="futbld-tbl"><thead><tr>
                  <th>Fut Buildup</th>
                  <th class="sortable" id="futbld-${k}-th-sym"  onclick="sortFutbldCol('${k}','sym')">Symbol${_fbArrow(k, 'sym')}</th>
                  <th class="sortable" id="futbld-${k}-th-ltp"  onclick="sortFutbldCol('${k}','ltp')">Spot LTP${_fbArrow(k, 'ltp')}</th>
                  <th class="sortable" id="futbld-${k}-th-chg"  onclick="sortFutbldCol('${k}','chg')">Chg %${_fbArrow(k, 'chg')}</th>
                  <th class="sortable" id="futbld-${k}-th-cap"  onclick="sortFutbldCol('${k}','cap')">Cap${_fbArrow(k, 'cap')}</th>
                  <th class="sortable" id="futbld-${k}-th-rvol" onclick="sortFutbldCol('${k}','rvol')">RVOL${_fbArrow(k, 'rvol')}</th>
                  <th class="sortable" id="futbld-${k}-th-lin"  onclick="sortFutbldCol('${k}','lin')">Linearity${_fbArrow(k, 'lin')}</th>
                  <th class="sortable" id="futbld-${k}-th-gap"  onclick="sortFutbldCol('${k}','gap')">Gap${_fbArrow(k, 'gap')}</th>
                  <th class="sortable" id="futbld-${k}-th-fhv"  onclick="sortFutbldCol('${k}','fhv')">FH VOL${_fbArrow(k, 'fhv')}</th>
                  <th class="sortable" id="futbld-${k}-th-tc"   onclick="sortFutbldCol('${k}','tc')">TC${_fbArrow(k, 'tc')}</th>
                  <th class="sortable" id="futbld-${k}-th-piv"  onclick="sortFutbldCol('${k}','piv')">Pivot${_fbArrow(k, 'piv')}</th>
                  <th class="sortable" id="futbld-${k}-th-bc"   onclick="sortFutbldCol('${k}','bc')">BC${_fbArrow(k, 'bc')}</th>

              </div>

    function toggleFutbldPanel() {
      _futbldOpen = !_futbldOpen;
      document.getElementById('futbld-body').classList.toggle('open', _futbldOpen);
      document.getElementById('futbld-arrow').textContent = _futbldOpen ? '▲' : '▼';
      if (_futbldOpen && !_futbldData) fetchFuturesBuildup();
    }

    function toggleFutbldGroup(grp) {
      _futbldGroupOpen[grp] = !_futbldGroupOpen[grp];
      const open = _futbldGroupOpen[grp];
      document.getElementById(`futbld-${grp}-wrap`).style.display = open ? '' : 'none';
      document.getElementById(`futbld-${grp}-arrow`).textContent = open ? '▼' : '▶';
    }

    function sortFutbldCol(grp, col) {
      const s = _futbldSort[grp];
      if (s.col === col) {
        s.dir = s.dir === 'desc' ? 'asc' : 'desc';  // toggle
      } else {
        s.col = col;
        s.dir = col === 'sym' ? 'asc' : 'desc';     // default: desc for numbers, asc for symbol
      }
      if (_futbldData) renderFutbldGroup(grp, _futbldData.stocks);
    }

    function _buildupBadgeClass(buildup) {
      return buildup.toLowerCase().replace(/ /g, '-');
    }

    const _futbldCapOpen = {};

    function toggleFutbldCapSection(grp, capKey) {
      const k = `${grp}_${capKey}`;
      _futbldCapOpen[k] = _futbldCapOpen[k] === false ? true : false;
      if (_futbldData) renderFutbldGroup(grp, _futbldData.stocks);
    }

    function renderFutbldGroup(grp, stocks) {
      const grpCfg = FUTBLD_GROUPS.find(g => g.key === grp);
      if (!grpCfg) return;
      let rows = stocks.filter(s => s.buildup === grpCfg.label);

      const { col, dir } = _futbldSort[grp];
      const asc = dir === 'asc';
      const nullLast = (v) => v == null ? (asc ? Infinity : -Infinity) : v;

      if (col === 'sym') {
        rows.sort((a, b) => asc ? a.symbol.localeCompare(b.symbol) : b.symbol.localeCompare(a.symbol));
      } else if (col === 'ltp') {
        rows.sort((a, b) => asc ? a.ltp - b.ltp : b.ltp - a.ltp);
      } else if (col === 'chg') {
        rows.sort((a, b) => asc ? a.spot_chg_pct - b.spot_chg_pct : b.spot_chg_pct - a.spot_chg_pct);
      } else if (col === 'cap') {
        rows.sort((a, b) => asc
          ? (CAP_ORDER[a.cap] ?? 9) - (CAP_ORDER[b.cap] ?? 9)
          : (CAP_ORDER[b.cap] ?? 9) - (CAP_ORDER[a.cap] ?? 9));
      } else if (col === 'rvol') {
        rows.sort((a, b) => asc ? nullLast(a.rvol) - nullLast(b.rvol) : nullLast(b.rvol) - nullLast(a.rvol));
      } else if (col === 'lin') {
        rows.sort((a, b) => asc ? nullLast(a.linearity) - nullLast(b.linearity) : nullLast(b.linearity) - nullLast(a.linearity));
      } else if (col === 'gap') {
        rows.sort((a, b) => asc ? nullLast(a.gap_pct) - nullLast(b.gap_pct) : nullLast(b.gap_pct) - nullLast(a.gap_pct));
      } else if (col === 'fhv') {
        rows.sort((a, b) => asc ? nullLast(a.fh_spurt) - nullLast(b.fh_spurt) : nullLast(b.fh_spurt) - nullLast(a.fh_spurt));
      } else if (col === 'tc' || col === 'piv' || col === 'bc') {
        const pairScore = (pairStr) => {
          if (!pairStr) return null;
          const [t, b] = pairStr.split('/');
          let s = 0;
          if (t === 'Y') s += 2;
          if (b === 'Y') s += 1;
          return s;
        };
        const getScore = (s) => s.cpr ? pairScore(s.cpr[col]) : null;
        rows.sort((a, b) => asc ? nullLast(getScore(a)) - nullLast(getScore(b)) : nullLast(getScore(b)) - nullLast(getScore(a)));
      } else {
        // Default: cap-size order (L→M→S)
        rows.sort((a, b) => (CAP_ORDER[a.cap] ?? 9) - (CAP_ORDER[b.cap] ?? 9));
      }

      const countEl = document.getElementById(`futbld-${grp}-count`);
      if (countEl) countEl.innerHTML = `(${rows.length})${grpCfg.desc ? `<span style="font-weight:400;opacity:0.85;">${grpCfg.desc}</span>` : ''}`;

      // Update all sortable column header arrows
      const COLS = ['sym', 'ltp', 'chg', 'cap', 'rvol', 'lin', 'gap', 'fhv', 'tc', 'piv', 'bc'];
      const LABELS = { sym: 'Symbol', ltp: 'Spot LTP', chg: 'Chg %', cap: 'Cap', rvol: 'RVOL', lin: 'Linearity', gap: 'Gap', fhv: 'FH VOL', tc: 'TC', piv: 'Pivot', bc: 'BC' };
      COLS.forEach(c => {
        const th = document.getElementById(`futbld-${grp}-th-${c}`);
        if (!th) return;
        const arrow = col === c ? (dir === 'asc' ? ' ▴' : ' ▾') : '<span style="opacity:0.25;"> ⇅</span>';
        th.innerHTML = `${LABELS[c]}${arrow}`;
        th.onclick = () => sortFutbldCol(grp, c);
      });

      const tbody = document.getElementById(`futbld-${grp}-tbody`);
      if (!tbody) return;

      if (!rows.length) {
        tbody.innerHTML = `<tr><td colspan="12" style="text-align:center;padding:10px;color:var(--text-muted);font-size:0.62rem;">No data</td></tr>`;
        return;
      }

      const getCapCategoryKey = (capStr) => {
        if (!capStr) return 'small';
        const c = String(capStr).toLowerCase();
        if (c.includes('large') || c === 'l') return 'large';
        if (c.includes('mid') || c === 'm') return 'mid';
        return 'small';
      };

      const renderStockRow = (s) => {
        const chgCls = s.spot_chg_pct > 0 ? 'up' : s.spot_chg_pct < 0 ? 'dn' : 'flat';
        const chgSign = s.spot_chg_pct > 0 ? '+' : '';
        const ltpFmt = s.ltp >= 1000 ? s.ltp.toLocaleString('en-IN', { maximumFractionDigits: 1 }) : s.ltp.toFixed(2);
        const badge = _buildupBadgeClass(s.buildup);
        const capShort = CAP_SHORT[s.cap] || '?';
        const capCss = CAP_CSS[s.cap] || '';

        // RVOL badge
        let rvolHtml = '<span style="color:var(--text-muted);font-size:0.68rem;">—</span>';
        if (s.rvol != null) {
          const rc = s.rvol >= 3 ? '#ff7b72' : s.rvol >= 2 ? '#3fb950' : s.rvol >= 1 ? '#e3b341' : '#8b949e';
          const rp = s.rvol >= 3 ? '🔥' : s.rvol >= 2 ? '⚡' : s.rvol >= 1 ? '▲' : '▽';
          rvolHtml = `<span style="font-size:0.68rem;font-weight:700;color:${rc};">${rp} ${s.rvol}x</span>`;
        }

        // Linearity badge
        let linHtml = '<span style="color:var(--text-muted);font-size:0.68rem;">—</span>';
        if (s.linearity != null) {
          linHtml = `<span style="font-size:0.68rem;color:var(--text-muted);">📏 ${s.linearity}%</span>`;
        }

        // Gap badge
        let gapHtml = '<span style="color:var(--text-muted);font-size:0.68rem;">—</span>';
        if (s.gap_pct != null) {
          const gc = s.gap_pct > 0 ? 'var(--green)' : s.gap_pct < 0 ? 'var(--red)' : 'var(--text-muted)';
          const gs = s.gap_pct > 0 ? '+' : '';
          gapHtml = `<span style="font-size:0.68rem;font-weight:600;color:${gc};">${gs}${s.gap_pct.toFixed(2)}%</span>`;
        }

        // FH VOL badge
        let fhHtml = '<span style="color:var(--text-muted);font-size:0.68rem;">—</span>';
        if (s.fh_spurt != null && s.fh_cumul != null) {
          let fhColor = '#8b949e';
          if (s.fh_tag === 'Abnormal') fhColor = '#3fb950';
          else if (s.fh_tag === 'Elevated') fhColor = '#e3b341';
          else if (s.fh_tag === 'Weak') fhColor = '#ff7b72';
          fhHtml = `<span style="font-size:0.68rem;color:${fhColor};" title="Slot: ${s.fh_spurt}x | 1H Pace: ${s.fh_cumul}x">${s.fh_spurt}x<br><span style='font-size:0.6rem;opacity:0.7;'>${s.fh_cumul}x</span></span>`;
        }

        // Helper to format Top/Bottom Y/N pairs
        const fmtPair = (pairStr) => {
          if (!pairStr) return '<span style="color:var(--text-muted);font-size:0.68rem;">—</span>';
          const parts = pairStr.split('/');
          const t = parts[0] || 'N', b = parts[1] || 'N';
          const tCls = t === 'Y' ? 'color:#3fb950;font-weight:700;' : 'color:#7d8590;';
          const bCls = b === 'Y' ? 'color:#3fb950;font-weight:700;' : 'color:#7d8590;';
          return `<span style="font-size:0.68rem;"><span style="${tCls}">${t}</span>/<span style="${bCls}">${b}</span></span>`;
        };

        const ceSC = (grp === 'sc' || grp === 'lb') && s.ce_sc_above_atm === true;
        let symStyle = '';
        let symTitle = '';
        if (s.open_vs_pdh_pdl === 'above_pdh') {
          symStyle = 'color: #3fb950; font-weight: 700;';
          symTitle = `Opened Above PDH (Open ₹${s.spot_open ?? '—'} vs PDH ₹${s.pdh ?? '—'})`;
        } else if (s.open_vs_pdh_pdl === 'below_pdl') {
          symStyle = 'color: #ff7b72; font-weight: 700;';
          symTitle = `Opened Below PDL (Open ₹${s.spot_open ?? '—'} vs PDL ₹${s.pdl ?? '—'})`;
        }

        return `<tr class="${ceSC ? 'futbld-row-ce-sc' : ''}">
          <td><span class="futbld-badge ${badge}"${ceSC ? ' title="CE writers covering above ATM — double confirmation"' : ''}>${s.buildup}${ceSC ? ' ⚡' : ''}</span></td>
          <td class="futbld-sym"${symStyle ? ` style="${symStyle}"` : ''}${symTitle ? ` title="${symTitle}"` : ''}>${s.symbol}</td>
          <td>₹${ltpFmt}</td>
          <td class="futbld-chg ${chgCls}">${chgSign}${s.spot_chg_pct.toFixed(2)}%</td>
          <td><span class="futbld-cap-tag ${capCss}">${capShort}</span></td>
          <td>${rvolHtml}</td>
          <td>${linHtml}</td>
          <td>${gapHtml}</td>
          <td>${fhHtml}</td>
          <td>${fmtPair(s.cpr ? s.cpr.tc : null)}</td>
          <td>${fmtPair(s.cpr ? s.cpr.piv : null)}</td>
          <td>${fmtPair(s.cpr ? s.cpr.bc : null)}</td>
        </tr>`;
      };

      // If user sorted by a specific column (e.g. Chg %, RVOL), show flat list
      if (col && col !== 'cap') {
        tbody.innerHTML = rows.map(renderStockRow).join('');
        return;
      }

      // Group into sub-sections by Market Cap: Large Cap, Mid Cap, Small Cap
      const capGroups = [
        { key: 'large', label: 'LARGE CAP', css: 'large' },
        { key: 'mid',   label: 'MID CAP',   css: 'mid' },
        { key: 'small', label: 'SMALL CAP', css: 'small' }
      ];

      let subSectionHtml = '';
      capGroups.forEach(cg => {
        const bucketRows = rows.filter(r => getCapCategoryKey(r.cap) === cg.key);
        if (bucketRows.length > 0) {
          const secKey = `${grp}_${cg.key}`;
          const isOpen = _futbldCapOpen[secKey] !== false; // default open
          const arrow = isOpen ? '▼' : '▶';

          subSectionHtml += `<tr class="futbld-cap-subrow" onclick="toggleFutbldCapSection('${grp}', '${cg.key}')" style="cursor:pointer;user-select:none;" title="Click to ${isOpen ? 'collapse' : 'expand'} ${cg.label} section">
            <td colspan="12" style="background:rgba(255,255,255,0.035);border-top:1px solid rgba(255,255,255,0.1);border-bottom:1px solid rgba(255,255,255,0.05);padding:6px 12px;font-size:0.65rem;font-weight:700;letter-spacing:0.04em;">
              <span style="font-size:0.6rem;margin-right:6px;color:var(--text-muted);display:inline-block;width:10px;">${arrow}</span>
              <span class="futbld-cap-tag ${cg.css}" style="margin-right:8px;font-size:0.62rem;padding:3px 9px;font-weight:700;">${cg.label}</span>
              <span style="color:var(--text-muted);font-weight:500;font-size:0.65rem;">(${bucketRows.length} ${bucketRows.length === 1 ? 'Stock' : 'Stocks'})</span>
            </td>
          </tr>`;

          if (isOpen) {
            subSectionHtml += bucketRows.map(renderStockRow).join('');
          }
        }
      });

      tbody.innerHTML = subSectionHtml || rows.map(renderStockRow).join('');
    }

    function renderFuturesBuildup(data) {
      _futbldData = data;
      const countPill = document.getElementById('futbld-count-pill');
      if (countPill) countPill.textContent = `${data.count} Stocks`;
      const updEl = document.getElementById('futbld-updated-at');
      if (updEl) updEl.textContent = data.updated_at ? `· ${data.updated_at}` : '';

      FUTBLD_GROUPS.forEach(g => renderFutbldGroup(g.key, data.stocks));
    }

    async function fetchFuturesBuildup() {
      try {
        const res = await fetch('/api/futures-buildup');
        if (!res.ok) return;
        const data = await res.json();
        if (data.error) return;
        renderFuturesBuildup(data);
      } catch (e) { }
    }

    // Poll every 60s when panel is open
    setInterval(() => {
      if (_futbldOpen) fetchFuturesBuildup();
    }, 60000);

  </script>
</body>

</html>
