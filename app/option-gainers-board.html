              </div>
            </div>
            <div class="right-bar-list" id="crossover-list-bulls" style="flex:1; overflow-y:auto;">
              <div class="empty-state" style="padding: 15px 0;">
                <div class="spinner" style="width: 16px; height: 16px;"></div>
              </div>
            </div>
            <div class="right-bar-footer" style="padding: 6px 10px; font-size: 0.62rem; display:flex; justify-content:space-between; border-top:1px solid var(--border2); color:var(--text-muted);">
              <span>Updated: <span id="crossover-time-bulls">—</span></span>
            </div>
          </div>

          <!-- Bears Column -->
          <div class="board-right-bar bears-card">
            <div class="right-bar-header" style="padding: 10px 14px; border-bottom: 1px solid var(--border2);">
              <div class="right-bar-title-wrap" style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 6px;">
                <h3 style="color:#ff7b72; font-size:0.85rem; margin:0; display:flex; align-items:center; gap:6px;">🔴 Bears <span class="badge" id="crossover-count-bears" style="background:rgba(255,123,114,0.15); color:#ff7b72; font-size:0.68rem; padding:1px 5px; border-radius:10px; font-weight:600;">0</span></h3>
                <span class="pulse-dot active" id="crossover-pulse-bears"></span>
              </div>
              <div class="crossover-filters" style="display:flex; gap:3px;">
                <button class="filter-btn compact" id="crossover-filter-all-bears" onclick="setCrossoverFilterBears('all')" style="font-size:0.6rem; padding:2px 6px;">All</button>
                <button class="filter-btn compact" id="crossover-filter-aligned-bears" onclick="setCrossoverFilterBears('aligned')" style="font-size:0.6rem; padding:2px 6px;">Aligned</button>
                <button class="filter-btn compact" id="crossover-filter-cross-bears" onclick="setCrossoverFilterBears('cross')" style="font-size:0.6rem; padding:2px 6px;">Cross</button>
              </div>
            </div>
            <div class="right-bar-list" id="crossover-list-bears" style="flex:1; overflow-y:auto;">
              <div class="empty-state" style="padding: 15px 0;">
                <div class="spinner" style="width: 16px; height: 16px;"></div>
              </div>
            </div>
            <div class="right-bar-footer" style="padding: 6px 10px; font-size: 0.62rem; display:flex; justify-content:space-between; border-top:1px solid var(--border2); color:var(--text-muted);">
              <span>Updated: <span id="crossover-time-bears">—</span></span>
            </div>
          </div>

          <!-- Live Breakouts Column (Vertical!) -->
          <div class="board-right-bar live-breakouts-card" style="border: 1px solid rgba(255, 215, 0, 0.25); box-shadow: 0 0 10px rgba(255, 215, 0, 0.02);">
            <div class="right-bar-header" style="padding: 10px 14px; border-bottom: 1px solid rgba(255,255,255,0.06); display:flex; justify-content:space-between; align-items:center; min-height:46px;">
              <div style="display:flex; flex-direction:column; gap:2px;">
                <h3 style="color:#ffd700; font-size:0.85rem; margin:0; display:flex; align-items:center; gap:6px; font-weight:700;">
                  ⚡ Live Breakouts 
                  <span class="badge" id="live-total-count" style="background:rgba(255,215,0,0.12); color:#ffd700; font-size:0.65rem; padding:1px 5px; border-radius:10px; font-weight:600; line-height:1;">0</span>
                </h3>
                <div id="live-squeeze-watchlist-subtitle" style="font-size:0.58rem; color:var(--text-muted); font-weight:500;">
                  Squeeze watchlist: 0 stocks being monitored
                </div>
              </div>
              <span class="pulse-dot active" style="background:#ffd700; box-shadow:0 0 8px rgba(255,215,0,0.6); width:7px; height:7px;"></span>
            </div>

            <!-- Split list vertically with equal space for Alerts and Squeezes -->
            <div style="flex:1; display:flex; flex-direction:column; min-height:0; overflow:hidden; padding:10px 12px; gap:12px;">
              <!-- Section 1: Alerts -->
              <div style="flex:1; display:flex; flex-direction:column; min-height:0;">
                <div class="breakout-row-label" style="font-size:0.65rem; font-weight:700; color:var(--text-muted); display:flex; align-items:center; gap:5px; margin-bottom:6px; flex-shrink:0;">
                  <span>🔔 ALERTS TODAY</span>
                  <span class="badge" id="live-alert-count" style="background:rgba(255,215,0,0.12); color:#ffd700; font-size:0.55rem; padding:0px 4px; border-radius:10px; font-weight:700; line-height:1.2;">0</span>
                </div>
                <div id="live-alert-list" style="flex:1; overflow-y:auto; display:flex; flex-direction:column; gap:6px; padding-right:2px;">
                  <div style="font-size:0.58rem; color:var(--text-muted);">⏳ Waiting for breakouts…</div>
                </div>
              </div>

              <div style="border-bottom:1px solid rgba(255,255,255,0.05); margin:2px 0; flex-shrink:0;"></div>

              <!-- Section 2: Squeezes -->
              <div style="flex:1; display:flex; flex-direction:column; min-height:0;">
                <div class="breakout-row-label" style="font-size:0.65rem; font-weight:700; color:var(--text-muted); display:flex; align-items:center; gap:5px; margin-bottom:6px; flex-shrink:0;">
                  <span>📡 SQUEEZE WATCHLIST</span>
                  <span class="badge" id="live-squeeze-count" style="background:rgba(210,153,34,0.15); color:#e3b341; font-size:0.55rem; padding:0px 4px; border-radius:10px; font-weight:700; line-height:1.2;">0</span>
                </div>
                <div id="live-squeeze-list" style="flex:1; overflow-y:auto; display:flex; flex-direction:column; gap:6px; padding-right:2px;">
                  <div style="font-size:0.58rem; color:var(--text-muted);">No active squeezes</div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>`;

      // Save scroll focus/value
      const listBullsEl = document.getElementById('crossover-list-bulls');
      const savedScrollBulls = listBullsEl ? listBullsEl.scrollTop : 0;

      const listBearsEl = document.getElementById('crossover-list-bears');
      const savedScrollBears = listBearsEl ? listBearsEl.scrollTop : 0;

      const listAlertsEl = document.getElementById('live-alert-list');
      const savedScrollAlerts = listAlertsEl ? listAlertsEl.scrollTop : 0;

      const listSqueezesEl = document.getElementById('live-squeeze-list');
      const savedScrollSqueezes = listSqueezesEl ? listSqueezesEl.scrollTop : 0;

      showBoard(html);

      // Update filters active buttons
      document.querySelectorAll('.bulls-card .filter-btn').forEach(btn => btn.classList.remove('active'));
      const activeBullsBtn = document.getElementById(`crossover-filter-${crossoverFilterBulls}-bulls`);
      if (activeBullsBtn) activeBullsBtn.classList.add('active');

      document.querySelectorAll('.bears-card .filter-btn').forEach(btn => btn.classList.remove('active'));
      const activeBearsBtn = document.getElementById(`crossover-filter-${crossoverFilterBears}-bears`);
      if (activeBearsBtn) activeBearsBtn.classList.add('active');

      // Populate crossovers lists
      renderCrossovers();

      // Re-populate live breakouts and squeezes (since innerHTML was overwritten)
      renderLiveBreakouts();

      // Restore scroll tops
      const newListBullsEl = document.getElementById('crossover-list-bulls');
      if (newListBullsEl) {
        newListBullsEl.scrollTop = savedScrollBulls;
      }
      const newListBearsEl = document.getElementById('crossover-list-bears');
      if (newListBearsEl) {
        newListBearsEl.scrollTop = savedScrollBears;
      }
      const newListAlertsEl = document.getElementById('live-alert-list');
      if (newListAlertsEl) {
        newListAlertsEl.scrollTop = savedScrollAlerts;
      }
      const newListSqueezesEl = document.getElementById('live-squeeze-list');
      if (newListSqueezesEl) {
        newListSqueezesEl.scrollTop = savedScrollSqueezes;
      }

      // Fetch confluence for all visible symbols (async, non-blocking)
      fetchConfluence(stocks.map(s => s.symbol));
    }

    function filterContracts(contracts) {
      return contracts.filter(c => {
        if (activeTypeFilter !== 'all' && c.opt_type !== activeTypeFilter) return false;
        if (activeLayerFilter === 'opening' && !c.is_opening) return false;
        if (activeLayerFilter === 'running' && c.is_opening) return false;
        return true;
      });
    }

    function updateStats(data) {
      document.getElementById('st-tracked').textContent = (data.total_tracked || 0).toLocaleString('en-IN');
      document.getElementById('st-positive').textContent = (data.total_positive || 0).toLocaleString('en-IN');
      document.getElementById('st-stocks').textContent = (data.n_stocks || 0).toLocaleString('en-IN');
      if (data.last_updated) {
        const t = new Date(data.last_updated);
        document.getElementById('st-time').textContent =
          t.toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit' });
        document.getElementById('st-date').textContent = data.date || '';
      } else {
        document.getElementById('st-time').textContent = 'Waiting…';
        document.getElementById('st-date').textContent = 'Scanner not yet active';
      }
    }

    function showBoard(html) {
      document.getElementById('board').innerHTML = html;
    }

    // ── Confluence ────────────────────────────────────────────────────
    async function fetchConfluence(symbols) {
      if (!symbols || !symbols.length) return;
      try {
        const res = await fetch('/api/confluence?symbols=' + symbols.join(','));
        if (!res.ok) return;
        const data = await res.json();
        const TF_ORDER = [
          { label: 'D', key: 'day', name: 'Daily' },
          { label: '1H', key: '1h', name: '1 Hour' },
          { label: '15M', key: '15m', name: '15 Min' },
        ];
        for (const [symbol, tfs] of Object.entries(data)) {
          const row = document.getElementById('conf-' + symbol);
          if (!row) continue;
          row.innerHTML = TF_ORDER.map(({ label, key, name }) => {
            const sig = tfs[key] || {};
            const overall = sig.overall || 'neutral';
            const tip = `${name}: RSI ${sig.rsi ?? '—'} · MACD ${sig.macd || '—'} · EMA ${sig.ema || '—'}`;
            return `<span class="conf-pill conf-${overall}" title="${tip}">${label}</span>`;
          }).join('');
        }
      } catch (e) {
        // Confluence is non-critical — fail silently
      }
    }

    // ── EMA Crossovers ────────────────────────────────────────────────────────
    // ── EMA Crossovers ────────────────────────────────────────────────────────
    let crossoverData = null;
    let crossoverFilterBulls = 'all';
    let crossoverFilterBears = 'all';

    let _emaPollTimer = null;

    async function fetchEmaCrossovers() {
      try {
        const res = await fetch('/api/ema-crossovers');
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();
        crossoverData = data;
        renderCrossovers();

        // Fast-poll every 3s while backend is actively scanning
        if (_emaPollTimer) clearTimeout(_emaPollTimer);
        if (data.status === 'scanning') {
          _emaPollTimer = setTimeout(fetchEmaCrossovers, 3000);
        } else {
          // Outside market hours with no EOD data yet — poll slowly to keep
          // client heartbeat alive so the backend EOD scan can complete (~2 min).
          const _istPoll = new Date(new Date().toLocaleString('en-US', { timeZone: 'Asia/Kolkata' }));
          const _hPoll = _istPoll.getHours(), _mPoll = _istPoll.getMinutes();
          const _inMktPoll = (_hPoll === 9 && _mPoll >= 15) || (_hPoll >= 10 && _hPoll < 15) || (_hPoll === 15 && _mPoll <= 30);
          const hasEodData = data.crossovers && Object.keys(data.crossovers).length > 0;
          if (!_inMktPoll && !hasEodData) {
            _emaPollTimer = setTimeout(fetchEmaCrossovers, 15000); // keep heartbeat until EOD scan done
          }
          // hasEodData or in market hours → no further auto-poll needed
        }
      } catch (e) {
        console.error('Error fetching crossovers:', e);
      }
    }

    function setCrossoverFilterBulls(filter) {
      crossoverFilterBulls = filter;
      document.querySelectorAll('.bulls-card .filter-btn').forEach(btn => btn.classList.remove('active'));
      const activeBtn = document.getElementById(`crossover-filter-${filter}-bulls`);
      if (activeBtn) activeBtn.classList.add('active');
      renderCrossovers();
    }

    function setCrossoverFilterBears(filter) {
      crossoverFilterBears = filter;
      document.querySelectorAll('.bears-card .filter-btn').forEach(btn => btn.classList.remove('active'));
      const activeBtn = document.getElementById(`crossover-filter-${filter}-bears`);
      if (activeBtn) activeBtn.classList.add('active');
      renderCrossovers();
    }

    function renderCrossovers() {
      const listBulls = document.getElementById('crossover-list-bulls');
      const listBears = document.getElementById('crossover-list-bears');
      const timeBulls = document.getElementById('crossover-time-bulls');
      const timeBears = document.getElementById('crossover-time-bears');
      const pulseBulls = document.getElementById('crossover-pulse-bulls');
      const pulseBears = document.getElementById('crossover-pulse-bears');
      const countBulls = document.getElementById('crossover-count-bulls');
      const countBears = document.getElementById('crossover-count-bears');

      if (!crossoverData) return;

      const _istNow = new Date(new Date().toLocaleString('en-US', { timeZone: 'Asia/Kolkata' }));
      const _hNow = _istNow.getHours(), _mNow = _istNow.getMinutes();
      const _inMktNow = (_hNow === 9 && _mNow >= 15) || (_hNow >= 10 && _hNow < 15) || (_hNow === 15 && _mNow <= 30);

      let timeText = '—';
      if (crossoverData.last_update) {
        const parts = crossoverData.last_update.split(' '); // ["2026-05-26", "15:28:45"]
        if (!_inMktNow && parts.length >= 2) {
          // Outside market hours — show full EOD label: "📸 EOD · 26-May 15:28"
          const timePart = parts[1].substring(0, 5);
          const [yr, mo, dy] = parts[0].split('-');
          const monName = new Date(+yr, +mo - 1).toLocaleString('en-US', { month: 'short' });
          timeText = `📸 EOD &nbsp;·&nbsp; ${dy}-${monName} ${timePart}`;
        } else {
          timeText = parts[1] || crossoverData.last_update; // time only during live hours
        }
      }
      if (timeBulls) timeBulls.innerHTML = timeText;
      if (timeBears) timeBears.innerHTML = timeText;

      const updatePulse = (pulseEl) => {
        if (!pulseEl) return;
        if (crossoverData.status === 'scanning') {
          pulseEl.style.background = '#d29922';
          pulseEl.classList.add('active');
        } else if (crossoverData.status === 'completed') {
          pulseEl.style.background = '#238636';
          pulseEl.classList.add('active');
        } else {
          pulseEl.classList.remove('active');
        }
      };
      updatePulse(pulseBulls);
      updatePulse(pulseBears);

      const crossovers = crossoverData.crossovers || {};
      const allKeys = Object.keys(crossovers);

      // Separate into Bulls and Bears
      let bullKeys = [];
      let bearKeys = [];

      allKeys.forEach(k => {
        const item = crossovers[k];
        const states = [item.state_5m, item.state_15m, item.state_1h, item.state_day];
        const bullCount = states.filter(s => s === 'bullish').length;
        const bearCount = states.filter(s => s === 'bearish').length;

        const hasBullCross = item.cross_5m === 'bullish' || item.cross_15m === 'bullish' || item.cross_1h === 'bullish' || item.cross_day === 'bullish';
        const hasBearCross = item.cross_5m === 'bearish' || item.cross_15m === 'bearish' || item.cross_1h === 'bearish' || item.cross_day === 'bearish';

        let isBull = false;
        if (item.alignment === 'bullish' || hasBullCross) {
          isBull = true;
        } else if (item.alignment === 'bearish' || hasBearCross) {
          isBull = false;
        } else {
          isBull = bullCount > bearCount;
        }

        if (isBull) {
          bullKeys.push(k);
        } else {
          bearKeys.push(k);
        }
      });

      // Apply Button Filters to Bulls
      if (crossoverFilterBulls === 'aligned') {
        bullKeys = bullKeys.filter(k => crossovers[k].alignment === 'bullish');
      } else if (crossoverFilterBulls === 'cross') {
        bullKeys = bullKeys.filter(k => crossovers[k].cross_5m === 'bullish' || crossovers[k].cross_15m === 'bullish' || crossovers[k].cross_1h === 'bullish' || crossovers[k].cross_day === 'bullish');
      }

      // Apply Button Filters to Bears
      if (crossoverFilterBears === 'aligned') {
        bearKeys = bearKeys.filter(k => crossovers[k].alignment === 'bearish');
      } else if (crossoverFilterBears === 'cross') {
        bearKeys = bearKeys.filter(k => crossovers[k].cross_5m === 'bearish' || crossovers[k].cross_15m === 'bearish' || crossovers[k].cross_1h === 'bearish' || crossovers[k].cross_day === 'bearish');
      }

      const sortKeys = (keysList) => {
        keysList.sort((a, b) => {
          const cA = crossovers[a];
          const cB = crossovers[b];

          // Helper to get timeframe group priority and candle size
          const getTimeframeGroup = (item) => {
            if (item.cross_5m === 'bullish' || item.cross_5m === 'bearish') {
              return { rank: 4, size: item.cross_candle_size_5m || 0 };
            }
            if (item.cross_15m === 'bullish' || item.cross_15m === 'bearish') {
              return { rank: 3, size: item.cross_candle_size_15m || 0 };
            }
            if (item.cross_1h === 'bullish' || item.cross_1h === 'bearish') {
              return { rank: 2, size: item.cross_candle_size_1h || 0 };
            }
            if (item.cross_day === 'bullish' || item.cross_day === 'bearish') {
              return { rank: 1, size: item.cross_candle_size_day || 0 };
            }
            return { rank: 0, size: 0 };
          };

          const gA = getTimeframeGroup(cA);
          const gB = getTimeframeGroup(cB);

          // Tier 1: Group by timeframe priority (5M first, then 15M, then 1H, then Daily)
          if (gA.rank !== gB.rank) {
            return gB.rank - gA.rank;
          }

          // Tier 2: Within the same timeframe group, sort by candle strength (largest first)
          if (gA.rank > 0) {
            if (Math.abs(gA.size - gB.size) > 0.01) {
              return gB.size - gA.size;
            }
          }

          // Tier 3: Fallback to existing order (most recent epoch timestamp first)
          const epochA = Math.max(cA.cross_epoch_5m || 0, cA.cross_epoch_15m || 0, cA.cross_epoch_1h || 0, cA.cross_epoch_day || 0);
          const epochB = Math.max(cB.cross_epoch_5m || 0, cB.cross_epoch_15m || 0, cB.cross_epoch_1h || 0, cB.cross_epoch_day || 0);
          if (epochA !== epochB) return epochB - epochA;

          return a.localeCompare(b);
        });
      };
      sortKeys(bullKeys);
      sortKeys(bearKeys);

      if (countBulls) countBulls.textContent = bullKeys.length;
      if (countBears) countBears.textContent = bearKeys.length;

      const nowSecs = Math.floor(Date.now() / 1000);

      const renderList = (keysList, container) => {
        if (!container) return;

        // Build a tiny, elegant progress bar to display at the top while scanning
        let progressHtml = '';
        if (crossoverData && crossoverData.status === 'scanning') {
          const cur = crossoverData.scan_current || 0;
          const tot = crossoverData.scan_total || 214;
          const pct = tot > 0 ? Math.round((cur / tot) * 100) : 0;
          progressHtml = `
            <div style="padding: 6px 10px; border-bottom: 1px solid var(--border2); background: rgba(210,153,34,0.03); margin-bottom: 6px;">
              <div style="font-size: 0.58rem; color: var(--text-muted); margin-bottom: 3px; display: flex; justify-content: space-between; align-items: center;">
                <span>Scanning FNO symbols…</span>
                <span style="font-weight: 600; color: #e3b341;">${cur}/${tot}</span>
              </div>
              <div style="height: 2px; background: rgba(255,255,255,0.07); border-radius: 1px; overflow: hidden;">
                <div style="height: 100%; width: ${pct}%; background: linear-gradient(90deg, #d29922, #e3b341); border-radius: 1px; transition: width 0.4s ease;"></div>
              </div>
            </div>`;
        }

        if (keysList.length === 0) {
          if (crossoverData && crossoverData.status === 'scanning') {
            container.innerHTML = progressHtml;
          } else {
            // Market-hours-aware empty state
            const _ist = new Date(new Date().toLocaleString('en-US', { timeZone: 'Asia/Kolkata' }));
            const _h = _ist.getHours(), _m = _ist.getMinutes();
            const _inMkt = (_h === 9 && _m >= 15) || (_h >= 10 && _h < 15) || (_h === 15 && _m <= 30);
            let _msg;
            if (!_inMkt) {
              _msg = '🌙 No EOD data yet &nbsp;·&nbsp; Will populate after first live scan';
            } else if (crossoverData.status === 'initializing') {
              _msg = '⏳ Waiting for first scan…';
            } else {
              _msg = 'No symbols found';
            }
            container.innerHTML = `<div style="text-align:center;padding:15px;font-size:0.68rem;color:var(--text-muted);">${_msg}</div>`;
          }
          return;
        }

        container.innerHTML = progressHtml + keysList.map(k => {
          const item = crossovers[k];
          let alignmentClass = 'mixed';
          let alignmentText = 'Mixed';
          if (item.alignment === 'bullish') {
            alignmentClass = 'aligned-bull';
            alignmentText = '🔥 Bullish';
          } else if (item.alignment === 'bearish') {
            alignmentClass = 'aligned-bear';
            alignmentText = '❄️ Bearish';
          }

          // Dynamic Fresh Crossover Badge & New live flag
          let crossBadge = '';
          let activeCrossTime = '';
          if (item.cross_5m === 'bullish') {
            crossBadge = '<span class="cross-pill bullish">▲ 5M Cross</span>';
            activeCrossTime = item.cross_time_5m;
          } else if (item.cross_15m === 'bullish') {
            crossBadge = '<span class="cross-pill bullish">▲ 15M Cross</span>';
            activeCrossTime = item.cross_time_15m;
          } else if (item.cross_1h === 'bullish') {
            crossBadge = '<span class="cross-pill bullish">▲ 1H Cross</span>';
            activeCrossTime = item.cross_time_1h;
          } else if (item.cross_day === 'bullish') {
            crossBadge = '<span class="cross-pill bullish">▲ Daily Cross</span>';
            activeCrossTime = item.cross_time_day;
          } else if (item.cross_5m === 'bearish') {
            crossBadge = '<span class="cross-pill bearish">▼ 5M Cross</span>';
            activeCrossTime = item.cross_time_5m;
          } else if (item.cross_15m === 'bearish') {
            crossBadge = '<span class="cross-pill bearish">▼ 15M Cross</span>';
            activeCrossTime = item.cross_time_15m;
          } else if (item.cross_1h === 'bearish') {
            crossBadge = '<span class="cross-pill bearish">▼ 1H Cross</span>';
            activeCrossTime = item.cross_time_1h;
          } else if (item.cross_day === 'bearish') {
            crossBadge = '<span class="cross-pill bearish">▼ Daily Cross</span>';
            activeCrossTime = item.cross_time_day;
          }

          // Crossover occurred in the last 5 minutes (300 seconds)
          const itemEpoch = Math.max(item.cross_epoch_5m || 0, item.cross_epoch_15m || 0, item.cross_epoch_1h || 0, item.cross_epoch_day || 0);
          const diffSecs = nowSecs - itemEpoch;
          // A fresh 5M cross on the current candle = always flagged NEW (intraday entry signal)
          const has5mFreshCross = item.cross_5m === 'bullish' || item.cross_5m === 'bearish';
          const isNewCrossover = has5mFreshCross || (itemEpoch > 0 && diffSecs >= 0 && diffSecs <= 300);
          const flagMarkup = isNewCrossover ? '<span class="flag-badge">🚩 NEW</span>' : '';
          const itemClass = isNewCrossover ? 'crossover-item new-entry' : 'crossover-item';

          // Find the crossover timeframe that is the most recent (has the largest epoch timestamp)
          const crossoverEpochs = [
            { time: item.cross_time_5m, epoch: item.cross_epoch_5m || 0 },
            { time: item.cross_time_15m, epoch: item.cross_epoch_15m || 0 },
            { time: item.cross_time_1h, epoch: item.cross_epoch_1h || 0 },
            { time: item.cross_time_day, epoch: item.cross_epoch_day || 0 }
          ];
          crossoverEpochs.sort((a, b) => b.epoch - a.epoch);

          let cross_desc = '';
          if (crossoverEpochs[0].epoch > 0) {
            cross_desc = crossoverEpochs[0].time;
          } else {
            cross_desc = item.cross_time_5m || item.cross_time_15m || item.cross_time_1h || item.cross_time_day || '';
          }
          const sub_desc = cross_desc ? `<span class="cross-time-sub" title="Crossover Time">${cross_desc}</span>` : '';

          const pill_5m = item.state_5m === 'bullish' ? 'bullish' : (item.state_5m === 'bearish' ? 'bearish' : '');
          const pill_15m = item.state_15m === 'bullish' ? 'bullish' : (item.state_15m === 'bearish' ? 'bearish' : '');
          const pill_1h = item.state_1h === 'bullish' ? 'bullish' : (item.state_1h === 'bearish' ? 'bearish' : '');
          const pill_day = item.state_day === 'bullish' ? 'bullish' : (item.state_day === 'bearish' ? 'bearish' : '');

          const time_5m = item.cross_time_5m ? ` · Cross: ${item.cross_time_5m}` : '';
          const time_15m = item.cross_time_15m ? ` · Cross: ${item.cross_time_15m}` : '';
          const time_1h = item.cross_time_1h ? ` · Cross: ${item.cross_time_1h}` : '';
          const time_day = item.cross_time_day ? ` · Cross: ${item.cross_time_day}` : '';

          const title_5m = `5M Trend: ${item.state_5m || 'none'}${time_5m}`;
          const title_15m = `15M Trend: ${item.state_15m || 'none'}${time_15m}`;
          const title_1h = `1H Trend: ${item.state_1h || 'none'}${time_1h}`;
          const title_day = `Daily Trend: ${item.state_day || 'none'}${time_day}`;

          return `
          <div class="${itemClass}" style="padding: 4px 6px; border-bottom: 1px solid var(--border2); display: flex; justify-content: space-between; align-items: center; gap: 3px; min-width: 0;">
            <div class="crossover-left" style="display: flex; flex-direction: column; gap: 1px; min-width: 0; flex: 1;">
              <span class="crossover-symbol" style="font-size: 0.65rem; font-weight: 700; display: inline-flex; align-items: center; gap: 2px; flex-wrap: wrap;">
                <span>${k}</span>
                ${flagMarkup ? `<span class="flag-badge" style="font-size: 0.44rem; padding: 0.5px 2px; border-radius: 2px; line-height: 1;">🚩 NEW</span>` : ''}
                ${(() => { const scp = item.spot_change_pct; return scp != null ? `<span style="font-size:0.48rem;font-weight:700;color:${scp >= 0 ? '#3fb950' : '#ff7b72'}">${scp >= 0 ? '▲' : '▼'}${scp >= 0 ? '+' : ''}${scp.toFixed(2)}%</span>` : ''; })()}
              </span>
              <div class="crossover-left-sub" style="display: flex; align-items: center; gap: 2px; margin-top: 1px; flex-wrap: wrap;">
                <span class="alignment-badge ${alignmentClass}" style="font-size: 0.46rem; padding: 0.5px 2.5px; border-radius: 2px;">${alignmentText}</span>
                ${sub_desc}
              </div>
            </div>
            <div class="crossover-right" style="display: flex; flex-direction: column; align-items: flex-end; gap: 2px; flex-shrink: 0;">
              <div class="timeframes-strip" style="display: flex; gap: 2px;">
                <span class="tf-pill ${pill_5m}"  title="${title_5m}">5M</span>
                <span class="tf-pill ${pill_15m}" title="${title_15m}">15M</span>
                <span class="tf-pill ${pill_1h}"  title="${title_1h}">1H</span>
                <span class="tf-pill ${pill_day}" title="${title_day}">D</span>
              </div>
              ${crossBadge}
            </div>
          </div>`;
        }).join('');
      };

      renderList(bullKeys, listBulls);
      renderList(bearKeys, listBears);
    }

    // ── Countdown ─────────────────────────────────────────────────────────────
    function resetCountdown() {
      countdown = REFRESH_INTERVAL;
      if (timerHandle) clearInterval(timerHandle);
      timerHandle = setInterval(() => {
        countdown--;
        document.getElementById('countdown').textContent = countdown + 's';
        if (countdown <= 0) {
          clearInterval(timerHandle);
          fetchBoard();
        }
      }, 1000);
    }

    // ── Toast ─────────────────────────────────────────────────────────────────
    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 2500);
    }

    // ── Live Breakout Polling ─────────────────────────────────────────────────
    let _liveBreakoutData = null;

    async function fetchLiveBreakouts() {
      try {
        const res = await fetch('/api/live-breakouts');
        if (!res.ok) return;
        _liveBreakoutData = await res.json();
        renderLiveBreakouts();
      } catch (e) {
        // Fail silently — non-critical feature
      }
    }

    function renderLiveBreakouts() {
      const data = _liveBreakoutData;
      if (!data) return;

      const alertList = document.getElementById('live-alert-list');
      const squeezeList = document.getElementById('live-squeeze-list');
      const alertCount = document.getElementById('live-alert-count');
      const squeezeCount = document.getElementById('live-squeeze-count');

      if (!alertList || !squeezeList) return;

      const alerts = data.triggered_alerts || [];
      const watches = data.squeeze_watchlist || [];

      // Update counts
      if (alertCount) alertCount.textContent = alerts.length;
      if (squeezeCount) squeezeCount.textContent = watches.length;

      const totalCount = document.getElementById('live-total-count');
      if (totalCount) totalCount.textContent = alerts.length + watches.length;

      const squeezeWatchlistSub = document.getElementById('live-squeeze-watchlist-subtitle');
      if (squeezeWatchlistSub) {
        squeezeWatchlistSub.textContent = `Squeeze watchlist: ${watches.length} stocks being monitored`;
      }

      // Render alert vertical cards
      if (alerts.length === 0) {
        alertList.innerHTML = `<div style="font-size:0.56rem; color:var(--text-muted); padding:3px 0;">⏳ Waiting for breakouts…</div>`;
      } else {
        alertList.innerHTML = [...alerts].reverse().map(a => {
          const isBull = a.direction === 'bullish';
          const isA = a.grade === 'Grade A';
          const pillCls = isA ? (isBull ? 'grade-a' : 'grade-a bearish') : (isBull ? 'grade-b' : 'grade-b bearish');
          const arrow = isBull ? '▲' : '▼';
          const gradeStar = isA ? '★ ' : '';
          return `
            <div class="breakout-alert-pill horizontal ${pillCls}" style="display:flex; justify-content:space-between; width:100%; padding:6px 10px; border-radius:6px; margin:0; box-sizing:border-box;" title="LTP: ₹${a.ltp} · Vol: ×${a.vol_multiplier} · Time: ${a.time}">
              <div style="display:flex; align-items:center; gap:5px;">
                <span style="font-weight:800; color:${isBull ? '#3fb950' : '#ff7b72'}; font-size:0.65rem;">${arrow} ${a.symbol}</span>
                <span style="opacity:0.85; font-size:0.52rem; background:rgba(255,255,255,0.06); padding:1px 3.5px; border-radius:3px; font-weight:700; color:${isBull ? '#3fb950' : '#ff7b72'};">${gradeStar}${a.grade}</span>
              </div>
              <div style="display:flex; align-items:center; gap:6px;">
                <span style="font-family:var(--mono); font-weight:700; color:var(--text); font-size:0.62rem;">₹${a.ltp}</span>
                <span style="opacity:0.65; font-size:0.52rem; color:var(--text-muted); font-weight:600;">×${a.vol_multiplier}</span>
                <span style="opacity:0.5; font-size:0.52rem; color:var(--text-muted); font-family:var(--mono);">${a.time}</span>
              </div>
            </div>`;
        }).join('');
      }

      // Render squeeze vertical cards
      if (watches.length === 0) {
        squeezeList.innerHTML = `<div style="font-size:0.56rem; color:var(--text-muted); padding:3px 0;">No active squeezes</div>`;
      } else {
        squeezeList.innerHTML = [...watches]
          .sort((a, b) => b.squeeze_duration_mins - a.squeeze_duration_mins)
          .map(w => {
            const durLabel = w.squeeze_duration_mins >= 2 ? `${w.squeeze_duration_mins}m` : '<1m';
            return `
              <div class="squeeze-pill horizontal" style="display:flex; justify-content:space-between; width:100%; padding:6px 10px; border-radius:6px; margin:0; box-sizing:border-box;" title="Consolidation Range: ₹${w.consolidation_low}–₹${w.consolidation_high}">
                <div style="display:flex; align-items:center; gap:5px;">
                  <span style="font-weight:800; color:#ffd700; font-size:0.65rem;">◌ ${w.symbol}</span>
                  <span style="opacity:0.85; font-size:0.52rem; background:rgba(255,255,255,0.06); padding:1px 3px; border-radius:3px; font-weight:600; color:#ffd700;">Squeeze</span>
                </div>
                <div style="display:flex; align-items:center; gap:6px;">
                  <span style="font-family:var(--mono); font-weight:700; color:var(--text); font-size:0.62rem;">₹${w.last_ltp}</span>
                  <span style="opacity:0.75; font-size:0.52rem; font-weight:600; background:rgba(210,153,34,0.15); border-radius:3px; padding:1px 3px; color:#e3b341; font-family:var(--mono);">⏳ ${durLabel}</span>
                </div>
              </div>`;
          }).join('');
      }
    }

    // ── Init ──────────────────────────────────────────────────────────────────
    fetchBoard();
    fetchEmaCrossovers();
    fetchLiveBreakouts();

    // Independent EMA crossover poll — survives EOD snapshot pause
    // Only polls during market hours (09:15–15:30 IST, Mon–Fri); data is static after close
    setInterval(() => {
      const now = new Date(new Date().toLocaleString('en-US', { timeZone: 'Asia/Kolkata' }));
      const h = now.getHours(), m = now.getMinutes(), d = now.getDay();
      const inMarket = d >= 1 && d <= 5 &&
        ((h === 9 && m >= 15) || (h >= 10 && h <= 14) || (h === 15 && m <= 30));
      if (inMarket) fetchEmaCrossovers();
    }, 30000);

    // Live Breakout poll — every 15 seconds during market hours
    setInterval(() => {
      const now = new Date(new Date().toLocaleString('en-US', { timeZone: 'Asia/Kolkata' }));
      const h = now.getHours(), m = now.getMinutes(), d = now.getDay();
      const inMarket = d >= 1 && d <= 5 &&
        ((h === 9 && m >= 15) || (h >= 10 && h <= 14) || (h === 15 && m <= 30));
      if (inMarket) fetchLiveBreakouts();
    }, 15000);
  </script>
</body>
